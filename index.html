<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f766e'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='Georgia'%3E%E2%88%91%3C/text%3E%3C/svg%3E">
<style>
:root{
 --bg:#f6f4ef;--card:#ffffff;--ink:#1d2433;--muted:#5f6878;--line:#e3dfd6;
 --accent:#0f766e;--accent-ink:#ffffff;--accent-soft:#d9efec;
 --good:#15803d;--good-soft:#dcfce7;--bad:#b91c1c;--bad-soft:#fee2e2;--warn:#b45309;--warn-soft:#fef3c7;
 --grid:#ebe7de;--axis:#9aa1ad;--plot1:#0f766e;--plot2:#c2410c;--plot3:#6d28d9;
 --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);--r:16px;
}
@media (prefers-color-scheme: dark){
 :root{--bg:#12151c;--card:#1b2029;--ink:#e8eaf0;--muted:#9aa3b2;--line:#2c3340;--accent:#2dd4bf;--accent-ink:#06201d;--accent-soft:#173a37;--good:#4ade80;--good-soft:#123222;--bad:#f87171;--bad-soft:#3a1717;--warn:#fbbf24;--warn-soft:#3a2c0e;--grid:#232a35;--axis:#5d6675;--plot1:#2dd4bf;--plot2:#fb923c;--plot3:#a78bfa;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:1.35rem;margin:0;font-family:Georgia,"Times New Roman",serif}
h2{font-size:.85rem;margin:24px 2px 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.muted{color:var(--muted)} p{margin:.2em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.hero{display:flex;gap:12px;align-items:center;margin:4px 0 16px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 28px Georgia,serif;flex:none}
.streak{display:flex;gap:14px;align-items:center}
.flame{font-size:26px;display:flex;align-items:center;gap:4px;flex:none}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.85rem}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:44px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.alt{background:var(--warn-soft);color:var(--warn)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.big{width:100%;padding:16px;font-size:1.05rem}
.stack{display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.row .btn{flex:1 1 auto}
.list{padding:2px 0}
.trow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.trow:last-child{border-bottom:0}
.tic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.tmain{flex:1;min-width:0}
.tname{display:block;font-weight:600}
.bar{display:block;height:6px;border-radius:6px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.cg{background:var(--good)}.ca{background:var(--warn)}.cr{background:var(--bad)}
.tmeta{font-size:.85rem;color:var(--muted);white-space:nowrap}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.badge{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:10px;text-align:center;opacity:.5;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;border-style:solid;border-color:var(--accent)}
.badge span{font-size:26px;display:block}.badge b{display:block;font-size:.85rem}.badge small{color:var(--muted);font-size:.72rem;line-height:1.25;display:block}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;padding:8px 0;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:.75rem;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.lvl{background:var(--line);color:var(--ink)}
.chip.theme{background:var(--warn-soft);color:var(--warn)}
.qtext{font-size:1.12rem;line-height:1.55;margin:4px 0 14px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;min-height:48px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);text-decoration:line-through;opacity:.85}
.ansrow{display:flex;gap:8px}
.ansrow input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.keys{display:flex;gap:6px;margin-top:8px}
.keys button{flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1.05rem;cursor:pointer}
.fb{margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:500}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.info{background:var(--warn-soft);color:var(--warn)}
.hint{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--accent-soft)}
.steps{margin-top:14px;border-left:3px solid var(--accent);padding-left:12px}
.steps ol{margin:0;padding-left:18px}
.steps li{margin:6px 0}
.final{margin-top:8px;font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;max-width:120px;background:none;border:0;padding:8px 2px 9px;font:inherit;font-size:.68rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button span{font-size:1.25rem;line-height:1}
nav.tabs button.on{color:var(--accent);font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}
.dots button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.75rem;cursor:pointer;padding:0}
.dots button.done{background:var(--accent-soft);border-color:var(--accent)}
.dots button.cur{outline:2px solid var(--accent)}
.score{font:700 2.6rem Georgia,serif;margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
td:last-child,th:last-child{text-align:right}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600}
.rev{border-top:1px solid var(--line);padding:12px 0}.rev:first-child{border-top:0}
.ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
canvas#gc{width:100%;display:block;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.ctrl{margin:12px 0}
.ctrl label{display:flex;justify-content:space-between;font-size:.9rem;font-weight:600}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
select{font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.ginfo div{padding:5px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.ginfo div:last-child{border-bottom:0}
.formula ul{margin:8px 0 0;padding-left:20px}
.formula li{margin:7px 0}
pre.report{white-space:pre-wrap;font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);border-radius:12px;padding:12px;margin:0;max-height:360px;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:40;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.pad{position:fixed;inset:0;background:#fffdf7;z-index:30;display:flex;flex-direction:column}
.pad.hidden{display:none}
.padbar{display:flex;gap:6px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:#f1ede3;border-bottom:1px solid #ddd6c6;flex-wrap:wrap}
.padbar button{border:1px solid #d6cfbf;background:#fff;color:#1d2433;border-radius:10px;padding:8px 10px;font:inherit;font-size:.9rem;cursor:pointer;min-height:40px}
.padbar button.on{outline:2.5px solid #0f766e}
.padbar .sw{width:32px;height:32px;border-radius:50%;padding:0;min-height:0}
.padbar .sp{flex:1}
.padbar label{font-size:.85rem;color:#1d2433;display:flex;align-items:center;gap:4px}
#padc{flex:1;width:100%;touch-action:none;display:block;background-image:linear-gradient(#e9e4d6 1px,transparent 1px);background-size:100% 32px}
.padnote{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#8a8270;font-size:.8rem;pointer-events:none}
</style>
</head>
<body>
<main id="view"></main>

<nav class="tabs" id="tabs">
 <button data-v="home"><span>🏠</span>Home</button>
 <button data-v="practise"><span>✍️</span>Practise</button>
 <button data-v="test"><span>⏱️</span>Test</button>
 <button data-v="graphs"><span>📈</span>Graphs</button>
 <button data-v="formulas"><span>📒</span>Formulas</button>
 <button data-v="report"><span>📤</span>Report</button>
</nav>

 <div class="padbar">
  <button class="sw on" data-c="#1d2433" style="background:#1d2433" aria-label="Black pen"></button>
  <button class="sw" data-c="#1d4ed8" style="background:#1d4ed8" aria-label="Blue pen"></button>
  <button class="sw" data-c="#b91c1c" style="background:#b91c1c" aria-label="Red pen"></button>
  <button id="pSize">Thin</button>
  <button id="pErase">Eraser</button>
  <button id="pUndo">Undo</button>

  <button id="pSave">Save image</button>

 </div>
 <canvas id="padc"></canvas>
 <div class="padnote">Rough work stays with this question until you clear it.</div>
</div>
<div id="toast"></div>

<script>
//DATA START
const TOPICS=[
 {k:'cn',n:'Complex Numbers',ic:'i'},
 {k:'ss',n:'Sequence and Series',ic:'Σ'},
 {k:'pt',n:'Points (Coordinate Geometry)',ic:'•'},
 {k:'sl',n:'Straight Lines',ic:'╱'},
 {k:'ci',n:'Circles',ic:'○'},
 {k:'co',n:'Conic Sections',ic:'⌒'},
 {k:'td',n:'3D Geometry',ic:'3D'},
 {k:'pr',n:'Probability',ic:'⚄'},
 {k:'md',n:'Measures of Dispersion',ic:'σ'}
];
const THEMES={cricket:'🏏 Cricket',music:'🎹 Music',economics:'📈 Economics'};
/* MCQ: the FIRST option in o[] is the correct one (options are shuffled on screen).
   Numeric: a = answer, tol = allowed error, disp = how the answer is shown. */
const BANK=[
// ---------- Complex Numbers ----------
{id:"cn1",t:"cn",l:1,q:"Find the value of i³⁵.",o:["−i","i","1","−1"],h:"Powers of i repeat in a cycle of 4: i, −1, −i, 1.",s:["Divide 35 by 4: 35 = 4 × 8 + 3.","So i³⁵ = (i⁴)⁸ × i³ = 1 × i³.","i³ = i² × i = −1 × i = −i."]},
{id:"cn2",t:"cn",l:1,q:"Simplify (3 + 2i) + (−5 + 4i).",o:["−2 + 6i","8 + 6i","−2 − 2i","2 + 6i"],h:"Add real parts together and imaginary parts together.",s:["Real parts: 3 + (−5) = −2.","Imaginary parts: 2i + 4i = 6i.","Answer: −2 + 6i."]},
{id:"cn3",t:"cn",l:1,q:"Find the modulus |3 − 4i|.",a:5,h:"|a + bi| = √(a² + b²).",s:["|3 − 4i| = √(3² + (−4)²).","= √(9 + 16) = √25 = 5."]},
{id:"cn11",t:"cn",l:1,q:"Write the conjugate of 4 − 7i.",o:["4 + 7i","−4 + 7i","−4 − 7i","7 − 4i"],h:"The conjugate changes only the sign of the imaginary part.",s:["For a + bi, the conjugate is a − bi.","So the conjugate of 4 − 7i is 4 + 7i."]},
{id:"cn4",t:"cn",l:2,q:"Simplify (2 + 3i)(1 − i).",o:["5 + i","−1 + i","5 − i","−1 + 5i"],h:"Expand like ordinary brackets, then replace i² with −1.",s:["(2 + 3i)(1 − i) = 2 − 2i + 3i − 3i².","= 2 + i − 3(−1) = 2 + i + 3.","= 5 + i."]},
{id:"cn5",t:"cn",l:2,q:"Find the multiplicative inverse of 1 + i.",o:["(1 − i)/2","(1 + i)/2","1 − i","(−1 + i)/2"],h:"The inverse is 1/(1 + i). Multiply top and bottom by the conjugate.",s:["1/(1 + i) × (1 − i)/(1 − i).","Denominator: (1 + i)(1 − i) = 1 − i² = 2.","So the inverse is (1 − i)/2."]},
{id:"cn6",t:"cn",l:2,q:"Find the real part of (1 + 2i)/(1 − i). (A fraction like 3/4 is fine.)",a:-0.5,disp:"−1/2",h:"Multiply numerator and denominator by 1 + i.",s:["Numerator: (1 + 2i)(1 + i) = 1 + i + 2i + 2i² = −1 + 3i.","Denominator: (1 − i)(1 + i) = 2.","Result: −1/2 + (3/2)i, so the real part is −1/2."]},
{id:"cn7",t:"cn",l:2,q:"Solve x² + x + 1 = 0.",o:["(−1 ± i√3)/2","(1 ± i√3)/2","(−1 ± √3)/2","−1 ± i√3"],h:"Use the quadratic formula; the discriminant is negative, so √(−3) = i√3.",s:["D = b² − 4ac = 1 − 4 = −3.","x = (−1 ± √(−3))/2.","√(−3) = i√3, so x = (−1 ± i√3)/2."]},
{id:"cn8",t:"cn",l:3,q:"Find the principal argument of z = −1 + i√3.",o:["2π/3","π/3","−π/3","5π/6"],h:"Find the quadrant first: real part negative, imaginary part positive.",s:["z lies in the second quadrant.","Reference angle: tan α = √3/1, so α = π/3.","In the 2nd quadrant, arg z = π − π/3 = 2π/3."]},
{id:"cn9",t:"cn",l:3,q:"Find the square roots of −15 − 8i.",o:["±(1 − 4i)","±(4 − i)","±(1 + 4i)","±(4 + i)"],h:"Let (a + bi)² = −15 − 8i. Compare real and imaginary parts, and use |z| = 17.",s:["a² − b² = −15 and 2ab = −8.","Also a² + b² = |−15 − 8i| = √(225 + 64) = 17.","Adding: 2a² = 2, so a = ±1; then b² = 16, b = ±4.","ab = −4 is negative, so the roots are ±(1 − 4i)."]},
{id:"cn10",t:"cn",l:3,q:"If z = x + iy and |z − 1| = |z + 1|, which set of points does z lie on?",o:["The y-axis (x = 0)","The x-axis (y = 0)","A circle of radius 1","The line y = x"],h:"Write both moduli in terms of x and y, then square.",s:["|z − 1|² = (x − 1)² + y² and |z + 1|² = (x + 1)² + y².","Set equal: (x − 1)² = (x + 1)².","This gives −2x = 2x, so x = 0: the y-axis.","Meaning: the points equally far from 1 and −1."]},
// ---------- Sequence and Series ----------
{id:"ss1",t:"ss",l:1,q:"Find the 10th term of the AP 3, 7, 11, …",a:39,h:"aₙ = a + (n − 1)d.",s:["a = 3, d = 4.","a₁₀ = 3 + 9 × 4 = 39."]},
{id:"ss2",t:"ss",l:1,q:"Find the sum of the first 15 terms of the AP 2, 5, 8, …",a:345,h:"Sₙ = n/2 [2a + (n − 1)d].",s:["a = 2, d = 3, n = 15.","S₁₅ = 15/2 × [4 + 14 × 3] = 15/2 × 46.","= 345."]},
{id:"ss3",t:"ss",l:1,q:"Find the 6th term of the GP 2, 6, 18, …",a:486,h:"aₙ = a·rⁿ⁻¹.",s:["a = 2, r = 3.","a₆ = 2 × 3⁵ = 2 × 243 = 486."]},
{id:"ss4",t:"ss",l:2,th:"music",q:"On a piano, each A note has double the frequency of the A below it. The lowest A in a list is 55 Hz. What is the frequency of the 6th A in the list (in Hz)?",a:1760,h:"The frequencies form a GP with r = 2.",s:["a = 55, r = 2, n = 6.","a₆ = 55 × 2⁵ = 55 × 32.","= 1760 Hz."]},
{id:"ss5",t:"ss",l:2,q:"Find the sum to infinity of 1 + 1/3 + 1/9 + …",a:1.5,disp:"3/2",h:"For |r| < 1, S∞ = a/(1 − r).",s:["a = 1, r = 1/3.","S∞ = 1/(1 − 1/3) = 1/(2/3) = 3/2."]},
{id:"ss6",t:"ss",l:2,th:"cricket",q:"A batter scores 12 runs in the first match and 4 more runs in each match than the one before. Total runs in the first 10 matches?",a:300,h:"This is an AP: a = 12, d = 4. Use Sₙ.",s:["S₁₀ = 10/2 × [2 × 12 + 9 × 4].","= 5 × [24 + 36] = 5 × 60.","= 300 runs."]},
{id:"ss7",t:"ss",l:2,q:"Find the AM and GM of 4 and 16.",o:["AM = 10, GM = 8","AM = 8, GM = 10","AM = 10, GM = 6","AM = 12, GM = 8"],h:"AM = (a + b)/2, GM = √(ab).",s:["AM = (4 + 16)/2 = 10.","GM = √(4 × 16) = √64 = 8.","Check: AM ≥ GM, as always."]},
{id:"ss8",t:"ss",l:2,th:"economics",q:"₹10,000 is saved at 10% per year compound interest. What is the amount after 3 years (in ₹)?",a:13310,h:"Each year the amount is multiplied by 1.1 — that is a GP.",s:["Amount = 10000 × (1.1)³.","(1.1)³ = 1.331.","Amount = ₹13,310."]},
{id:"ss9",t:"ss",l:3,q:"The sum of n terms of an AP is 3n² + 5n. Find its 10th term.",a:62,h:"aₙ = Sₙ − Sₙ₋₁.",s:["a₁₀ = S₁₀ − S₉.","S₁₀ = 300 + 50 = 350; S₉ = 243 + 45 = 288.","a₁₀ = 350 − 288 = 62."]},
{id:"ss10",t:"ss",l:3,q:"Insert 3 geometric means between 1 and 256.",o:["4, 16, 64","2, 8, 32","8, 32, 128","4, 8, 16"],h:"The full sequence 1, _, _, _, 256 has 5 terms, so 256 = 1 × r⁴.",s:["r⁴ = 256, so r = 4.","Means: 1 × 4 = 4, 4 × 4 = 16, 16 × 4 = 64."]},
{id:"ss11",t:"ss",l:3,q:"Three numbers in AP have sum 24 and product 440. Find them.",o:["5, 8, 11","4, 8, 12","6, 8, 10","3, 8, 13"],h:"Take the numbers as a − d, a, a + d.",s:["Sum: 3a = 24, so a = 8.","Product: (8 − d) × 8 × (8 + d) = 440, so 64 − d² = 55.","d² = 9, d = ±3, giving 5, 8, 11."]},
// ---------- Points ----------
{id:"pt1",t:"pt",l:1,q:"Find the distance between (2, 3) and (5, 7).",a:5,h:"d = √[(x₂ − x₁)² + (y₂ − y₁)²].",s:["Differences: 5 − 2 = 3 and 7 − 3 = 4.","d = √(9 + 16) = √25 = 5."]},
{id:"pt2",t:"pt",l:1,q:"Find the midpoint of (−2, 4) and (6, −8).",o:["(2, −2)","(4, −4)","(−4, 6)","(2, 2)"],h:"Midpoint = ((x₁ + x₂)/2, (y₁ + y₂)/2).",s:["x: (−2 + 6)/2 = 2.","y: (4 + (−8))/2 = −2.","Midpoint: (2, −2)."]},
{id:"pt3",t:"pt",l:1,th:"cricket",q:"On a cricket field plan with the pitch centre at the origin, a fielder stands at (30, 40) metres. How far is the fielder from the centre (in m)?",a:50,h:"Distance from the origin is √(x² + y²).",s:["d = √(30² + 40²) = √(900 + 1600).","= √2500 = 50 m."]},
{id:"pt4",t:"pt",l:2,q:"Find the centroid of the triangle with vertices (1, 2), (3, −4), (5, 8).",o:["(3, 2)","(3, 3)","(9, 6)","(2, 3)"],h:"Centroid = average of the x's and average of the y's.",s:["x: (1 + 3 + 5)/3 = 3.","y: (2 − 4 + 8)/3 = 2.","Centroid: (3, 2)."]},
{id:"pt5",t:"pt",l:2,q:"Find the point dividing the join of (1, −2) and (4, 7) internally in the ratio 1 : 2.",o:["(2, 1)","(3, 4)","(2.5, 2.5)","(1, 2)"],h:"Section formula: ((m x₂ + n x₁)/(m + n), (m y₂ + n y₁)/(m + n)) with m : n = 1 : 2.",s:["x = (1 × 4 + 2 × 1)/3 = 6/3 = 2.","y = (1 × 7 + 2 × (−2))/3 = 3/3 = 1.","Point: (2, 1)."]},
{id:"pt6",t:"pt",l:2,q:"Find the area of the triangle with vertices (1, 1), (4, 5), (7, 2).",a:10.5,h:"Area = ½ |x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)|.",s:["1(5 − 2) + 4(2 − 1) + 7(1 − 5) = 3 + 4 − 28 = −21.","Area = ½ × |−21| = 10.5 square units."]},
{id:"pt7",t:"pt",l:3,q:"Find k if (1, 2), (3, k) and (5, 8) are collinear.",a:5,h:"Collinear points: the slope between each pair is the same.",s:["Slope from (1, 2) to (5, 8) = 6/4 = 3/2.","Slope from (1, 2) to (3, k) = (k − 2)/2.","(k − 2)/2 = 3/2, so k = 5."]},
{id:"pt8",t:"pt",l:3,q:"In what ratio does the y-axis divide the join of (−3, 4) and (6, −2)?",o:["1 : 2","2 : 1","1 : 3","3 : 2"],h:"Any point on the y-axis has x = 0. Use the section formula for x.",s:["Let the ratio be m : n. x = (6m − 3n)/(m + n) = 0.","6m = 3n, so m : n = 1 : 2."]},
{id:"pt9",t:"pt",l:3,q:"Find the point equidistant from (0, 0), (4, 0) and (0, 6).",o:["(2, 3)","(4/3, 2)","(3, 2)","(2, 2)"],h:"Let the point be (x, y). Equate squared distances in pairs.",s:["From (0, 0) and (4, 0): x² = (x − 4)², so x = 2.","From (0, 0) and (0, 6): y² = (y − 6)², so y = 3.","Point: (2, 3) — the midpoint of the hypotenuse of this right triangle."]},
// ---------- Straight Lines ----------
{id:"sl1",t:"sl",l:1,q:"Find the slope of the line through (1, 2) and (4, 8).",a:2,h:"m = (y₂ − y₁)/(x₂ − x₁).",s:["m = (8 − 2)/(4 − 1) = 6/3 = 2."]},
{id:"sl2",t:"sl",l:1,q:"Which is the line with slope 3 and y-intercept −2?",o:["y = 3x − 2","y = −2x + 3","y = 3x + 2","3y = x − 2"],h:"Slope-intercept form: y = mx + c.",s:["m = 3, c = −2.","y = 3x − 2."]},
{id:"sl3",t:"sl",l:1,q:"Find the slope of 2x − 3y + 6 = 0. (A fraction is fine.)",a:2/3,tol:0.005,disp:"2/3",h:"Rewrite as y = mx + c, or use m = −(coefficient of x)/(coefficient of y).",s:["3y = 2x + 6, so y = (2/3)x + 2.","Slope = 2/3."]},
{id:"sl4",t:"sl",l:2,q:"Find the line through (2, 3) parallel to y = 4x + 1.",o:["y = 4x − 5","y = 4x + 3","y = −x/4 + 7/2","y = 4x − 11"],h:"Parallel lines have the same slope. Use y − y₁ = m(x − x₁).",s:["m = 4.","y − 3 = 4(x − 2) = 4x − 8.","y = 4x − 5."]},
{id:"sl5",t:"sl",l:2,q:"Find the line through (1, −1) and (3, 5).",o:["3x − y − 4 = 0","3x + y − 2 = 0","x − 3y − 4 = 0","3x − y + 4 = 0"],h:"Find the slope first, then use point-slope form.",s:["m = (5 − (−1))/(3 − 1) = 3.","y + 1 = 3(x − 1), so y = 3x − 4.","General form: 3x − y − 4 = 0."]},
{id:"sl6",t:"sl",l:2,q:"Where do 2x + y = 5 and x − y = 1 meet?",o:["(2, 1)","(1, 3)","(3, 2)","(2, −1)"],h:"Add the two equations to remove y.",s:["Adding: 3x = 6, so x = 2.","Then 2 − y = 1, so y = 1.","Point: (2, 1)."]},
{id:"sl7",t:"sl",l:2,q:"Find the perpendicular distance from (3, 4) to 3x + 4y − 5 = 0.",a:4,h:"d = |ax₁ + by₁ + c| / √(a² + b²).",s:["|3 × 3 + 4 × 4 − 5| = |9 + 16 − 5| = 20.","√(9 + 16) = 5.","d = 20/5 = 4."]},
{id:"sl8",t:"sl",l:2,th:"economics",q:"A demand line: at price ₹50 the quantity demanded is 100; at ₹40 it is 140. Assuming a straight line, what is the quantity demanded at ₹30?",a:180,h:"Find the slope (change in quantity ÷ change in price) and extend the line.",s:["Slope = (140 − 100)/(40 − 50) = −4 units per rupee.","Q = 100 − 4(P − 50).","At P = 30: Q = 100 − 4(−20) = 180."]},
{id:"sl9",t:"sl",l:3,q:"Find the distance between the parallel lines 3x + 4y = 7 and 3x + 4y = −3.",a:2,h:"For ax + by + c₁ = 0 and ax + by + c₂ = 0, d = |c₁ − c₂| / √(a² + b²).",s:["Write them as 3x + 4y − 7 = 0 and 3x + 4y + 3 = 0.","d = |−7 − 3| / 5 = 10/5 = 2."]},
{id:"sl10",t:"sl",l:3,q:"Find the acute angle between y = x and y = √3 x (in degrees).",a:15,h:"Compare the angles each line makes with the x-axis, or use tan θ = |(m₂ − m₁)/(1 + m₁m₂)|.",s:["y = x makes 45° with the x-axis (tan 45° = 1).","y = √3 x makes 60° (tan 60° = √3).","Angle between them: 60° − 45° = 15°."]},
{id:"sl11",t:"sl",l:3,q:"Find the line through (2, 3) that cuts equal (non-zero) intercepts on the axes.",o:["x + y = 5","x − y = −1","2x + 3y = 13","x + y = 6"],h:"Intercept form with equal intercepts: x/a + y/a = 1, i.e. x + y = a.",s:["x + y = a passes through (2, 3).","2 + 3 = a, so a = 5.","Line: x + y = 5."]},
// ---------- Circles ----------
{id:"ci1",t:"ci",l:1,q:"Find the centre and radius of (x − 2)² + (y + 3)² = 16.",o:["Centre (2, −3), radius 4","Centre (−2, 3), radius 4","Centre (2, −3), radius 16","Centre (−2, 3), radius 16"],h:"Compare with (x − h)² + (y − k)² = r².",s:["h = 2, k = −3 (since y + 3 = y − (−3)).","r² = 16, so r = 4."]},
{id:"ci2",t:"ci",l:1,q:"Which is the circle with centre (0, 0) and radius 5?",o:["x² + y² = 25","x² + y² = 5","(x − 5)² + y² = 25","x² + y² = 10"],h:"x² + y² = r² when the centre is the origin.",s:["r = 5, so r² = 25.","x² + y² = 25."]},
{id:"ci3",t:"ci",l:1,q:"Find the radius of x² + y² = 49.",a:7,h:"The right-hand side is r².",s:["r² = 49, so r = 7."]},
{id:"ci4",t:"ci",l:2,q:"Find the centre and radius of x² + y² − 6x + 8y − 11 = 0.",o:["Centre (3, −4), radius 6","Centre (−3, 4), radius 6","Centre (3, −4), radius 36","Centre (−6, 8), radius 6"],h:"For x² + y² + 2gx + 2fy + c = 0: centre (−g, −f), r = √(g² + f² − c).",s:["2g = −6, so g = −3; 2f = 8, so f = 4.","Centre (−g, −f) = (3, −4).","r = √(9 + 16 + 11) = √36 = 6."]},
{id:"ci5",t:"ci",l:2,q:"Find the circle with centre (1, 2) passing through (4, 6).",o:["(x − 1)² + (y − 2)² = 25","(x − 1)² + (y − 2)² = 5","(x + 1)² + (y + 2)² = 25","(x − 4)² + (y − 6)² = 25"],h:"The radius is the distance from the centre to the given point.",s:["r = √((4 − 1)² + (6 − 2)²) = √(9 + 16) = 5.","(x − 1)² + (y − 2)² = 25."]},
{id:"ci6",t:"ci",l:2,q:"Is the point (2, 3) inside, on, or outside x² + y² = 10?",o:["Outside","Inside","On the circle","Cannot be decided"],h:"Substitute the point into x² + y² and compare with 10.",s:["2² + 3² = 13.","13 > 10, so the point is outside."]},
{id:"ci7",t:"ci",l:2,th:"cricket",q:"A ground's inner fielding circle has radius 27 m, centred at the pitch centre (origin). Is a fielder at (20, 20) inside it?",o:["Outside","Inside","Exactly on the circle"],h:"Compare the fielder's distance from the origin with 27.",s:["Distance = √(20² + 20²) = √800 ≈ 28.3 m.","28.3 > 27, so the fielder is outside the circle."]},
{id:"ci8",t:"ci",l:3,q:"Find the circle whose diameter has ends (2, −3) and (−2, 5).",o:["x² + y² − 2y − 19 = 0","x² + y² + 2y − 19 = 0","x² + y² − 2y − 20 = 0","x² + y² − 4x − 19 = 0"],h:"Use the diameter form (x − x₁)(x − x₂) + (y − y₁)(y − y₂) = 0.",s:["(x − 2)(x + 2) + (y + 3)(y − 5) = 0.","x² − 4 + y² − 2y − 15 = 0.","x² + y² − 2y − 19 = 0."]},
{id:"ci9",t:"ci",l:3,q:"Find the circle through (0, 0), (4, 0) and (0, 6).",o:["x² + y² − 4x − 6y = 0","x² + y² + 4x + 6y = 0","x² + y² − 2x − 3y = 0","x² + y² − 4x − 6y − 13 = 0"],h:"Use x² + y² + 2gx + 2fy + c = 0 and substitute each point.",s:["(0, 0) gives c = 0.","(4, 0): 16 + 8g = 0, so g = −2.","(0, 6): 36 + 12f = 0, so f = −3.","x² + y² − 4x − 6y = 0."]},
{id:"ci10",t:"ci",l:3,q:"For what k does x² + y² + 4x + 2y + k = 0 have radius 2?",a:1,h:"r² = g² + f² − c.",s:["g = 2, f = 1, c = k.","r² = 4 + 1 − k = 4.","k = 1."]},
// ---------- Conic Sections ----------
{id:"co1",t:"co",l:1,q:"Find the focus of y² = 12x.",o:["(3, 0)","(0, 3)","(12, 0)","(−3, 0)"],h:"Compare with y² = 4ax; the focus is (a, 0).",s:["4a = 12, so a = 3.","Focus: (3, 0)."]},
{id:"co2",t:"co",l:1,q:"Find the directrix of x² = 8y.",o:["y = −2","x = −2","y = 2","y = −8"],h:"For x² = 4ay, the directrix is y = −a.",s:["4a = 8, so a = 2.","Directrix: y = −2."]},
{id:"co3",t:"co",l:1,q:"Find the length of the latus rectum of y² = 20x.",a:20,h:"For y² = 4ax, latus rectum = 4a.",s:["4a = 20.","Latus rectum length = 20."]},
{id:"co4",t:"co",l:2,q:"Find the foci of x²/25 + y²/9 = 1.",o:["(±4, 0)","(0, ±4)","(±5, 0)","(±3, 0)"],h:"For an ellipse with a > b: c² = a² − b².",s:["a² = 25, b² = 9, so the major axis is along x.","c² = 25 − 9 = 16, c = 4.","Foci: (±4, 0)."]},
{id:"co5",t:"co",l:2,q:"Find the eccentricity of x²/25 + y²/9 = 1.",a:0.8,disp:"4/5 = 0.8",h:"e = c/a.",s:["c = 4 (from c² = 25 − 9).","e = 4/5 = 0.8."]},
{id:"co6",t:"co",l:2,q:"Find the eccentricity of x²/16 − y²/9 = 1.",a:1.25,disp:"5/4 = 1.25",h:"For a hyperbola: c² = a² + b², e = c/a.",s:["c² = 16 + 9 = 25, c = 5.","e = 5/4 = 1.25."]},
{id:"co7",t:"co",l:2,th:"cricket",q:"A ball's path near its highest point follows x² = −16y (metres, with the top of the path at the origin). How far below the top is the ball when it is 8 m away horizontally?",a:4,h:"Substitute x = 8 and solve for y.",s:["64 = −16y, so y = −4.","The ball is 4 m below the top."]},
{id:"co8",t:"co",l:3,q:"Find the parabola with vertex at the origin, axis along the x-axis, passing through (2, 3).",o:["2y² = 9x","y² = 9x","3y² = 2x","y² = 18x"],h:"Use y² = 4ax and substitute the point.",s:["9 = 4a × 2, so 4a = 9/2.","y² = (9/2)x, i.e. 2y² = 9x."]},
{id:"co9",t:"co",l:3,q:"Find the ellipse with foci (±3, 0) and vertices (±5, 0).",o:["x²/25 + y²/16 = 1","x²/25 + y²/9 = 1","x²/16 + y²/25 = 1","x²/25 − y²/16 = 1"],h:"a = 5, c = 3, and b² = a² − c².",s:["a = 5, c = 3.","b² = 25 − 9 = 16.","x²/25 + y²/16 = 1."]},
{id:"co10",t:"co",l:3,q:"Find the length of the latus rectum of x²/36 + y²/16 = 1. (A fraction is fine.)",a:16/3,tol:0.01,disp:"16/3 ≈ 5.33",h:"For an ellipse, latus rectum = 2b²/a.",s:["a = 6, b² = 16.","2b²/a = 32/6 = 16/3 ≈ 5.33."]},
{id:"co11",t:"co",l:3,q:"Find the hyperbola with foci (±5, 0) and transverse axis of length 8.",o:["x²/16 − y²/9 = 1","x²/9 − y²/16 = 1","x²/16 + y²/9 = 1","x²/64 − y²/36 = 1"],h:"Transverse axis = 2a. Then b² = c² − a².",s:["2a = 8, so a = 4; c = 5.","b² = 25 − 16 = 9.","x²/16 − y²/9 = 1."]},
// ---------- 3D Geometry ----------
{id:"td1",t:"td",l:1,q:"Which coordinate plane contains the point (0, 4, −2)?",o:["YZ-plane","XY-plane","XZ-plane","None of them"],h:"A point lies in a plane when the coordinate missing from that plane's name is 0.",s:["Here x = 0.","Points with x = 0 lie in the YZ-plane."]},
{id:"td2",t:"td",l:1,q:"Find the distance of (2, 3, 6) from the origin.",a:7,h:"d = √(x² + y² + z²).",s:["d = √(4 + 9 + 36) = √49 = 7."]},
{id:"td3",t:"td",l:1,q:"Find the distance between (1, 2, 3) and (4, 6, 3).",a:5,h:"Same formula as in 2D, with a z term added.",s:["Differences: 3, 4, 0.","d = √(9 + 16 + 0) = 5."]},
{id:"td4",t:"td",l:2,q:"Find the midpoint of (2, −1, 3) and (4, 3, −5).",o:["(3, 1, −1)","(1, 2, −4)","(3, 1, 1)","(6, 2, −2)"],h:"Average each coordinate.",s:["x: (2 + 4)/2 = 3; y: (−1 + 3)/2 = 1; z: (3 − 5)/2 = −1.","Midpoint: (3, 1, −1)."]},
{id:"td5",t:"td",l:2,q:"Find the point dividing the join of (1, −2, 3) and (3, 4, −5) internally in the ratio 2 : 3.",o:["(9/5, 2/5, −1/5)","(11/5, 8/5, −9/5)","(2, 1, −1)","(9/5, −2/5, 1/5)"],h:"Section formula with m = 2 (towards the second point) and n = 3.",s:["x = (2 × 3 + 3 × 1)/5 = 9/5.","y = (2 × 4 + 3 × (−2))/5 = 2/5.","z = (2 × (−5) + 3 × 3)/5 = −1/5."]},
{id:"td6",t:"td",l:2,q:"Find the centroid of the triangle with vertices (1, 2, 3), (−2, 0, 4), (4, 1, −1).",o:["(1, 1, 2)","(3, 3, 6)","(1, 1, 3)","(2, 1, 2)"],h:"Average the three vertices coordinate by coordinate.",s:["x: (1 − 2 + 4)/3 = 1.","y: (2 + 0 + 1)/3 = 1.","z: (3 + 4 − 1)/3 = 2."]},
{id:"td7",t:"td",l:3,q:"B(1, 2, 3) lies on the line through A(−2, 3, 5) and C(7, 0, −1). In what ratio does B divide AC?",o:["1 : 2","2 : 1","1 : 3","3 : 1"],h:"Compare the step from A to B with the step from A to C.",s:["A → B: (3, −1, −2).","A → C: (9, −3, −6) = 3 × (3, −1, −2).","So AB is 1/3 of AC, and AB : BC = 1 : 2."]},
{id:"td8",t:"td",l:3,q:"Find the point on the x-axis equidistant from (1, 2, 3) and (3, 5, −2).",o:["(6, 0, 0)","(4, 0, 0)","(−6, 0, 0)","(5, 0, 0)"],h:"Take the point as (x, 0, 0) and equate squared distances.",s:["(x − 1)² + 4 + 9 = (x − 3)² + 25 + 4.","x² − 2x + 14 = x² − 6x + 38.","4x = 24, so x = 6."]},
{id:"td9",t:"td",l:3,q:"In what ratio does the XY-plane divide the join of (2, 4, 7) and (−3, 5, −8)?",o:["7 : 8","8 : 7","2 : 3","7 : 15"],h:"On the XY-plane z = 0. Use the section formula for z.",s:["z = (−8m + 7n)/(m + n) = 0.","8m = 7n, so m : n = 7 : 8."]},
// ---------- Probability ----------
{id:"pr1",t:"pr",l:1,q:"A die is rolled. Find P(a prime number).",a:0.5,disp:"1/2",h:"The primes on a die are 2, 3 and 5.",s:["Favourable: {2, 3, 5} = 3 outcomes.","P = 3/6 = 1/2."]},
{id:"pr2",t:"pr",l:1,q:"Two coins are tossed. Find P(at least one head).",a:0.75,disp:"3/4",h:"List the sample space, or use 1 − P(no heads).",s:["Sample space: HH, HT, TH, TT.","P(no heads) = 1/4.","P(at least one head) = 1 − 1/4 = 3/4."]},
{id:"pr3",t:"pr",l:1,th:"music",q:"A playlist has 10 songs, 4 of them piano pieces. On shuffle, what is P(the first song is a piano piece)?",a:0.4,disp:"2/5",h:"P = favourable ÷ total.",s:["Favourable = 4, total = 10.","P = 4/10 = 2/5."]},
{id:"pr4",t:"pr",l:1,q:"A card is drawn from a pack of 52. Find P(a king). (A fraction is fine.)",a:1/13,tol:0.003,disp:"1/13",h:"There are 4 kings in the pack.",s:["P = 4/52.","= 1/13."]},
{id:"pr5",t:"pr",l:2,q:"Two dice are thrown. Find P(sum = 8). (A fraction is fine.)",a:5/36,tol:0.003,disp:"5/36",h:"There are 36 outcomes. List the pairs that add to 8.",s:["Pairs: (2,6), (3,5), (4,4), (5,3), (6,2) — 5 outcomes.","P = 5/36."]},
{id:"pr6",t:"pr",l:2,q:"P(A) = 0.5, P(B) = 0.4, P(A ∩ B) = 0.2. Find P(A ∪ B).",a:0.7,h:"Addition rule: P(A ∪ B) = P(A) + P(B) − P(A ∩ B).",s:["P(A ∪ B) = 0.5 + 0.4 − 0.2.","= 0.7."]},
{id:"pr7",t:"pr",l:2,th:"cricket",q:"A captain calls the coin toss in 3 matches. Find P(winning all three tosses). (A fraction is fine.)",a:0.125,disp:"1/8",h:"How many outcomes do 3 tosses have?",s:["There are 2 × 2 × 2 = 8 equally likely outcomes.","Only one is Win-Win-Win.","P = 1/8."]},
{id:"pr8",t:"pr",l:2,th:"music",q:"A playlist has 10 songs, 4 of them piano pieces. On shuffle, find P(the first two songs are both piano pieces). (A fraction is fine.)",a:2/15,tol:0.003,disp:"2/15",h:"Count ordered pairs: total = 10 × 9; favourable = 4 × 3.",s:["Ways to fill the first two slots: 10 × 9 = 90.","Both piano: 4 × 3 = 12.","P = 12/90 = 2/15."]},
{id:"pr9",t:"pr",l:3,q:"A bag has 5 red and 3 blue balls. Two are drawn together. Find P(one of each colour). (A fraction is fine.)",a:15/28,tol:0.003,disp:"15/28",h:"Use combinations: total = ⁸C₂.",s:["Total = ⁸C₂ = 28.","One red and one blue = ⁵C₁ × ³C₁ = 15.","P = 15/28."]},
{id:"pr10",t:"pr",l:3,q:"A number is chosen from 1 to 100. Find P(it is divisible by 4 or 6).",a:0.33,disp:"33/100",h:"Count multiples of 4 and of 6, then subtract the multiples of 12 counted twice.",s:["Multiples of 4: 25. Multiples of 6: 16.","Multiples of both (12): 8.","Count = 25 + 16 − 8 = 33, so P = 33/100."]},
{id:"pr11",t:"pr",l:3,q:"Three people are chosen at random. Find P(at least two were born in the same month), assuming all months are equally likely.",a:17/72,tol:0.003,disp:"17/72 ≈ 0.236",h:"Find P(all in different months) first, then subtract from 1.",s:["P(all different) = (12 × 11 × 10)/12³ = 1320/1728.","= 55/72.","P(at least two the same) = 1 − 55/72 = 17/72 ≈ 0.236."]},
// ---------- Measures of Dispersion ----------
{id:"md1",t:"md",l:1,q:"Find the range of 12, 7, 19, 3, 15.",a:16,h:"Range = largest − smallest.",s:["Largest 19, smallest 3.","Range = 16."]},
{id:"md2",t:"md",l:1,q:"Find the mean deviation about the mean of 2, 4, 6, 8, 10.",a:2.4,h:"Find the mean, then average the absolute deviations.",s:["Mean = 30/5 = 6.","|Deviations|: 4, 2, 0, 2, 4 → sum 12.","MD = 12/5 = 2.4."]},
{id:"md3",t:"md",l:1,th:"cricket",q:"A batter's scores: 20, 35, 50, 15, 30. Find the mean score.",a:30,h:"Mean = total ÷ number of innings.",s:["Total = 150.","Mean = 150/5 = 30."]},
{id:"md4",t:"md",l:2,th:"cricket",q:"A batter's scores: 20, 35, 50, 15, 30 (mean 30). Find the mean deviation about the mean.",a:10,h:"Average of |score − 30|.",s:["|Deviations|: 10, 5, 20, 15, 0 → sum 50.","MD = 50/5 = 10."]},
{id:"md5",t:"md",l:2,q:"Find the variance of 2, 4, 6, 8, 10.",a:8,h:"Variance = average of the squared deviations from the mean.",s:["Mean = 6.","Squared deviations: 16, 4, 0, 4, 16 → sum 40.","Variance = 40/5 = 8."]},
{id:"md6",t:"md",l:2,q:"Find the standard deviation of 4, 8, 12, 16. (Give 2 decimal places, or use √.)",a:Math.sqrt(20),tol:0.01,disp:"√20 ≈ 4.47",h:"SD = √variance.",s:["Mean = 40/4 = 10.","Squared deviations: 36, 4, 4, 36 → sum 80.","Variance = 20, so SD = √20 ≈ 4.47."]},
{id:"md7",t:"md",l:2,q:"A data set has mean 40 and SD 8. Find the coefficient of variation (in %).",a:20,disp:"20%",h:"CV = (SD ÷ mean) × 100.",s:["CV = 8/40 × 100 = 20%."]},

/* ---------- answers ---------- */
function parseAns(s){
 s=String(s==null?'':s).trim().toLowerCase().replace(/[−–]/g,'-').replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'').replace(/[₹%°]/g,'').replace(/rs\.?/g,'').replace(/(hz|runs|units|metres|meters|m)\s*$/,'').replace(/\s+/g,'');
 if(!s||!/^[0-9.+\-*/()√]+$/.test(s))return NaN;
 s=s.replace(/(\d)√/g,'$1*√').replace(/√(\d+(?:\.\d+)?)/g,'Math.sqrt($1)').replace(/√\(/g,'Math.sqrt(');
 if(s.includes('√'))return NaN;
 try{const v=Function('"use strict";return ('+s+')')();return typeof v==='number'&&isFinite(v)?v:NaN}catch(e){return NaN}
}
function isRight(q,ans){if(q.o)return ans===0;const v=parseAns(ans);if(isNaN(v))return false;const tol=q.tol!=null?q.tol:(Math.abs(q.a)<1?0.005:0.01);return Math.abs(v-q.a)<=tol}
const ansText=q=>q.o?q.o[0]:(q.disp||fmt(q.a));

function record(q,ok,hint,mode){
 const T=S.topics[q.t];T.a++;S.total++;if(ok){T.c++;S.correct++}
 const st=S.q[q.id]||(S.q[q.id]={a:0,c:0});st.a++;if(ok)st.c++;st.last=Date.now();
 if(!ok)S.mistakes[q.id]=0;
 else if(q.id in S.mistakes){S.mistakes[q.id]++;if(S.mistakes[q.id]>=2){delete S.mistakes[q.id];S.cleared++;toast('Mistake fixed for good ✔')}}
 if(ok&&!hint){S.run++;S.bestRun=Math.max(S.bestRun,S.run)}else S.run=0;
 const td=today();if(!S.days.includes(td))S.days.push(td);
 const dd=S.daily[td]||(S.daily[td]={a:0,c:0});dd.a++;if(ok)dd.c++;
 if(mode!=='test'){
  if(ok){T.down=0;T.up++;if(T.up>=2&&T.level<3){T.level++;T.up=0;toast('Level up! '+TN[q.t]+' → Level '+T.level)}}
  else{T.up=0;T.down++;if(T.down>=2&&T.level>1){T.level--;T.down=0;toast('Back to Level '+T.level+' to build up — that is how mastery works')}}
 }
 save();checkBadges();
}
function weakness(k){const T=S.topics[k];if(T.a<3)return .6;return (1-T.c/T.a)+(3-T.level)*.12}
function accClass(T){if(!T.a)return '';const a=T.c/T.a;return a>=.75?'cg':a>=.5?'ca':'cr'}

let P=null;
function startPractice(mode,topic){P={mode,topic,recent:[],count:0,right:0};cur='practise';document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v==='practise'));nextQ()}
function endPractice(){if(P&&P.count)toast('Session done: '+P.right+'/'+P.count+' right first time');P=null;renderPractise()}
function pickWeakTopic(){const s=TOPICS.map(t=>t.k).sort((a,b)=>weakness(b)-weakness(a));return pick(s.slice(0,2))}
function qScore(q){const st=S.q[q.id];if(!st)return -1+Math.random()*.1;return st.c/st.a+Math.random()*.15}
function pickQuestion(t,recent){
 const T=S.topics[t],all=BANK.filter(q=>q.t===t),rec=recent||[];
 const due=all.filter(q=>(q.id in S.mistakes)&&!rec.includes(q.id));
 if(due.length&&Math.random()<.35)return pick(due);
 let pool=all.filter(q=>q.l===T.level&&!rec.includes(q.id));
 if(!pool.length)pool=all.filter(q=>Math.abs(q.l-T.level)<=1&&!rec.includes(q.id));
 if(!pool.length)pool=all.filter(q=>q.id!==rec[rec.length-1]);
 pool.sort((x,y)=>qScore(x)-qScore(y));return pick(pool.slice(0,3));
}
function nextQ(){
 let q;
 if(P.mode==='mistakes'){const ids=Object.keys(S.mistakes).filter(id=>byId[id]);if(!ids.length){toast('All mistakes fixed! 🎉');P=null;return renderPractise()}
  let pool=ids.filter(id=>id!==P.recent[P.recent.length-1]);if(!pool.length)pool=ids;q=byId[pick(pool)]}
 else q=pickQuestion(P.mode==='weak'?pickWeakTopic():P.topic,P.recent);
 Object.assign(P,{q,order:q.o?shuffle(q.o.map((_,i)=>i)):null,tries:0,hint:false,done:false,ok:null,fb:null,steps:0,wrong:[],input:''});
 P.recent.push(q.id);if(P.recent.length>6)P.recent.shift();
 renderPractise();window.scrollTo(0,0);
}
function renderPractise(){
 if(!P){const mk=Object.keys(S.mistakes).length;
  V.innerHTML=`<h1>Practise</h1><p class="muted">Questions start easy and get harder as you get them right. Two wrong in a row steps the level back down.</p>
  <div class="stack" style="margin-top:14px"><button class="btn big" onclick="startPractice('weak')">🎯 Weakest topics first</button>${mk?`<button class="btn big alt" onclick="startPractice('mistakes')">🔧 Fix my mistakes (${mk})</button>`:''}</div>
  <h2>Choose a topic</h2><div class="card list">${TOPICS.map(t=>topicRow(t)).join('')}</div>`;return}
 const q=P.q;
 const title=P.mode==='mistakes'?'Fixing mistakes':P.mode==='weak'?'Weakest topics':TN[P.topic];
 let h=`<div class="topbar"><button class="link" onclick="endPractice()">‹ End</button><span class="muted">${title} · ${P.right}/${P.count}</span></div>
 <div class="card"><div class="chips"><span class="chip">${TN[q.t]}</span><span class="chip lvl">Level ${q.l}</span>${q.th?`<span class="chip theme">${THEMES[q.th]}</span>`:''}${q.id in S.mistakes?'<span class="chip theme">Earlier mistake</span>':''}</div>
 <p class="qtext">${q.q}</p>`;
 if(q.o){h+='<div class="opts">'+P.order.map(i=>{let c='';if(P.wrong.includes(i))c='wrong';if(P.done&&i===0)c='right';return `<button class="opt ${c}" ${P.done||P.wrong.includes(i)?'disabled':''} onclick="answerOpt(${i})">${q.o[i]}</button>`}).join('')+'</div>'}
 else{h+=`<div class="ansrow"><input id="ans" autocomplete="off" placeholder="Your answer" value="${P.input}" ${P.done?'disabled':''} onkeydown="if(event.key==='Enter')checkNum()" oninput="P.input=this.value"><button class="btn" onclick="checkNum()" ${P.done?'disabled':''}>Check</button></div>
  ${P.done?'':`<div class="keys">${['−','/','√','.','(',')'].map(k=>`<button onclick="ins('${k}')">${k}</button>`).join('')}</div>`}`}
 const FB={good:['good','✅ Correct! '+pick(['Nicely done.','Spot on.','That is the way.','Clean work.'])],second:['good','✅ Got it on the second try. Check the worked solution for the quickest route.'],again:['info','Not quite — have another go, or take the hint.'],reveal:['bad','The answer is '+ansText(q)+'. Walk through the solution below.'],invalid:['info','Type a number — fractions like 3/4 and √ are fine.']};
 if(P.fb)h+=`<div class="fb ${FB[P.fb][0]}">${FB[P.fb][1]}</div>`;
 if(P.hint)h+=`<div class="hint">💡 ${q.h}</div>`;
 if(!P.done){h+=`<div class="row"><button class="btn ghost" onclick="P.hint=true;renderPractise()" ${P.hint?'disabled':''}>💡 Hint</button><button class="btn ghost" onclick="openPad('${q.id}')">✏️ Rough work</button><button class="btn ghost" onclick="nextQ()">Skip</button></div>`}
 else{
  if(P.steps>0)h+=`<div class="steps"><ol>${q.s.slice(0,P.steps).map(x=>`<li>${x}</li>`).join('')}</ol>${P.steps>=q.s.length?`<div class="final">Answer: ${ansText(q)}</div>`:''}</div>`;
  h+='<div class="row">';
  if(P.steps<q.s.length)h+=`<button class="btn ghost" onclick="P.steps++;renderPractise()">${P.steps===0?(P.fb==='good'?'See the worked solution':'Show the first step'):'Show next step'}</button>`;
  h+=`<button class="btn" onclick="nextQ()">Next question →</button></div>`;
 }
 h+='</div>';V.innerHTML=h;
}
function ins(k){const i=$('#ans');if(!i)return;const p=i.selectionStart??i.value.length;i.value=i.value.slice(0,p)+k+i.value.slice(i.selectionEnd??p);P.input=i.value;i.focus();i.setSelectionRange(p+1,p+1)}
function settle(ok){
 P.tries++;
 if(P.tries===1){record(P.q,ok,P.hint,'practice');P.count++;if(ok)P.right++;P.ok=ok}
 if(ok){P.done=true;P.fb=P.tries===1?'good':'second'}
 else if(P.tries>=2||(P.q.o&&P.q.o.length-P.wrong.length<=1)){P.done=true;P.fb='reveal';P.steps=1}
 else P.fb='again';
 renderPractise();
}
function answerOpt(i){if(P.done)return;const ok=i===0;if(!ok)P.wrong.push(i);settle(ok)}
function checkNum(){if(P.done)return;const v=$('#ans').value;P.input=v;if(isNaN(parseAns(v))){P.fb='invalid';return renderPractise()}settle(isRight(P.q,v))}

function buildTest(n){
 const chosen=[],used=new Set();let guard=0;
 const ks=TOPICS.map(t=>t.k),w=ks.map(k=>.5+weakness(k)),tot=w.reduce((a,b)=>a+b,0);
 while(chosen.length<n&&guard++<500){
  let r=Math.random()*tot,k=ks[0];for(let i=0;i<ks.length;i++){r-=w[i];if(r<=0){k=ks[i];break}}
  const L=S.topics[k].level;let pool=BANK.filter(q=>q.t===k&&!used.has(q.id)&&Math.abs(q.l-L)<=1);
  if(!pool.length)pool=BANK.filter(q=>q.t===k&&!used.has(q.id));if(!pool.length)continue;
  const q=pick(pool);used.add(q.id);chosen.push(q);

 return chosen;
}

 L.push('Mistakes still to fix: '+Object.keys(S.mistakes).length+' · fixed so far: '+S.cleared);
 if(S.mocks.length){const m=S.mocks[S.mocks.length-1];L.push('Latest mock test: '+m.s+'/'+m.n+' ('+m.pct+'%) on '+niceDate(m.d))}
 const b=BADGES.filter(x=>S.badges[x.id]).map(x=>x.ic+' '+x.n);if(b.length)L.push('Badges: '+b.join(', '));
 return L.join('\n');
}
function renderReport(){
 V.innerHTML=`<h1>Progress report</h1><p class="muted">Send this summary to the tutor, or keep a backup of all progress.</p>
 <div class="card"><pre class="report">${reportText()}</pre>
 <div class="row"><button class="btn" onclick="shareWA()">Send on WhatsApp</button><button class="btn ghost" onclick="copyReport()">Copy</button>${navigator.share?'<button class="btn ghost" onclick="shareNative()">Share…</button>':''}</div></div>
 <h2>Backup</h2><div class="card"><p class="muted">Progress is saved only in this browser on this device. Download a backup now and then — clearing browser data erases progress.</p>
 <div class="row"><button class="btn ghost" onclick="backup()">Download backup</button><button class="btn ghost" onclick="$('#rest').click()">Restore backup</button></div>
 <input type="file" id="rest" accept=".json,application/json" style="display:none" onchange="restore(this.files[0])">
 <div class="row"><button class="btn danger" onclick="resetAll()">Reset all progress</button></div></div>`;
}
function shareWA(){window.open('https://wa.me/?text='+encodeURIComponent(reportText()),'_blank')}
function shareNative(){navigator.share({title:'Maths practice report',text:reportText()}).catch(()=>{})}
function copyReport(){const t=reportText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Report copied')).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Report copied')}catch(e){}a.remove()})}
function backup(){const blob=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='maths-coach-backup-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.topics)throw 0;if(!confirm('Replace current progress with this backup?'))return;S=fix(d);save();toast('Backup restored');renderReport()}catch(e){alert('That file is not a Maths Coach backup.')}};r.readAsText(f)}
function resetAll(){if(confirm('Erase ALL progress, badges and mistakes?')&&confirm('Are you sure? This cannot be undone.')){S=blank();save();P=null;X=null;toast('Progress reset');go('home')}}

/* ---------- scratchpad ---------- */
const pads={};let padKey='free',pen={c:'#1d2433',w:2.5,erase:false},drawing=null;
const pc=$('#padc'),px=pc.getContext('2d');
function openPad(k){padKey=k||'free';if(!pads[padKey])pads[padKey]=[];$('#pad').classList.remove('hidden');sizePad()}
function sizePad(){const dpr=window.devicePixelRatio||1,r=pc.getBoundingClientRect();pc.width=r.width*dpr;pc.height=r.height*dpr;px.setTransform(dpr,0,0,dpr,0,0);redraw()}
function strokeSeg(st,a,b){px.globalCompositeOperation=st.erase?'destination-out':'source-over';px.strokeStyle=st.c;px.lineCap='round';px.lineJoin='round';px.lineWidth=b.w;px.beginPath();px.moveTo(a.x,a.y);px.lineTo(b.x,b.y);px.stroke()}
function redraw(){px.clearRect(0,0,pc.width,pc.height);(pads[padKey]||[]).forEach(st=>{for(let i=1;i<st.pts.length;i++)strokeSeg(st,st.pts[i-1],st.pts[i]);if(st.pts.length===1){const p=st.pts[0];strokeSeg(st,p,{x:p.x+.1,y:p.y+.1,w:p.w})}});px.globalCompositeOperation='source-over'}
function ptOf(e){const r=pc.getBoundingClientRect();const pr=e.pointerType==='pen'&&e.pressure>0?.45+e.pressure*1.1:1;return {x:e.clientX-r.left,y:e.clientY-r.top,w:(pen.erase?pen.w*6:pen.w)*pr}}
pc.addEventListener('pointerdown',e=>{if($('#pStylus').checked&&e.pointerType==='touch')return;e.preventDefault();pc.setPointerCapture(e.pointerId);drawing={c:pen.c,erase:pen.erase,pts:[ptOf(e)]};pads[padKey].push(drawing);redraw()});
pc.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];evs.forEach(ev=>{const p=ptOf(ev),last=drawing.pts[drawing.pts.length-1];drawing.pts.push(p);strokeSeg(drawing,last,p)});px.globalCompositeOperation='source-over'});
['pointerup','pointercancel','pointerleave'].forEach(t=>pc.addEventListener(t,()=>{drawing=null}));
document.querySelectorAll('.padbar .sw').forEach(b=>b.onclick=()=>{pen.c=b.dataset.c;pen.erase=false;document.querySelectorAll('.padbar .sw').forEach(x=>x.classList.toggle('on',x===b));$('#pErase').classList.remove('on')});
$('#pSize').onclick=()=>{pen.w=pen.w===2.5?5:2.5;$('#pSize').textContent=pen.w===2.5?'Thin':'Thick'};
$('#pErase').onclick=()=>{pen.erase=!pen.erase;$('#pErase').classList.toggle('on',pen.erase)};
$('#pUndo').onclick=()=>{pads[padKey].pop();redraw()};
$('#pClear').onclick=()=>{if(pads[padKey].length&&confirm('Clear this page?')){pads[padKey]=[];redraw()}};
$('#pClose').onclick=()=>$('#pad').classList.add('hidden');
$('#pSave').onclick=()=>{const t=document.createElement('canvas');t.width=pc.width;t.height=pc.height;const c=t.getContext('2d');c.fillStyle='#fffdf7';c.fillRect(0,0,t.width,t.height);c.drawImage(pc,0,0);const a=document.createElement('a');a.href=t.toDataURL('image/png');a.download='rough-work-'+today()+'.png';document.body.appendChild(a);a.click();a.remove()};
window.addEventListener('resize',()=>{if(!$('#pad').classList.contains('hidden'))sizePad()});

go('home');
</script>
</body>
