<style>
/* Layout: one narrow column of cards, bottom tab bar for the three jobs (practise, check notebook, weak spots) */
:root{--bg:#f4f5f8;--fg:#1b1d24;--card:#fff;--muted:#646a7a;--line:#dcdfe8;--accent:#3b5bdb;--accent-soft:#e7ecff;--ok:#2b8a3e;--okbg:#e6f4ea;--bad:#c92a2a;--badbg:#fdecec;--warn:#fff4d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--fg:#eceef3;--card:#20232b;--muted:#a1a6b4;--line:#333744;--accent:#8ea2ff;--accent-soft:#252c4a;--ok:#69db7c;--okbg:#1d3324;--bad:#ff8787;--badbg:#3a2022;--warn:#3a3320;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171c;--fg:#eceef3;--card:#20232b;--muted:#a1a6b4;--line:#333744;--accent:#8ea2ff;--accent-soft:#252c4a;--ok:#69db7c;--okbg:#1d3324;--bad:#ff8787;--badbg:#3a2022;--warn:#3a3320;color-scheme:dark}

h1{font-size:1.3rem;margin:0 0 4px;text-wrap:balance}h2{font-size:1.05rem;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 14px;font-size:.93rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card.hi{border-color:var(--accent)}
.note{background:var(--warn);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-bottom:14px}
button,select,textarea,input{font:inherit;color:inherit}
select,textarea{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0}
.btn{display:block;background:var(--accent);color:var(--bg);border:0;border-radius:10px;padding:12px 18px;font-weight:600;width:100%;margin-top:8px;cursor:pointer;text-align:left}

.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.85rem;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.q{font-size:1.15rem;font-weight:600;margin:4px 0 8px}

.spot small,.muted{color:var(--muted)}
.lv{display:inline-block;border:1px solid currentColor;border-radius:20px;padding:0 9px;font-size:.78rem;font-weight:500;opacity:.85;margin-left:6px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:0 10px;font-size:.8rem;margin:0 6px 6px 0}

pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:.88rem;margin:8px 0}
/* stylus pad */
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px;cursor:pointer;color:var(--muted)}

.tools{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}

.tools button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.padwrap{border:1px solid var(--line);border-radius:10px;overflow:hidden}
#pad{display:block;width:100%;touch-action:none;cursor:crosshair}
.chatb{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}.ci{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;max-width:min(90vw,420px);z-index:20;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.wins .wrow{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.wins .wrow b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}.wins .wrow span{font-size:.78rem;color:var(--muted)}
.spark{border-color:#e8a317}

.tab{max-width:150px}
.chipb.on{background:var(--accent);color:var(--bg)}
.person{border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:8px 0}.person small{color:var(--muted)}
.story h2{font-size:1.15rem}
.field{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0}
.btn.wa{background:#1f8f4e;color:#fff;text-align:center}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.row3 .btn{margin:0;text-align:center;font-size:.9rem;padding:10px 4px}
.cmsg.hint{border-color:#e8a317}.cmsg.exp{border-color:var(--accent);background:var(--accent-soft)}
.ctext{white-space:pre-line;margin-top:2px}.qc{margin:10px 0 2px}.opt.sm{padding:8px 12px;margin:6px 0;font-size:.93rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chipb{border:1px solid var(--accent);color:var(--accent);background:var(--card);border-radius:20px;padding:5px 12px;font-size:.85rem;cursor:pointer}
.ask{display:flex;gap:6px;margin-top:8px}.ask input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px}
.seg3 button{font-size:.86rem;padding:8px 4px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.pick .btn{margin:0;text-align:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.row2 .btn{margin:0;text-align:center;font-size:.92rem}
.probcard{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:.85rem}
.cmsg{border-left:4px solid var(--accent);background:var(--bg);border-radius:0 10px 10px 0;padding:8px 12px;margin:8px 0;font-size:.95rem}.cmsg.on_track,.cmsg.done{border-color:var(--ok)}.cmsg.error{border-color:var(--bad)}
@media (max-width:380px){.pick,.row2{grid-template-columns:1fr}}
img.pv{max-width:100%;border-radius:10px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}.stat span{font-size:.78rem;color:var(--muted)}
.tbar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.9rem}.tbar span{flex:0 0 42%;min-width:0}
.tbar .tr{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.tbar .tr i{display:block;height:100%}
.tbar em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 3.2em;text-align:right}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tab{flex:1;max-width:190px;background:none;border:0;padding:10px 4px 12px;color:var(--muted);font-size:.82rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab[aria-current="true"]{color:var(--accent);font-weight:600}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
/* Book examples: figure palette — five hues that stay distinct in both themes */
:root{--c1:#3b5bdb;--c2:#e8590c;--c3:#2b8a3e;--c4:#c98a00;--c5:#7d6fb5;--pvbg:#fff0bf;--pvfg:#5c4200;--fillo:.14}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#8ea2ff;--c2:#ff9a5c;--c3:#69db7c;--c4:#ffcc4d;--c5:#b7abeb;--pvbg:#4a3b12;--pvfg:#ffe39a;--fillo:.22}}
:root[data-theme="dark"]{--c1:#8ea2ff;--c2:#ff9a5c;--c3:#69db7c;--c4:#ffcc4d;--c5:#b7abeb;--pvbg:#4a3b12;--pvfg:#ffe39a;--fillo:.22}
.chaps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chap{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:.88rem;cursor:pointer}

.trow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;cursor:pointer}
.trow:first-of-type{border-top:0}.trow:focus-visible,.chap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tn{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:.82rem;font-weight:600}
.tt{flex:1;min-width:0}.tt b{display:block;font-weight:600;font-size:.95rem}.tt small{color:var(--muted);font-size:.8rem}
.pill{flex:0 0 auto;font-size:.72rem;border-radius:20px;padding:2px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.pill.mid{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.st{background:var(--pvbg);color:var(--pvfg);border-color:transparent}.pill.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.back{font-size:.9rem;margin:0 0 10px}

.eyebrow{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ttl{font-weight:600;color:var(--c1);margin:2px 0 8px}
.qq{font-size:1.12rem;line-height:1.55;font-family:Georgia,"Times New Roman",serif}
.hint{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.95rem;border:1px solid var(--line)}
.hint small{display:block;font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.hint.h1 small{color:var(--c3)}.hint.h2 small{color:var(--c4)}.hint.h3 small{color:var(--c2)}
.hint.h1{border-left:4px solid var(--c3)}.hint.h2{border-left:4px solid var(--c4)}.hint.h3{border-left:4px solid var(--c2)}
.fb.mid{background:var(--accent-soft)}
.expl h3{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.ansb{background:var(--okbg);border-radius:10px;padding:10px 12px}.ansb small{font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ok);font-weight:600}.ansb div{font-weight:600}
.pivot{background:var(--pvbg);color:var(--pvfg);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.95rem}

.steps{margin:0;padding-left:1.4em}.steps li{margin:6px 0;padding-left:4px}.steps li::marker{color:var(--c1);font-weight:700}
.fig{overflow-x:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px}
.fig svg{display:block;width:100%;max-width:420px;height:auto;margin:0 auto}
.fig .fg{stroke:var(--line);stroke-width:.6}.fig .fa{stroke:var(--muted);stroke-width:1.2}
.fig .fs{fill:none}.fig .fd{stroke-dasharray:5 4}
.fig .fs.c0,.fig .fs.c1{stroke:var(--c1)}.fig .fs.c2{stroke:var(--c2)}.fig .fs.c3{stroke:var(--c3)}.fig .fs.c4{stroke:var(--c4)}.fig .fs.c5{stroke:var(--c5)}
.fig .fdot.c0,.fig .fdot.c1{fill:var(--c1)}.fig .fdot.c2{fill:var(--c2)}.fig .fdot.c3{fill:var(--c3)}.fig .fdot.c4{fill:var(--c4)}.fig .fdot.c5{fill:var(--c5)}
.fig .fp{fill-opacity:var(--fillo)}.fig .fp.c1{fill:var(--c1);stroke:var(--c1)}.fig .fp.c2{fill:var(--c2);stroke:var(--c2)}.fig .fp.c3{fill:var(--c3);stroke:var(--c3)}
.fig .fp{stroke-opacity:1;stroke-width:2}

.fig .ft.c1{fill:var(--c1)}.fig .ft.c2{fill:var(--c2)}.fig .ft.c3{fill:var(--c3)}.fig .ft.c4{fill:var(--c4)}.fig .ft.c5{fill:var(--c5)}

.frows{display:grid;gap:6px}.frows div{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}

.flow .c1{border-color:var(--c1);color:var(--c1)}.flow .c2{border-color:var(--c3);color:var(--c3)}.flow .c3{border-color:var(--c4);color:var(--c4)}.flow .c4{border-color:var(--c2);color:var(--c2)}

.askbox{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.navx{margin-bottom:14px}
@media (max-width:380px){.ftree .kids{grid-template-columns:1fr}}

/* sample papers */
.pat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}

.pat span{display:block;font-size:.76rem;color:var(--muted)}.pat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}.pat small{font-size:.74rem;color:var(--muted)}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 10px;font-size:1.1rem}.sech span{font-size:.85rem;color:var(--muted);font-weight:500}

/* concept builder */
:root{--cbv:#6741d9;--cbbg:#f3f0ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cbv:#b197fc;--cbbg:#251f3d}}

.cbcard{border:2px solid var(--cbv);background:var(--cbbg)}

.btn.cbbtn{background:var(--cbv);color:#fff;text-align:center}

.cbgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cbtile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
.cbtile b{font-size:.95rem}.cbtile small{color:var(--muted);font-size:.76rem}
.cbtile:focus-visible,.cbm:focus-visible{outline:2px solid var(--cbv);outline-offset:2px}
.leg{display:grid;gap:6px;margin-top:8px;font-size:.88rem}.leg span{display:flex;align-items:center;gap:8px}.leg .ring{width:22px;height:22px}
.cbtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lvl{border-radius:20px;padding:0 9px;font-weight:600;font-size:.76rem}
.lvl.l1{background:var(--okbg);color:var(--ok)}.lvl.l2{background:var(--accent-soft);color:var(--accent)}.lvl.l3{background:var(--pvbg);color:var(--pvfg)}
.cbx h3:first-child{margin-top:14px}
.opt[disabled]{cursor:default;opacity:1}

/* mistakes log */
.mkcard{border-color:var(--bad)}
.btn.mkbtn{background:var(--bad);color:#fff;text-align:center}
.mki .mkq{font-weight:600;margin:2px 0 6px}
.mkr{font-size:.92rem;margin:2px 0}.mkr.bad{color:var(--bad)}.mkr.ok{color:var(--ok)}
.mki.fx{opacity:.85}

/* weekly report */
.wkcard{border-color:#1f8f4e}
.wknote{display:block}
.wknote .link{font-weight:600;margin-left:4px}

<script>
var NM={x:'Complex Numbers',p:'Permutations and Combinations',b:'Binomial Theorem',s:'Sequences and Series',g:'Straight Lines',c:'Circles',t:'Trigonometric Functions'};
var TEST=['x','p','b','s'];
var TG={
ipow:['Powers of i','i cycles every 4: i, −1, −i, 1. Divide the power by 4 and use the remainder.'],
isq:['Using i² = −1','Every i² becomes −1. Multiply out fully, then replace i² before collecting terms.'],
cmul:['Multiplying complex numbers','Expand like (a + b)(c + d): four products, then use i² = −1 and group real and imaginary parts.'],
mod:['Modulus slips','|a + ib| = √(a² + b²). Square both parts, add, then take the square root. It is never negative.'],
conjdiv:['Dividing complex numbers','Multiply top and bottom by the conjugate of the denominator. The bottom becomes a² + b².'],
argq:['Argument and quadrant','Get the reference angle α from tan α = |b/a|, then place it: Q2 gives π − α, Q3 gives −(π − α), Q4 gives −α.'],
sqrtc:['Square roots of complex numbers','Set (x + iy)² = a + ib, so x² − y² = a and 2xy = b. Check by squaring your answer.'],
cquad:['Negative discriminant','If b² − 4ac < 0 the roots are complex: (−b ± i√(4ac − b²))/2a. Never write "no solution".'],
qsign:['Sign of −b','The formula starts with −b. For x² + x + 1, b = 1 so −b = −1.'],
pvsc:['Order matters or not','Arrangements (order matters) use nPr. Selections (order doesn’t matter) use nCr = nPr/r!.'],
nprf:['nPr formula','nPr = n!/(n − r)!, which is r factors counting down from n. ⁸P₂ = 8 × 7.'],
rep:['Repetition allowed or not','Without repetition the choices shrink each step (5 × 4 × 3). nʳ is only for when items can repeat.'],
repletter:['Repeated letters','Divide n! by the factorial of every repeat count. APPLE has two Ps, so 5!/2!.'],
fcp:['AND means multiply','When one choice AND another both happen, multiply the counts. Add only for OR cases.'],
together:['"Always together" cases','Glue the pair into one block, arrange the blocks, then multiply by the ways to arrange inside the block.'],
cond:['Reading the condition','Use the restriction (for example, exactly 3 men) by choosing from each group separately, then multiply.'],
nth:['nth-term formula','AP: aₙ = a + (n − 1)d. Use n − 1, because the first term is already counted.'],
sumn:['Sum of 1 to n','1 + 2 + … + n = n(n + 1)/2.'],
apsum:['AP sum formula','Sₙ = n/2 [2a + (n − 1)d]. Don’t drop the n/2 at the front.'],
gpn:['GP nth term','aₙ = a·rⁿ⁻¹. The power is n − 1, not n.'],
apgp:['AP or GP?','Check the pattern first: a common difference means AP, a common ratio means GP.'],
ginf:['Sum to infinity','For |r| < 1, S∞ = a/(1 − r). The answer is a finite number.'],
gpsum:['GP sum formula','Sₙ = a(rⁿ − 1)/(r − 1). Subtract 1 from rⁿ before multiplying by a.'],
amgm:['AM vs GM','AM = (a + b)/2. GM = √(ab): multiply, then take the square root.'],
dist:['Distance formula slips','d = √((x₂ − x₁)² + (y₂ − y₁)²). Square each difference, add, then take the square root.'],
mid:['Midpoint mix-ups','Midpoint = ((x₁ + x₂)/2, (y₁ + y₂)/2). Add, then halve. Don’t subtract.'],
sec:['Section-ratio order','For ratio m:n, x = (m·x₂ + n·x₁)/(m + n). Divide by m + n, and m goes with the second point.'],
slope:['Slope slips','m = (y₂ − y₁)/(x₂ − x₁). Subtract in the same order on top and bottom.'],
perp:['Parallel and perpendicular','Parallel lines have equal slopes. Perpendicular slopes multiply to −1: flip the fraction and change the sign.'],
lineform:['Line-equation signs','Use y − y₁ = m(x − x₁). Substitute the point with its own signs, then simplify carefully.'],
pdist:['Point-to-line distance','d = |ax₁ + by₁ + c| / √(a² + b²). Take the modulus and divide by the square root.'],
centresign:['Sign of the centre','In (x − h)² + (y − k)² = r² the centre is (h, k). In x² + y² + 2gx + 2fy + c = 0 it is (−g, −f).'],
radiusc:['Radius formula slips','r² = g² + f² − c. Subtract c; if r² is negative there is no real circle.'],
halve:['Forgetting to halve','The coefficients of x and y are 2g and 2f. Halve them before reading off the centre.'],
rsquare:['Radius vs radius squared','The right-hand side is r², not r. For r = 4 write 16.'],
expandc:['Expanding to general form','Expanding (x − h)² + (y − k)² = r² gives constant h² + k² − r², not ±r².'],
distance:['Line and circle','Compare the distance d from the centre to the line with r: d = r tangent, d < r cuts twice, d > r misses.'],
diam:['Diameter endpoints','The centre is the midpoint of the endpoints and r is half their distance, so r² = (d/2)².'],
quadrant:['Quadrant signs','ASTC: All positive in Q1, Sin in Q2, Tan in Q3, Cos in Q4. Check the sign first.'],
refangle:['Reference angle','Find the angle from the nearest x-axis (180° − θ, θ − 180° or 360° − θ) before using the table.'],
sincos:['Mixing up ratios','Draw the triangle: sin = opp/hyp, cos = adj/hyp, tan = opp/adj.'],
radian:['Degree–radian conversion','Degrees × π/180 gives radians. Check with 180° = π.'],
identity:['Identity usage','sin²θ + cos²θ = 1. Rearrange it, then simplify or take the square root.'],
missing:['Missing solutions','In 0°–360° a trig equation usually has two answers. Use ASTC to find the second quadrant.'],
compound:['Compound-angle formulas','sin(A + B) = sinA cosB + cosA sinB. A sum of angles is not a sum of sines.'],
midterm:['Counting terms','(a + b)ⁿ has n + 1 terms. The term with b^r is the (r + 1)th term.'],
ncr:['nCr arithmetic','nCr = n!/(r!(n − r)!). Check with nCr = nC(n − r).'],
coefpow:['Powers on every part','Use nCr·a^(n−r)·b^r. The numbers inside a and b are raised to powers too, and (a + b)ⁿ ≠ aⁿ + bⁿ.'],
binsign:['Sign of the second term','In (a − b)ⁿ, b carries its minus sign: (−b)^r is negative for odd r.'],
binexp:['Wrong power or term number','General term T(r+1) = nCr·a^(n−r)·b^r. Match r to the power you want.']
};
var Q=[];
function add(p,l,q,o,a,t,h){Q.push({p:p,l:l,q:q,o:o,a:a,t:t.split(','),h:h})}
add('g',1,'Distance between A(1, 2) and B(4, 6)?',['7','5','25','√7'],1,'dist,,dist,dist','√(3² + 4²) = √25 = 5.');
add('g',1,'Midpoint of (2, −4) and (6, 8)?',['(8, 4)','(4, 2)','(2, 6)','(4, −2)'],1,'mid,,mid,mid','((2 + 6)/2, (−4 + 8)/2) = (4, 2).');
add('g',2,'Point dividing A(1, 2) and B(7, 8) internally in the ratio 2 : 1?',['(3, 4)','(4, 5)','(5, 6)','(15, 18)'],2,'sec,mid,,sec','x = (2·7 + 1·1)/3 = 5, y = (2·8 + 1·2)/3 = 6.');
add('g',2,'Slope of the line through (−1, 3) and (2, −3)?',['2','−2','−1/2','1/2'],1,'slope,,slope,slope','m = (−3 − 3)/(2 − (−1)) = −6/3 = −2.');
add('g',2,'Equation of the line through (2, −1) with slope 3?',['y = 3x − 5','y = 3x − 7','y = 3x + 7','y = 3x + 5'],1,'lineform,,lineform,lineform','y + 1 = 3(x − 2), so y = 3x − 7.');
add('g',3,'Line through (1, 2) perpendicular to 2x + y = 5?',['2x + y − 4 = 0','x − 2y + 3 = 0','x + 2y − 5 = 0','2x − y = 0'],1,'perp,,perp,perp','Given slope −2, so perpendicular slope 1/2. y − 2 = (x − 1)/2 gives x − 2y + 3 = 0.');
add('g',3,'Perpendicular distance from (3, 4) to 3x + 4y − 5 = 0?',['20','4','4/5','−4'],1,'pdist,,pdist,pdist','|9 + 16 − 5| / √(9 + 16) = 20/5 = 4.');
add('c',1,'Centre and radius of x² + y² − 6x + 4y − 12 = 0?',['Centre (−3, 2), r = 5','Centre (3, −2), r = 5','Centre (3, −2), r = 1','Centre (6, −4), r = 5'],1,'centresign,,radiusc,halve','g = −3, f = 2, so centre (3, −2). r² = 9 + 4 + 12 = 25.');
add('c',1,'Circle with centre (2, −3) and radius 4?',['(x + 2)² + (y − 3)² = 16','(x − 2)² + (y + 3)² = 16','(x − 2)² + (y + 3)² = 4','(x − 2)² + (y − 3)² = 16'],1,'centresign,,rsquare,centresign','Use (x − h)² + (y − k)² = r² with r² = 16.');
add('c',2,'Is x = 3 a tangent to (x − 1)² + (y + 2)² = 4?',['No, it cuts at two points','Yes, it is a tangent','No, it misses the circle','No, it passes through the centre'],1,'distance,,distance,distance','Centre (1, −2), r = 2. The distance to x = 3 is 2 = r.');
add('c',2,'Circle with centre (3, 4) through the origin?',['x² + y² − 6x − 8y + 25 = 0','x² + y² − 6x − 8y = 0','x² + y² + 6x + 8y = 0','x² + y² − 6x − 8y − 25 = 0'],1,'expandc,,centresign,expandc','r² = 25. Expanding (x − 3)² + (y − 4)² = 25 leaves constant 0.');
add('c',3,'Circle with diameter endpoints (1, 2) and (5, 6)?',['(x − 3)² + (y − 4)² = 8','(x − 3)² + (y − 4)² = 32','(x − 1)² + (y − 2)² = 8','(x + 3)² + (y + 4)² = 8'],0,',diam,diam,centresign','Centre (3, 4). d² = 32, so r² = (d/2)² = 8.');
add('c',3,'What does x² + y² + 2x − 4y + 6 = 0 represent?',['Circle, centre (−1, 2), r = 1','No real circle','Circle, r = √11','Circle, centre (1, −2)'],1,'radiusc,,radiusc,centresign','r² = 1 + 4 − 6 = −1, which is negative.');
add('t',1,'Find sin 150°',['−1/2','√3/2','1/2','−√3/2'],2,'quadrant,refangle,,sincos','Q2: sine is positive. Reference angle 30°, so sin 150° = 1/2.');
add('t',1,'Convert 135° into radians',['4π/3','3π/4','135π','3π/2'],1,'radian,,radian,radian','135 × π/180 = 3π/4.');
add('t',2,'Find tan 225°',['−1','1','√3','1/√3'],1,'quadrant,,refangle,refangle','Q3: tan is positive. Reference angle 45°, so tan 225° = 1.');
add('t',2,'If sin θ = 3/5 and θ is acute, find cos θ',['2/5','16/25','4/5','4/3'],2,'identity,identity,,sincos','cos²θ = 1 − 9/25 = 16/25, so cos θ = 4/5.');
add('t',2,'Simplify (1 − cos²θ)/sin θ',['cos θ','sin θ','tan θ','1/sin θ'],1,'identity,,sincos,identity','1 − cos²θ = sin²θ, so the result is sin θ.');
add('t',2,'Solve sin θ = 1/2 for 0° ≤ θ ≤ 360°',['30° only','30° and 150°','30° and 330°','60° and 120°'],1,'missing,,quadrant,refangle','Sine is positive in Q1 and Q2: 30° and 150°.');
add('t',3,'Find sin 75°',['(√6 − √2)/4','(√6 + √2)/4','(√2 + 1)/2','1/√2'],1,'compound,,compound,compound','sin(45° + 30°) = (√2/2)(√3/2) + (√2/2)(1/2) = (√6 + √2)/4.');
add('b',1,'How many terms are in the expansion of (x + y)⁸?',['8','9','10','7'],1,'midterm,,midterm,midterm','n + 1 = 9 terms.');
add('b',1,'Value of ⁶C₂',['30','15','12','36'],1,'ncr,,ncr,ncr','6!/(2!·4!) = (6 × 5)/2 = 15.');
add('b',2,'Expand (x + 2)³',['x³ + 8','x³ + 6x² + 12x + 8','x³ + 3x² + 3x + 8','x³ + 6x² + 6x + 8'],1,'coefpow,,coefpow,coefpow','x³ + 3(2)x² + 3(4)x + 8.');
add('b',2,'Third term of (1 − 2x)⁵',['−40x²','40x²','10x²','−10x'],1,'binsign,,coefpow,binexp','T₃ = ⁵C₂(−2x)² = 10 × 4x² = 40x².');
add('b',2,'Coefficient of x² in (2 + x)⁵',['40','80','10','20'],1,'binexp,,coefpow,coefpow','⁵C₂ · 2³ = 10 × 8 = 80.');
add('b',3,'Middle term of (x + 1/x)⁶',['15','20','20x³','6'],1,'midterm,,binexp,midterm','7 terms, so the 4th is the middle: ⁶C₃ x³(1/x)³ = 20.');
add('b',2,'Coefficient of x³ in (1 + x)⁷',['35','21','7','210'],0,',binexp,binexp,ncr','T(r+1) = ⁷Cr·xʳ, so r = 3: ⁷C₃ = 35.');
add('b',3,'Term independent of x in (x + 1/x)⁴',['6','4','1','12'],0,',binexp,binexp,ncr','T(r+1) = ⁴Cr·x^(4−r)·x^(−r). Power 4 − 2r = 0 gives r = 2: ⁴C₂ = 6.');
add('b',3,'Coefficient of x⁴ in (2x − 3)⁶',['2160','−2160','240','135'],0,',binsign,coefpow,coefpow','r = 2: ⁶C₂·(2)⁴·(−3)² = 15 × 16 × 9 = 2160.');
add('x',1,'Simplify i³⁵',['i','−i','1','−1'],1,'ipow,,ipow,ipow','35 = 4 × 8 + 3, so i³⁵ = i³ = −i.');
add('x',1,'Simplify (2 + 3i)(1 − i)',['5 + i','−1 + i','2 − 3i','5 − i'],0,',isq,cmul,cmul','2 − 2i + 3i − 3i² = 2 + i + 3 = 5 + i.');
add('x',1,'Modulus of 3 − 4i',['5','−5','25','7'],0,',mod,mod,mod','√(3² + 4²) = √25 = 5.');
add('x',2,'Simplify (1 + i)/(1 − i)',['i','−i','1','0'],0,',conjdiv,conjdiv,conjdiv','Multiply by (1 + i)/(1 + i): (1 + i)²/2 = 2i/2 = i.');
add('x',2,'Argument (principal) of −1 + i√3',['π/3','2π/3','−π/3','−2π/3'],1,'argq,,argq,argq','Reference angle π/3. The point is in Q2, so arg = π − π/3 = 2π/3.');
add('x',2,'Square roots of 3 + 4i',['±(2 + i)','±(1 + 2i)','±(2 − i)','±√7'],0,',sqrtc,sqrtc,mod','x² − y² = 3 and 2xy = 4 give x = 2, y = 1. Check: (2 + i)² = 4 + 4i − 1 = 3 + 4i.');
add('x',3,'Roots of x² + x + 1 = 0',['(−1 ± i√3)/2','(1 ± i√3)/2','(−1 ± √3)/2','No solution'],0,',qsign,cquad,cquad','D = 1 − 4 = −3, so x = (−1 ± i√3)/2.');
add('x',3,'Polar form of 1 + i',['√2(cos π/4 + i sin π/4)','2(cos π/4 + i sin π/4)','√2(cos π/2 + i sin π/2)','cos π/4 + i sin π/4'],0,',mod,argq,mod','r = √(1 + 1) = √2 and θ = π/4 (Q1).');
add('p',1,'Value of ⁸P₂',['56','28','16','64'],0,',pvsc,nprf,rep','⁸P₂ = 8 × 7 = 56.');
add('p',1,'Arrangements of the letters of APPLE',['120','60','24','30'],1,'repletter,,repletter,repletter','5 letters with P twice: 5!/2! = 60.');
add('p',2,'Ways to choose a committee of 3 from 7 people',['210','35','21','343'],1,'pvsc,,ncr,rep','Order doesn’t matter: ⁷C₃ = (7 × 6 × 5)/6 = 35.');
add('p',2,'3-digit numbers from 1, 2, 3, 4, 5 with no digit repeated',['60','125','10','15'],0,',rep,pvsc,fcp','5 × 4 × 3 = 60.');
add('p',2,'Ways to seat 5 people in a row if two of them must sit together',['48','24','120','96'],0,',together,together,together','Treat the pair as one block: 4! × 2! = 24 × 2 = 48.');
add('p',3,'Committees of 5 from 6 men and 4 women with exactly 3 men',['120','252','26','720'],0,',cond,fcp,pvsc','⁶C₃ × ⁴C₂ = 20 × 6 = 120.');
add('p',3,'Arrangements of the letters of MISSISSIPPI',['34650','39916800','69300','831600'],0,',repletter,repletter,repletter','11!/(4! · 4! · 2!) for I×4, S×4, P×2 = 34650.');
add('s',1,'10th term of the AP 3, 7, 11, …',['43','39','40','30'],1,'nth,,nth,nth','a + 9d = 3 + 9 × 4 = 39.');
add('s',1,'Sum of the first 20 natural numbers',['200','210','420','190'],1,'sumn,,sumn,sumn','20 × 21/2 = 210.');
add('s',2,'Sum of the first 10 terms of 2, 5, 8, …',['155','170','145','310'],0,',nth,apsum,apsum','S₁₀ = 10/2 [4 + 9 × 3] = 5 × 31 = 155.');
add('s',2,'6th term of the GP 2, 6, 18, …',['1458','486','162','36'],1,'gpn,,gpn,apgp','a·r⁵ = 2 × 3⁵ = 2 × 243 = 486.');
add('s',2,'Sum to infinity of 1 + 1/2 + 1/4 + …',['2','1','∞','3/2'],0,',ginf,ginf,ginf','a/(1 − r) = 1/(1 − 1/2) = 2.');
add('s',3,'Sum of the first 5 terms of the GP 3, 6, 12, …',['93','96','48','45'],0,',gpsum,gpn,apgp','3(2⁵ − 1)/(2 − 1) = 3 × 31 = 93.');
add('s',3,'Geometric mean of 4 and 16',['10','8','64','12'],1,'amgm,,amgm,amgm','√(4 × 16) = √64 = 8. (10 is the AM.)');
add('s',3,'In an AP the 3rd term is 7 and the 7th term is 15. Find a and d',['a = 3, d = 2','a = 7, d = 2','a = 1, d = 3','a = 3, d = 4'],0,',nth,nth,nth','a + 2d = 7 and a + 6d = 15, so 4d = 8: d = 2, a = 3.');


Object.assign(TG,{
argrule:['Arguments of products and quotients','arg(z₁z₂) = arg z₁ + arg z₂ and arg(z₁/z₂) = arg z₁ − arg z₂. Watch the sign of the angle you subtract.'],
locus:['Locus from |z − a| = |z − b|','Put z = x + iy, square both moduli and simplify. Equal distances from two points give their perpendicular bisector.'],
omega:['Cube roots of unity','Use 1 + ω + ω² = 0 and ω³ = 1 to replace sums before multiplying.'],
diag:['Diagonals of a polygon','Choose any 2 vertices (ⁿC₂), then subtract the n sides: ⁿC₂ − n.'],
gap:['"No two together" cases','Arrange the others first, then place the restricted items in the gaps between them.'],
square:['Spot the perfect square','1 + 2x + x² = (1 + x)², so (1 + 2x + x²)¹⁰ = (1 + x)²⁰. Simplify the base first.'],
approx:['Approximation by expansion','Write the number as (1 + small)ⁿ and keep terms until they stop changing the decimal places asked for.'],
sumcoef:['Sum of coefficients','Put x = 1 in the whole expression.'],
snan:['Term from a sum formula','aₙ = Sₙ − Sₙ₋₁. The sum formula gives totals, not single terms.'],
twoans:['Keeping both answers','A quadratic in n can give two valid answers. Check each one before dropping it.'],
gpprod:['Symmetric terms of a GP','Take five terms as a/r², a/r, a, ar, ar². Their product is a⁵, so only the middle term matters.'],
split:['Series hiding a GP','Rewrite each term so a GP appears, e.g. 0.77…7 = (7/9)(1 − 10⁻ᵏ), then sum the parts separately.'],
sumform:['Standard sums','Split into Σk² + Σk, then use Σk = n(n + 1)/2 and Σk² = n(n + 1)(2n + 1)/6.'],
insertm:['Inserting means','n means between a and b make n + 2 terms, so d = (b − a)/(n + 1).']
});
function isc(p,l,q,o,a,t,h){add(p,l,q,o,a,t,h);Q[Q.length-1].isc=1}
isc('x',2,'If z = (1 + i)/(1 − i), find z¹⁰⁰',['1','−1','i','−i'],0,',ipow,ipow,conjdiv','z = (1 + i)²/2 = i, and 100 is a multiple of 4, so i¹⁰⁰ = 1.');

  if(GEN){cur=GEN[n];show();return}

  c.forEach(function(q){var s=-Math.abs(q.l-S.l[q.p])*2+wt8(q)*(mode==='w'||mode==='m'||mode==='e'?3:1)+Math.random()*(mode==='m'||mode==='e'?2:.5);

}

  if(S.an){t+='\nClaude’s diagnosis: '+S.an.summary+'\n';(S.an.weaknesses||[]).forEach(function(w){t+='– '+w.name+': '+w.fix+'\n'});if(S.an.for_tutor)t+='\nFor the tutor: '+S.an.for_tutor}
  return t}
function anHtml(a){
  var h='<p style="margin:0 0 8px">'+esc(a.summary)+'</p>';
  (a.weaknesses||[]).forEach(function(w){h+='<div class="spot" style="margin:8px 0"><b>'+esc(w.name)+'</b><br><small>Evidence: '+esc(w.evidence)+'</small><br>Why: '+esc(w.cause)+'<br>Fix: '+esc(w.fix)+'</div>'});
  if(a.strengths)h+='<p style="margin:8px 0"><b>Going well:</b> '+esc(a.strengths)+'</p>';
  if(a.plan&&a.plan.length){h+='<b>Next steps</b><ol style="margin:4px 0 0;padding-left:20px">';a.plan.forEach(function(p){h+='<li>'+esc(p)+'</li>'});h+='</ol>'}
  if(a.for_tutor)h+='<p style="margin:10px 0 0"><b>For the tutor:</b> '+esc(a.for_tutor)+'</p>';
  return h;
}
async function analyse(){
  if(busy)return;var m=document.getElementById('am'),b=this;busy=true;b.disabled=true;m.textContent='Claude is reading the full history…';
  try{
    var s=await getS();if(!s){m.textContent='Claude is not available here. Open the app while signed in to claude.ai.';return}
    var sm=summary(),lines=[];
    Object.keys(sm.byT).forEach(function(k){lines.push(k+': '+sm.byT[k][0]+'/'+sm.byT[k][1]+' correct')});
    var hab=Object.keys(sm.hab).map(function(k){return k+' ×'+sm.hab[k]}).join('; ');
    var rec=S.ev.slice(-60).map(function(e){return e.k==='q'?(e.ok?'✓ ':'✗ ')+(NM[e.p]||e.p)+' L'+e.l+': '+e.q+(e.ok?'':' | chose '+e.pick+' | habit: '+tg(e.tag)[0]):'notebook '+e.topic+': '+(e.ok?'correct':e.type+' error, habit: '+e.habit)}).join('\n');
    var a=await s.json('You are an experienced maths tutor reviewing a student’s practice history.\nAccuracy by topic:\n'+lines.join('\n')+'\nMistake habits with counts: '+(hab||'none')+'\nRecent activity, oldest first (✓ correct, ✗ wrong; "chose" is the wrong pick):\n'+rec+'\n\nFind the real underlying weaknesses, not just topic names: look for the same error across topics (signs, formula recall, reading the question, arithmetic) and whether recent answers show improvement. Base every claim on the evidence shown; if the data is thin, say so. Write warmly and plainly to a student and tutor. Return JSON only: {"summary":"2-3 sentences","weaknesses":[{"name":"short label","evidence":"what in the data shows it","cause":"likely reason","fix":"one concrete fix"}] (max 3, worst first),"strengths":"one sentence","plan":["3-4 specific next steps for the next few days"],"for_tutor":"one or two sentences on what to watch for in person"}',{modelTier:'complex',cache:false});
    if(!a||!a.summary)throw new Error('shape');
    S.an=a;S.anAt=Date.now();S.anN=S.ev.length;save();spotsView();
  }catch(e){m.textContent=e&&e.code?sampleErr(e):'Claude’s diagnosis came back in the wrong shape. Try again.';b.disabled=false}
  finally{busy=false}
}

X('cx','Division by the conjugate, powers of i',1,

  'The numbers are the roots of t² − 20t + 64 = 0.',
  '(t − 4)(t − 16) = 0, so the numbers are {{4 and 16}}.',
  'Check: AM = 10, GM = √64 = 8, and AM ≥ GM as expected.'],
 {k:'nline',r:[0,20],pts:[[4,'4',1],[16,'16',1],[10,'AM = 10',2],[8,'GM = 8',3]]},
 ['Translate the means','Get sum and product','Build the quadratic','Solve and check'],
 'Sum and product together pin down two numbers completely. Many problems hide that pair; once you spot it, the quadratic writes itself.');

X('ss','Arithmetico-geometric series',3,
 'Find the sum to infinity of 1 + 2x + 3x² + 4x³ + …, where |x| < 1.',
 '1/(1 − x)²',
 ['The coefficients form an AP and the powers form a GP. What happens if you multiply the whole sum by x?',
  'Write S and xS one under the other, shifted by one place, and subtract.',
  'S − xS = 1 + x + x² + … , an ordinary GP with sum 1/(1 − x).'],
 ['{{Multiply by the ratio, shift, subtract}}: the AP part disappears and leaves a GP.',
  '|x| < 1 is what lets the infinite GP have a sum.'],
 ['S = 1 + 2x + 3x² + 4x³ + …',
  'xS = x + 2x² + 3x³ + …',
  'Subtract: (1 − x)S = 1 + x + x² + x³ + … = {{1/(1 − x)}}.',
  'So {{S = 1/(1 − x)²}}.'],
 {k:'rows',r:[['S','= 1 + 2x + 3x² + 4x³ + …'],['xS','=      x + 2x² + 3x³ + …'],['(1 − x)S','= 1 +  x +  x² +  x³ + …']],hl:2},
 ['Write S','Multiply by the ratio','Shift and subtract','Sum the GP left over'],
 'Shift-and-subtract is a way to make a problem cancel itself. Two copies of almost the same thing, lined up one place apart, leave behind only the simple part.');

/* ===== Points and Locus ===== */
X('pt','Classifying a triangle by distances',1,
 'Show that A(1, 2), B(4, 6) and C(8, 3) form a right-angled isosceles triangle.',
 'AB = BC = 5 and AB² + BC² = AC² = 50',
 ['Find all three side lengths.',
  'Work with squared lengths to avoid roots: AB², BC², AC².',
  'AB² = 25, BC² = 25, AC² = 50. Which test does that pass?'],
 ['{{Use squared lengths}}: Pythagoras compares squares anyway.',
  'Two equal sides gives isosceles; {{sum of two squares equals the third}} gives a right angle.'],
 ['AB² = (4 − 1)² + (6 − 2)² = 9 + 16 = {{25}}.',
  'BC² = (8 − 4)² + (3 − 6)² = 16 + 9 = {{25}}.',
  'AC² = (8 − 1)² + (3 − 2)² = 49 + 1 = {{50}}.',
  'AB = BC = 5, so the triangle is isosceles.',
  'AB² + BC² = 50 = AC², so the right angle is at {{B}}.'],
 {k:'plane',x:[-0.5,9.5],y:[-0.5,7.5],el:[{poly:[[1,2],[4,6],[8,3]],c:1},
   {p:[1,2],l:'A(1, 2)',c:1},{p:[4,6],l:'B(4, 6)',c:2},{p:[8,3],l:'C(8, 3)',c:1},
   {tx:[1.6,4.5],l:'5',c:3},{tx:[6.4,5.1],l:'5',c:3},{tx:[4.6,1.9],l:'√50',c:5}]},
 ['Compute all three sides','Compare for equal sides','Test Pythagoras','State the conclusion'],
 'In coordinate geometry, a shape is proved by measuring it. Decide which measurements would prove the claim, compute exactly those, and say which fact each one shows.');

X('pt','Ratio of division by an axis',2,
 'In what ratio does the y-axis divide the segment joining P(−3, 4) and Q(2, −1)? Find the point of division.',
 'Ratio 3 : 2; the point is (0, 1)',
 ['What is true about the x-coordinate of any point on the y-axis?',
  'Take the ratio as k : 1 so there is only one unknown. Set the x-coordinate of the section point to 0.',
  '(2k − 3)/(k + 1) = 0 gives k = 3/2.'],
 ['{{Use k : 1}} to keep one unknown.',
  'On the y-axis {{x = 0}}; on the x-axis y = 0.'],
 ['Let the ratio be k : 1. The point is ((2k − 3)/(k + 1), (−k + 4)/(k + 1)).',
  'On the y-axis: 2k − 3 = 0, so {{k = 3/2}}. The ratio is {{3 : 2}}.',
  'y = (3(−1) + 2(4))/(3 + 2) = 5/5 = 1.',
  'The point is {{(0, 1)}}.'],
 {k:'plane',x:[-4,3],y:[-2,5],el:[{seg:[[-3,4],[2,-1]],c:1,w:3},
   {p:[-3,4],l:'P(−3, 4)',c:1},{p:[2,-1],l:'Q(2, −1)',c:1},{p:[0,1],l:'(0, 1)',c:2},
   {tx:[-1.7,3.2],l:'3',c:3},{tx:[1.2,0.6],l:'2',c:3}]},
 ['Name the ratio k : 1','Write the section point','Apply the axis condition','Find k, then the point'],
 'Give the unknown a name, write the general answer in terms of it, then let the condition fix the name. This works for almost every section-formula question.');

X('pt','Collinearity by zero area',1,
 'Find k if the points (k, 2), (3, −1) and (5, 0) are collinear.',
 'k = 9',
 ['If three points lie on one line, what is the area of the triangle they form?',
  'Use Area = ½ |x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)| and set it to 0.',
  'k(−1 − 0) + 3(0 − 2) + 5(2 + 1) = 0.'],
 ['{{Collinear means zero area.}}',
  'Equal slopes give the same result and are a good check.'],
 ['Area = ½ |k(−1 − 0) + 3(0 − 2) + 5(2 − (−1))|.',
  '= ½ |−k − 6 + 15| = ½ |9 − k|.',
  'Set to zero: {{k = 9}}.',
  'Check: slope from (3, −1) to (5, 0) is 1/2; from (5, 0) to (9, 2) is 2/4 = 1/2.'],
 {k:'plane',x:[1.5,10],y:[-2,3],el:[{ln:[1,-2,-5],c:5,dash:1},
   {p:[3,-1],l:'(3, −1)',c:1},{p:[5,0],l:'(5, 0)',c:1},{p:[9,2],l:'(9, 2)',c:2}]},
 ['Turn the condition into zero area','Write the area formula','Solve for k','Check with slopes'],
 'Look for a number that is zero exactly when the condition holds. Area for collinearity, the discriminant for equal roots, distance for touching. Setting it to zero turns words into an equation.');

X('pt','Locus of a moving point',2,
 'Find the locus of a point that is equidistant from A(2, 3) and B(−1, 4).',
 '3x − y + 2 = 0',
 ['Call the moving point P(x, y). Write the condition PA = PB.',
  'Square both sides to remove the roots.',
  '(x − 2)² + (y − 3)² = (x + 1)² + (y − 4)². The x² and y² terms cancel.'],
 ['{{Name the moving point P(x, y)}} and translate the condition.',
  'Equidistant from two points: expect a {{straight line}} (the perpendicular bisector).'],
 ['PA² = PB²: (x − 2)² + (y − 3)² = (x + 1)² + (y − 4)².',
  'Expand: −4x + 4 − 6y + 9 = 2x + 1 − 8y + 16.',
  'Simplify: −6x + 2y − 4 = 0, so {{3x − y + 2 = 0}}.',
  'Check: the midpoint (1/2, 7/2) lies on it, and its slope 3 is perpendicular to AB’s slope −1/3.'],
 {k:'plane',x:[-3,4],y:[-1,7],el:[{ln:[3,-1,2],c:1,w:3,l:'3x − y + 2 = 0'},{seg:[[2,3],[-1,4]],c:5,dash:1},
   {p:[2,3],l:'A(2, 3)',c:2},{p:[-1,4],l:'B(−1, 4)',c:2},{p:[0.5,3.5],c:3}]},
 ['Name the moving point','Translate the condition','Square to remove roots','Simplify'],
 'A locus is a rule turned into an equation. You never need to imagine the shape first: write the rule for a general point and the algebra draws the shape for you.');

X('pt','Fourth vertex of a parallelogram',1,
 'Three vertices of parallelogram ABCD are A(1, 2), B(4, 3) and C(6, 6). Find D.',
 'D(3, 5)',
 ['Which property of a parallelogram involves its diagonals?',
  'The diagonals bisect each other, so AC and BD have the same midpoint.',
  'Midpoint of AC is (7/2, 4). Set the midpoint of BD equal to it.'],
 ['{{Diagonals bisect each other}}: same midpoint.',
  'Keep the vertex order: A and C are opposite, B and D are opposite.'],
 ['Midpoint of AC = ((1 + 6)/2, (2 + 6)/2) = {{(7/2, 4)}}.',
  'Midpoint of BD = ((4 + x)/2, (3 + y)/2).',
  '4 + x = 7 gives x = 3; 3 + y = 8 gives y = 5.',
  'D = {{(3, 5)}}.'],
 {k:'plane',x:[0,7],y:[1,7],el:[{poly:[[1,2],[4,3],[6,6],[3,5]],c:1},{seg:[[1,2],[6,6]],c:5,dash:1},{seg:[[4,3],[3,5]],c:5,dash:1},
   {p:[1,2],l:'A',c:1},{p:[4,3],l:'B',c:1},{p:[6,6],l:'C',c:1},{p:[3,5],l:'D(3, 5)',c:2},{p:[3.5,4],c:3}]},
 ['Recall the shape’s key property','Turn it into equal midpoints','Solve coordinate by coordinate','Check the order of vertices'],
 'Geometry facts become coordinate equations. Choose the property that uses what you already know, and the unknown point falls out one coordinate at a time.');

/* ===== Straight Lines ===== */
X('sl','Equal intercepts',1,
 'Find the equation of the line through (2, 3) that cuts off equal intercepts on the axes.',
 'x + y = 5 (and 3x − 2y = 0 if zero intercepts count)',
 ['Which form of a line uses the intercepts directly?',
  'Intercept form x/a + y/b = 1 with a = b gives x + y = a.',
  'Put (2, 3) in x + y = a.'],
 ['{{Intercept form with a = b}} becomes x + y = a.',
  'Watch for the special case: a line through the origin has both intercepts 0.'],
 ['With equal intercepts a: x/a + y/a = 1, so x + y = a.',
  'Through (2, 3): a = 5. The line is {{x + y = 5}}.',
  'If zero intercepts are allowed, the line through the origin and (2, 3) also works: 3x − 2y = 0.'],
 {k:'plane',x:[-1,6.5],y:[-1,6.5],el:[{ln:[1,1,-5],c:1,w:3,l:'x + y = 5'},
   {p:[2,3],l:'(2, 3)',c:2},{p:[5,0],l:'5',c:3},{p:[0,5],l:'5',c:3}]},
 ['Choose the form that matches the data','Apply the condition a = b','Substitute the point','Check special cases'],
 'Each form of a line exists because some data fit it naturally. Read what the question gives you, and pick the form whose letters are exactly those quantities.');

X('sl','Normal form',2,
 'Reduce √3x + y − 8 = 0 to normal form. Find p and α.',
 'x cos 30° + y sin 30° = 4; p = 4, α = 30°',
 ['Normal form is x cos α + y sin α = p. What do you divide by?',
  'Divide every term by √(a² + b²) = √(3 + 1) = 2. Keep the constant positive on the right.',
  '(√3/2)x + (1/2)y = 4. Which angle has cos = √3/2 and sin = 1/2?'],
 ['{{Divide by √(a² + b²)}} and {{keep p positive}} (fix signs before dividing).',
  'p is the perpendicular distance from the origin; α is the angle that perpendicular makes with the x-axis.'],
 ['Move the constant: √3x + y = 8.',
  '√(a² + b²) = √(3 + 1) = {{2}}.',
  'Divide: (√3/2)x + (1/2)y = 4.',
  'cos α = √3/2 and sin α = 1/2, so {{α = 30°}}.',
  'Normal form: {{x cos 30° + y sin 30° = 4}}, with p = 4.'],
 {k:'plane',x:[-0.8,5.5],y:[-0.8,5],el:[{ln:[1.732,1,-8],c:1,w:3},{seg:[[0,0],[3.464,2]],c:2,w:2.5},
   {arc:[0,0,0.9,0,30],c:3,l:'α = 30°',lp:[1.15,0.2]},{tx:[1.2,1.35],l:'p = 4',c:2},{p:[3.464,2],c:2}]},
 ['Move the constant across','Divide by √(a² + b²)','Read off cos α and sin α','Write p and α'],
 'Normal form describes a line by its closest approach to the origin. Every line can be described that way; dividing by √(a² + b²) is just the conversion.');

X('sl','Perpendicular through a point',1,
 'Find the equation of the line through (1, −2) perpendicular to 3x − 4y + 5 = 0.',
 '4x + 3y + 2 = 0',
 ['What happens to the slope when you turn a line through 90°?',
  'A perpendicular to ax + by + c = 0 has the form bx − ay + k = 0. Here that is 4x + 3y + k = 0.',
  'Put (1, −2) in to find k.'],
 ['{{Swap the coefficients and change one sign}}: 3x − 4y → 4x + 3y.',
  'Slopes of perpendicular lines multiply to −1 (3/4 × −4/3).'],
 ['Perpendicular family: {{4x + 3y + k = 0}}.',
  'Through (1, −2): 4 − 6 + k = 0, so k = 2.',
  'The line is {{4x + 3y + 2 = 0}}.'],
 {k:'plane',x:[-3,3],y:[-3.5,2.5],el:[{ln:[3,-4,5],c:5,w:2,l:'3x − 4y + 5 = 0'},{ln:[4,3,2],c:1,w:3,l:'4x + 3y + 2 = 0'},{p:[1,-2],l:'(1, −2)',c:2}]},
 ['Write the perpendicular family','Substitute the point','Find k','Write the line'],
 'Rather than computing slopes, write the whole family of lines with the right direction, then let the point pick the one member you need.');

X('sl','Distance between parallel lines',2,
 'Find the distance between the parallel lines 3x + 4y − 7 = 0 and 6x + 8y + 11 = 0.',
 '5/2',
 ['Are the x and y coefficients the same in both equations?',
  'Multiply the first line by 2 so both start with 6x + 8y.',
  'd = |c₁ − c₂| / √(a² + b²) with a = 6, b = 8.'],
 ['{{Make the x and y coefficients identical first.}} This is the trap in the question.',
  'd = |c₁ − c₂| / √(a² + b²).'],
 ['First line × 2: 6x + 8y − 14 = 0.',
  'Second line: 6x + 8y + 11 = 0.',
  'd = |−14 − 11| / √(36 + 64) = 25/10 = {{5/2}}.'],
 {k:'plane',x:[-2,5],y:[-3,3.5],el:[{ln:[3,4,-7],c:1,w:3},{ln:[6,8,11],c:1,w:3},{seg:[[1,1],[-0.5,-1]],c:2,w:2.5},{tx:[0.7,-0.25],l:'d = 5/2',c:2}]},
 ['Match the coefficients','Read off c₁ and c₂','Apply the formula','Simplify'],
 'A formula assumes its inputs are in a particular shape. Before using one, check the shape; most mistakes here come from skipping that check.');

X('sl','Foot of the perpendicular',2,
 'Find the foot of the perpendicular from (−1, 3) to the line 3x − 4y − 16 = 0.',
 '(68/25, −49/25)',
 ['The foot lies on the line, and moving to it goes in the direction (3, −4). Can you write that as one equation?',
  'Use (x − x₁)/a = (y − y₁)/b = −(ax₁ + by₁ + c)/(a² + b²).',
  'ax₁ + by₁ + c = −3 − 12 − 16 = −31, and a² + b² = 25. So the common value is 31/25.'],
 ['{{Foot formula}}: (x − x₁)/a = (y − y₁)/b = −(ax₁ + by₁ + c)/(a² + b²).',
  'For the image of a point, the same formula has {{−2(ax₁ + by₁ + c)}}.'],
 ['a = 3, b = −4, c = −16, (x₁, y₁) = (−1, 3).',
  'ax₁ + by₁ + c = −3 − 12 − 16 = {{−31}}; a² + b² = 25.',
  '(x + 1)/3 = (y − 3)/(−4) = 31/25.',
  'x = −1 + 93/25 = 68/25; y = 3 − 124/25 = −49/25.',
  'Foot: {{(68/25, −49/25)}}. Check: 3(68) − 4(−49) − 16(25) = 0.'],
 {k:'plane',x:[-2,6],y:[-3,4],el:[{ln:[3,-4,-16],c:1,w:3},{seg:[[-1,3],[2.72,-1.96]],c:2,dash:1},
   {p:[-1,3],l:'(−1, 3)',c:2},{p:[2.72,-1.96],l:'foot',c:3}]},
 ['Note the line’s direction numbers','Compute ax₁ + by₁ + c','Apply the foot formula','Check the point is on the line'],
 'The perpendicular from a point always travels in the direction (a, b) of the line’s normal. Knowing that direction, you only need how far to go, and the formula gives exactly that.');

X('sl','Line through an intersection',2,
 'Find the line through the intersection of x + y = 4 and 2x − y = 5 that is parallel to 3x + 2y = 1.',
 '3x + 2y = 11',
 ['First find where the two lines meet, or use the family L₁ + λL₂ = 0.',
  'Adding the equations gives 3x = 9. A parallel line has the form 3x + 2y = k.',
  'The intersection is (3, 1). Put it into 3x + 2y = k.'],
 ['{{Parallel lines share their x and y coefficients}}: 3x + 2y = k.',
  'Alternative: L₁ + λL₂ = 0 passes through the intersection for every λ.'],
 ['Solve x + y = 4 and 2x − y = 5: adding gives x = 3, then y = 1.',
  'The intersection is {{(3, 1)}}.',
  'Parallel to 3x + 2y = 1: 3x + 2y = k.',
  'k = 9 + 2 = 11, so the line is {{3x + 2y = 11}}.'],
 {k:'plane',x:[0,5.5],y:[-2,5],el:[{ln:[1,1,-4],c:5,w:2},{ln:[2,-1,-5],c:5,w:2},{ln:[3,2,-11],c:1,w:3,l:'3x + 2y = 11'},{ln:[3,2,-1],c:3,dash:1},{p:[3,1],l:'(3, 1)',c:2}]},
 ['Find the meeting point','Write the parallel family','Substitute the point','State the line'],
 'A line is fixed by one point and one direction. Find each separately from the conditions, then combine them.');

X('sl','Angle between two lines',1,
 'Find the angle between the lines y − √3x − 5 = 0 and √3y − x + 6 = 0.',
 '30°',
 ['Find the slope of each line.',
  'm₁ = √3 and m₂ = 1/√3. What angles do these slopes make with the x-axis?',
  'tan θ = |(m₁ − m₂)/(1 + m₁m₂)|.'],
 ['{{tan θ = |(m₁ − m₂)/(1 + m₁m₂)|}} gives the acute angle.',
  'Shortcut: slopes √3 and 1/√3 mean inclinations of 60° and 30°.'],
 ['Line 1: y = √3x + 5, so m₁ = √3 (inclination 60°).',
  'Line 2: y = x/√3 − 6/√3, so m₂ = 1/√3 (inclination 30°).',
  'tan θ = |(√3 − 1/√3)/(1 + 1)| = |(2/√3)/2| = 1/√3.',
  'θ = {{30°}}.'],
 {k:'plane',x:[-11,2],y:[-11,4],el:[{ln:[-1.732,1,-5],c:1,w:3,l:'slope √3'},{ln:[-1,1.732,6],c:2,w:3,l:'slope 1/√3'},{p:[-7.33,-7.7],l:'θ = 30°',c:3}]},
 ['Write each line as y = mx + c','Read the slopes','Apply the angle formula','Take the acute angle'],
 'Slope is direction written as a number. Comparing directions is comparing slopes, and the tangent formula is the tool that does it.');

/* ===== Circles ===== */
X('ci','Centre and radius from the general form',1,
 'Find the centre and radius of 2x² + 2y² − 8x + 12y − 6 = 0.',
 'Centre (2, −3), radius 4',
 ['Is the coefficient of x² equal to 1?',
  'Divide by 2 first: x² + y² − 4x + 6y − 3 = 0. Now compare with x² + y² + 2gx + 2fy + c = 0.',
  '2g = −4 and 2f = 6, so g = −2 and f = 3. The centre is (−g, −f).'],
 ['{{Make the x² and y² coefficients 1 first.}}',
  'Centre {{(−g, −f)}}, radius √(g² + f² − c).'],
 ['Divide by 2: x² + y² − 4x + 6y − 3 = 0.',
  '2g = −4, so g = −2; 2f = 6, so f = 3; c = −3.',
  'Centre = (−g, −f) = {{(2, −3)}}.',
  'r = √(4 + 9 + 3) = √16 = {{4}}.'],
 {k:'plane',x:[-3,7],y:[-8,2],el:[{ci:[2,-3,4],c:1,w:3},{p:[2,-3],l:'(2, −3)',c:2},{seg:[[2,-3],[6,-3]],c:3},{tx:[4,-2.6],l:'r = 4',c:3}]},
 ['Normalise the x² coefficient','Read 2g, 2f, c','Centre (−g, −f)','Radius √(g² + f² − c)'],
 'Formulas assume a standard shape. Get the equation into that shape first; reading off the answer is then mechanical.');

X('ci','Circle through three points',2,
 'Find the equation of the circle through (1, 1), (2, −1) and (3, 2).',
 'x² + y² − 5x − y + 4 = 0',
 ['Start with x² + y² + 2gx + 2fy + c = 0. How many equations do the three points give?',
  'Substitute each point. Then subtract pairs of equations to remove c.',
  'You should reach 3 + 2g − 4f = 0 and 8 + 2g + 6f = 0.'],
 ['{{Three points, three unknowns (g, f, c).}}',
  '{{Subtract pairs}} to eliminate c first.'],
 ['(1, 1): 2 + 2g + 2f + c = 0.',
  '(2, −1): 5 + 4g − 2f + c = 0.',
  '(3, 2): 13 + 6g + 4f + c = 0.',
  'Subtract: 3 + 2g − 4f = 0 and 8 + 2g + 6f = 0. Then 10f = −5, so {{f = −1/2}} and {{g = −5/2}}.',
  'c = −2 − 2g − 2f = −2 + 5 + 1 = {{4}}.',
  'Circle: {{x² + y² − 5x − y + 4 = 0}}.'],
 {k:'plane',x:[0,5],y:[-1.5,2.6],el:[{ci:[2.5,0.5,1.581],c:1,w:3},{p:[1,1],l:'(1, 1)',c:2},{p:[2,-1],l:'(2, −1)',c:2},{p:[3,2],l:'(3, 2)',c:2},{p:[2.5,0.5],l:'centre',c:3}]},
 ['Write the general equation','Substitute each point','Eliminate c by subtracting','Solve for g and f'],
 'Count unknowns and conditions. When they match, each condition becomes one equation, and the job is just careful elimination.');

X('ci','Diameter form',1,
 'Find the equation of the circle with the points (−2, 3) and (4, −5) as ends of a diameter.',
 'x² + y² − 2x + 2y − 23 = 0',
 ['There is a form of the circle equation that uses the ends of a diameter directly.',
  '(x − x₁)(x − x₂) + (y − y₁)(y − y₂) = 0.',
  '(x + 2)(x − 4) + (y − 3)(y + 5) = 0. Expand.'],
 ['{{Diameter form}}: (x − x₁)(x − x₂) + (y − y₁)(y − y₂) = 0.',
  'It comes from the angle in a semicircle being 90°.'],
 ['(x + 2)(x − 4) + (y − 3)(y + 5) = 0.',
  'x² − 2x − 8 + y² + 2y − 15 = 0.',
  '{{x² + y² − 2x + 2y − 23 = 0}}.',
  'Check: centre (1, −1) is the midpoint; r = √(1 + 1 + 23) = 5 = half of √(36 + 64).'],
 {k:'plane',x:[-5,7],y:[-7,5],el:[{ci:[1,-1,5],c:1,w:3},{seg:[[-2,3],[4,-5]],c:2,w:2.5},{p:[-2,3],l:'(−2, 3)',c:2},{p:[4,-5],l:'(4, −5)',c:2},{p:[1,-1],l:'(1, −1)',c:3}]},
 ['Recognise diameter data','Use the diameter form','Expand','Check centre and radius'],
 'Some data fit a special form exactly. Spotting that saves finding the centre and radius separately.');

X('ci','Circle touching both axes',2,
 'Find the equations of the circles that touch both axes and pass through (2, 1).',
 '(x − 1)² + (y − 1)² = 1 and (x − 5)² + (y − 5)² = 25',
 ['If a circle touches both axes, how are its centre and radius related?',
  'In the first quadrant the centre is (a, a) and the radius is a.',
  '(2 − a)² + (1 − a)² = a² gives a quadratic in a.'],
 ['{{Touching both axes: centre (a, a), radius a}} (in the quadrant of the point).',
  'The quadratic gives {{two circles}}; keep both.'],
 ['(2, 1) is in quadrant 1, so the centre is (a, a) with radius a.',
  '(2 − a)² + (1 − a)² = a².',
  '4 − 4a + a² + 1 − 2a + a² = a², so {{a² − 6a + 5 = 0}}.',
  'a = 1 or a = 5.',
  'Circles: {{(x − 1)² + (y − 1)² = 1}} and {{(x − 5)² + (y − 5)² = 25}}.'],
 {k:'plane',x:[-0.5,10.5],y:[-0.5,10.5],el:[{ci:[1,1,1],c:1,w:3},{ci:[5,5,5],c:2,w:3},{p:[2,1],l:'(2, 1)',c:3}]},
 ['Translate "touches" into distances','Write the centre with one unknown','Use the point','Solve the quadratic'],
 'Touching means distance equals radius. Write every condition as a distance and the unknowns reduce to one.');

X('ci','Tangency condition',2,
 'Find c if the line y = 2x + c touches the circle x² + y² = 5.',
 'c = ±5',
 ['When does a line touch a circle?',
  'The perpendicular distance from the centre to the line equals the radius.',
  'Write the line as 2x − y + c = 0. Distance from (0, 0) is |c|/√5. Set it equal to √5.'],
 ['{{Tangent ⇔ distance from centre = radius.}}',
  'The modulus gives {{two values}} of c: one tangent on each side.'],
 ['Line: 2x − y + c = 0. Centre (0, 0), r = √5.',
  'Distance = |c|/√(4 + 1) = |c|/√5.',
  '|c|/√5 = √5, so |c| = 5 and {{c = ±5}}.'],
 {k:'plane',x:[-4.5,4.5],y:[-4.5,4.5],el:[{ci:[0,0,2.236],c:5,w:2},{ln:[2,-1,5],c:1,w:3,l:'c = 5'},{ln:[2,-1,-5],c:2,w:3,l:'c = −5'},{p:[0,0],c:3}]},
 ['Find centre and radius','Write the line in ax + by + c = 0','Set distance = radius','Keep both signs'],
 'Contact problems are distance problems. Compare one distance with the radius and the condition becomes a simple equation.');

X('ci','Centre on a given line',3,
 'Find the circle through (2, 3) and (4, 5) whose centre lies on y − 4x + 3 = 0.',
 'x² + y² − 4x − 10y + 25 = 0',
 ['Write the centre using one unknown, using the line.',
  'Centre (h, 4h − 3). It is the same distance from both points.',
  '(2 − h)² + (6 − 4h)² = (4 − h)² + (8 − 4h)². The h² terms cancel.'],
 ['{{Use the line to make the centre (h, 4h − 3)}}: one unknown.',
  'The centre is {{equidistant}} from both points.'],
 ['Centre (h, 4h − 3).',
  'Distance² to (2, 3): (2 − h)² + (6 − 4h)² = 17h² − 52h + 40.',
  'Distance² to (4, 5): (4 − h)² + (8 − 4h)² = 17h² − 72h + 80.',
  'Equal: 20h = 40, so {{h = 2}}. Centre (2, 5).',
  'r² = (2 − 2)² + (3 − 5)² = 4.',
  'Circle: (x − 2)² + (y − 5)² = 4, i.e. {{x² + y² − 4x − 10y + 25 = 0}}.'],
 {k:'plane',x:[-0.5,5.5],y:[1.5,8],el:[{ci:[2,5,2],c:1,w:3},{ln:[-4,1,3],c:5,dash:1,l:'y = 4x − 3'},{p:[2,3],l:'(2, 3)',c:2},{p:[4,5],l:'(4, 5)',c:2},{p:[2,5],l:'(2, 5)',c:3}]},
 ['Use the line to name the centre','Equate distances','Solve for h','Find r and write the circle'],
 'Use one condition to cut the number of unknowns before using the next. Each condition you apply early makes the algebra after it smaller.');

/* ===== Conic Sections ===== */
X('cs','Parabola: reading off its parts',1,
 'For the parabola y² = −12x, find the focus, directrix, axis and length of the latus rectum.',
 'Focus (−3, 0); directrix x = 3; axis y = 0; latus rectum 12',
 ['Which standard form does this match? Look at the sign.',
  'y² = −4ax with 4a = 12, so a = 3. The parabola opens to the left.',
  'For y² = −4ax: focus (−a, 0), directrix x = a.'],
 ['{{The sign gives the direction}}: y² = −4ax opens left.',
  'Latus rectum = {{4a}}; focus and directrix are a units either side of the vertex.'],
 ['Compare with y² = −4ax: 4a = 12, so {{a = 3}}.',
  'Focus: {{(−3, 0)}}.',
  'Directrix: {{x = 3}}.',
  'Axis: the x-axis, {{y = 0}}.',
  'Latus rectum: 4a = {{12}}.'],
 {k:'plane',x:[-7,4.5],y:[-7,7],el:[{pa:['-t*t/12','t'],t:[-8,8],c:1,w:3},{ln:[1,0,-3],c:2,dash:1,l:'x = 3'},{p:[-3,0],l:'focus (−3, 0)',c:2},{seg:[[-3,-6],[-3,6]],c:3},{tx:[-5.6,6.3],l:'LR = 12',c:3}]},
 ['Match the standard form','Find a','Use the sign for direction','Read off each part'],
 'Four standard parabolas cover every case here. Identify which one you have, find a, and every feature follows from a picture you can sketch in seconds.');

X('cs','Parabola from focus and directrix',3,
 'Find the equation of the parabola with focus (1, −1) and directrix x + y + 3 = 0.',
 'x² − 2xy + y² − 10x − 2y − 5 = 0',
 ['The directrix is slanted, so no standard form fits. What is the definition of a parabola?',
  'For any point P(x, y) on it, PS = PM: distance to the focus equals distance to the directrix.',
  '(x − 1)² + (y + 1)² = (x + y + 3)²/2. Multiply by 2 and expand.'],
 ['{{Slanted directrix: go back to the definition}} PS = PM.',
  'Distance to a line uses |ax + by + c|/√(a² + b²); squaring removes the modulus.'],
 ['P(x, y) on the parabola: PS² = PM².',
  '(x − 1)² + (y + 1)² = (x + y + 3)²/2.',
  '2(x² − 2x + 1 + y² + 2y + 1) = x² + y² + 9 + 2xy + 6x + 6y.',
  '2x² + 2y² − 4x + 4y + 4 = x² + y² + 2xy + 6x + 6y + 9.',
  '{{x² − 2xy + y² − 10x − 2y − 5 = 0}}.'],
 {k:'plane',x:[-5,5],y:[-5,4],el:[{pa:['0.25+0.75*t*t-1.5*t','-1.75+0.75*t*t+1.5*t'],t:[-2.4,2.4],c:1,w:3},{ln:[1,1,3],c:2,dash:1,l:'x + y + 3 = 0'},{p:[1,-1],l:'S(1, −1)',c:2},{p:[0.25,-1.75],l:'vertex',c:3}]},
 ['Notice no standard form fits','Use PS = PM','Square both sides','Expand and simplify'],
 'Standard forms are shortcuts derived from a definition. When the shortcut does not fit, go back to the definition; it always works.');

X('cs','Ellipse: reading off its parts',1,
 'For the ellipse 9x² + 25y² = 225, find a, b, the eccentricity, the foci and the length of the latus rectum.',
 'a = 5, b = 3, e = 4/5, foci (±4, 0), latus rectum 18/5',
 ['Get 1 on the right-hand side first.',
  'Divide by 225: x²/25 + y²/9 = 1. Which denominator is larger?',
  'a = 5, b = 3. Use b² = a²(1 − e²) or c² = a² − b².'],
 ['{{Divide to get 1 on the right}}; the larger denominator decides the major axis.',
  'For an ellipse {{c² = a² − b²}} (minus), e = c/a, latus rectum 2b²/a.'],
 ['Divide by 225: x²/25 + y²/9 = 1.',
  'a = 5, b = 3; the major axis is along the x-axis.',
  'c² = 25 − 9 = 16, so c = 4 and {{e = 4/5}}.',
  'Foci {{(±4, 0)}}.',
  'Latus rectum = 2b²/a = {{18/5}}.'],
 {k:'plane',x:[-6.5,6.5],y:[-4.2,4.2],el:[{pa:['5*Math.cos(t)','3*Math.sin(t)'],t:[0,6.3],c:1,w:3},{p:[4,0],l:'(4, 0)',c:2},{p:[-4,0],l:'(−4, 0)',c:2},{seg:[[4,-1.8],[4,1.8]],c:3},{tx:[4.3,2.4],l:'LR',c:3}]},
 ['Get 1 on the right','Identify a and b','Find c and e','Read off foci and latus rectum'],
 'The standard form is a lens. Once the equation is in it, a and b are visible, and every other feature is one formula away.');

X('cs','Ellipse from foci and a point',3,
 'Find the equation of the ellipse with foci (±3, 0) that passes through (4, 12/5).',
 'x²/25 + y²/16 = 1',
 ['What is true about the sum of distances from any point on an ellipse to the two foci?',
  'It equals 2a. Find the distances from (4, 12/5) to (3, 0) and (−3, 0).',
  'The distances are 13/5 and 37/5. Their sum is 10, so a = 5. Then b² = a² − c².'],
 ['{{Sum of focal distances = 2a.}} This avoids a messy quadratic.',
  'If you use substitution instead, {{reject the root that makes b² negative}}.'],
 ['c = 3.',
  'Distance to (3, 0): √(1 + 144/25) = √(169/25) = 13/5.',
  'Distance to (−3, 0): √(49 + 144/25) = √(1369/25) = 37/5.',
  'Sum = 50/5 = 10 = 2a, so {{a = 5}}.',
  'b² = 25 − 9 = 16. Ellipse: {{x²/25 + y²/16 = 1}}.'],
 {k:'plane',x:[-6.5,6.5],y:[-4.6,4.6],el:[{pa:['5*Math.cos(t)','4*Math.sin(t)'],t:[0,6.3],c:1,w:3},{seg:[[4,2.4],[3,0]],c:2},{seg:[[4,2.4],[-3,0]],c:3},
   {p:[3,0],l:'(3, 0)',c:2},{p:[-3,0],l:'(−3, 0)',c:3},{p:[4,2.4],l:'(4, 12/5)',c:1}]},
 ['Recall the focal-distance property','Measure both distances','Get a, then b','Write the equation'],
 'A defining property is often faster than substitution. Ask what the curve does by definition, and see whether the data plug straight into that.');

X('cs','Hyperbola with a vertical transverse axis',2,
 'For the hyperbola 9y² − 4x² = 36, find the vertices, foci, eccentricity and length of the latus rectum.',
 'Vertices (0, ±2); foci (0, ±√13); e = √13/2; latus rectum 9',
 ['Divide to get 1 on the right. Which term is positive?',
  'y²/4 − x²/9 = 1. The y-term is positive, so the transverse axis is the y-axis, with a = 2 and b = 3.',
  'For a hyperbola c² = a² + b².'],
 ['{{The positive term decides the transverse axis}}: here it is y.',
  'For a hyperbola {{c² = a² + b²}} (plus, unlike the ellipse).'],
 ['Divide by 36: {{y²/4 − x²/9 = 1}}.',
  'a = 2 (along y), b = 3.',
  'c² = 4 + 9 = 13, so c = √13 and {{e = √13/2}}.',
  'Vertices {{(0, ±2)}}; foci {{(0, ±√13)}}.',
  'Latus rectum = 2b²/a = 2(9)/2 = {{9}}.'],
 {k:'plane',x:[-6,6],y:[-6,6],el:[{pa:['3*Math.sinh(t)','2*Math.cosh(t)'],t:[-1.75,1.75],c:1,w:3},{pa:['3*Math.sinh(t)','-2*Math.cosh(t)'],t:[-1.75,1.75],c:1,w:3},
   {ln:[2,-3,0],c:5,dash:1},{ln:[2,3,0],c:5,dash:1},{p:[0,3.606],l:'(0, √13)',c:2},{p:[0,-3.606],l:'(0, −√13)',c:2},{p:[0,2],c:3},{p:[0,-2],c:3}]},
 ['Get 1 on the right','Find the positive term','Use c² = a² + b²','Read off each feature'],
 'Ellipse and hyperbola look alike on paper; one sign changes everything. Train your eye to check signs first, before any arithmetic.');

X('cs','Hyperbola from foci and an axis',2,
 'Find the equation of the hyperbola with foci (0, ±13) and conjugate axis of length 24.',
 'y²/25 − x²/144 = 1',
 ['Where are the foci? That tells you which term is positive.',
  'Foci on the y-axis with c = 13. Conjugate axis 2b = 24, so b = 12.',
  'a² = c² − b² = 169 − 144.'],
 ['{{Foci on the y-axis: the y² term is positive.}}',
  'Conjugate axis = {{2b}}; c² = a² + b².'],
 ['c = 13 and 2b = 24, so b = 12.',
  'a² = c² − b² = 169 − 144 = {{25}}.',
  'Foci on the y-axis: {{y²/25 − x²/144 = 1}}.'],
 {k:'plane',x:[-16,16],y:[-16,16],el:[{pa:['12*Math.sinh(t)','5*Math.cosh(t)'],t:[-1.4,1.4],c:1,w:3},{pa:['12*Math.sinh(t)','-5*Math.cosh(t)'],t:[-1.4,1.4],c:1,w:3},
   {p:[0,13],l:'(0, 13)',c:2},{p:[0,-13],l:'(0, −13)',c:2},{seg:[[-12,0],[12,0]],c:3},{tx:[5,-1.8],l:'2b = 24',c:3}]},
 ['Place the foci','Translate each length','Find the missing one','Write the equation'],
 'Every conic question gives you some of a, b, c, e and asks for the rest. One relation links them; collect what you have, and the gap fills itself.');

/* ===== 3D Geometry ===== */
X('td','Collinearity by distances',1,
 'Show that A(−2, 3, 5), B(1, 2, 3) and C(7, 0, −1) are collinear.',
 'AB + BC = AC (√14 + 2√14 = 3√14)',
 ['Three points on a line: how are the three distances related?',
  'Find AB, BC and AC. The longest should equal the sum of the other two.',
  'AB = √14, BC = √56 = 2√14, AC = √126 = 3√14.'],
 ['{{Collinear ⇔ the longest distance = sum of the other two.}}',
  'Simplify surds to a common root (√14) so the sum is easy to see.'],
 ['AB = √(9 + 1 + 4) = {{√14}}.',
  'BC = √(36 + 4 + 16) = √56 = {{2√14}}.',
  'AC = √(81 + 9 + 36) = √126 = {{3√14}}.',
  'AB + BC = 3√14 = AC, so A, B, C are collinear.'],
 {k:'3d',pts:[[-2,3,5,'A',1],[1,2,3,'B',2],[7,0,-1,'C',1]],segs:[[0,2,1]]},
 ['Find all three distances','Simplify the surds','Compare','State the conclusion'],
 'The same idea from 2D carries into 3D: distances alone can prove shape. Only the formula grows by one term.');

X('td','Division by a coordinate plane',2,
 'In what ratio does the yz-plane divide the segment joining A(2, 4, 5) and B(3, 5, −4)? Find the point.',
 'Externally in the ratio 2 : 3; the point is (0, 2, 23)',
 ['On the yz-plane, which coordinate is zero?',
  'Take the ratio k : 1 and set x = (3k + 2)/(k + 1) = 0.',
  'k = −2/3. A negative ratio means external division.'],
 ['{{On the yz-plane x = 0.}}',
  'A {{negative k means external division}}.'],
 ['Let the ratio be k : 1. x = (3k + 2)/(k + 1).',
  'Set x = 0: {{k = −2/3}}, so the division is external, 2 : 3.',
  'y = (5k + 4)/(k + 1) = (2/3)/(1/3) = 2.',
  'z = (−4k + 5)/(k + 1) = (23/3)/(1/3) = 23.',
  'Point: {{(0, 2, 23)}}.'],
 {k:'rows',r:[['ratio k : 1','x = (3k + 2)/(k + 1) = 0'],['k = −2/3','negative, so external 2 : 3'],['point','(0, 2, 23)']],hl:1},
 ['Name the ratio k : 1','Apply the plane condition','Read the sign of k','Find the point'],
 'Let the algebra tell you about the geometry. A negative ratio is not a mistake; it says the point lies outside the segment.');

X('td','Centroid of a triangle',1,
 'The centroid of triangle ABC is (1, 1, 1). If A is (3, −5, 7) and B is (−1, 7, −6), find C.',
 'C(1, 1, 2)',
 ['The centroid is the average of the vertices.',
  'Work one coordinate at a time: (3 − 1 + x)/3 = 1, and so on.',
  'Solve each coordinate separately.'],
 ['{{Centroid = average of the vertices}}, coordinate by coordinate.'],
 ['x: (3 − 1 + x)/3 = 1, so x = 1.',
  'y: (−5 + 7 + y)/3 = 1, so y = 1.',
  'z: (7 − 6 + z)/3 = 1, so z = 2.',
  'C = {{(1, 1, 2)}}.'],
 {k:'3d',pts:[[3,-5,7,'A',1],[-1,7,-6,'B',1],[1,1,2,'C',2],[1,1,1,'G',3]],segs:[[0,1,1],[1,2,1],[2,0,1]]},
 ['Recall the centroid rule','Split into coordinates','Solve each one','Write the point'],
 'Three-dimensional problems often split into three one-dimensional ones. Handle each coordinate alone.');

X('td','Locus in space',2,
 'Find the equation of the set of points P equidistant from A(1, 2, 3) and B(3, 2, −1).',
 'x − 2z = 0',
 ['Let P be (x, y, z). Write PA² = PB².',
  'Expand both sides. The x², y², z² terms cancel.',
  '−2x − 6z + 14 = −6x + 2z + 14 after expanding. Simplify.'],
 ['{{Name the point P(x, y, z)}} and translate the condition.',
  'In 3D, equidistant from two points gives a {{plane}}.'],
 ['(x − 1)² + (y − 2)² + (z − 3)² = (x − 3)² + (y − 2)² + (z + 1)².',
  'Expand: −2x + 1 − 6z + 9 = −6x + 9 + 2z + 1 (the squares and y-terms cancel).',
  '4x − 8z = 0, so {{x − 2z = 0}}.',
  'Check: the midpoint (2, 2, 1) satisfies it.'],
 {k:'3d',pts:[[1,2,3,'A',2],[3,2,-1,'B',2],[2,2,1,'M',3]],segs:[[0,1,5]]},
 ['Name the moving point','Translate the condition','Expand and cancel','Interpret the result'],
 'The locus method is the same in any dimension: name the point, write the rule, simplify. In space the same rule gives a plane instead of a line.');

/* ===== Probability ===== */
X('pr','Addition rule with overlap',1,
 'A card is drawn from a well-shuffled pack of 52. Find the probability that it is a king or a heart.',
 '4/13',
 ['How many kings? How many hearts? Is any card counted twice?',
  'P(king) = 4/52 and P(heart) = 13/52. The king of hearts is in both.',
  'P(A or B) = P(A) + P(B) − P(A and B).'],
 ['{{Subtract the overlap}}: the king of hearts would be counted twice.',
  'P(A ∪ B) = P(A) + P(B) − P(A ∩ B).'],
 ['P(king) = 4/52, P(heart) = 13/52.',
  'P(king and heart) = 1/52.',
  'P(king or heart) = 4/52 + 13/52 − 1/52 = 16/52 = {{4/13}}.'],
 {k:'venn',a:'Kings',b:'Hearts',A:3,AB:1,B:12,out:36},
 ['List each event','Check for overlap','Apply the addition rule','Simplify'],
 'Whenever events can happen together, the word "or" hides a double count. Draw the overlap before you add.');

X('pr','"At least one" by the complement',2,
 'A committee of 3 is chosen at random from 5 men and 4 women. Find the probability that it has at least one woman.',
 '37/42',
 ['"At least one" has several cases. Is the opposite event simpler?',
  'The opposite of "at least one woman" is "no women", that is, all men.',
  'Total ways 9C3 = 84. All men 5C3 = 10.'],
 ['{{"At least one" → 1 − P(none).}}',
  'Count selections with nCr: order does not matter in a committee.'],
 ['Total committees: 9C3 = {{84}}.',
  'Committees with no woman: 5C3 = {{10}}.',
  'P(no woman) = 10/84.',
  'P(at least one woman) = 1 − 10/84 = 74/84 = {{37/42}}.'],
 {k:'ratio',parts:[[10,'No woman: 10'],[74,'At least one woman: 74']]},
 ['Spot "at least"','Switch to the complement','Count with nCr','Subtract from 1'],
 'If the event you want has many cases, its opposite often has one. Count the easy side and subtract.');

X('pr','Sample space of two dice',1,
 'Two dice are thrown. Find the probability that the sum is at least 10.',
 '1/6',
 ['How many outcomes are there for two dice?',
  'There are 36. List the pairs with sum 10, 11 and 12.',
  'Sum 10: 3 pairs; sum 11: 2 pairs; sum 12: 1 pair.'],
 ['{{36 ordered outcomes}}: (4, 6) and (6, 4) are different.',
  'A 6 × 6 grid makes counting reliable.'],
 ['Sample space: 6 × 6 = 36.',
  'Sum 10: (4, 6), (5, 5), (6, 4).',
  'Sum 11: (5, 6), (6, 5). Sum 12: (6, 6).',
  'Favourable: 6. P = 6/36 = {{1/6}}.'],
 {k:'dice',f:'a+b>=10'},
 ['Build the sample space','Mark favourable outcomes','Count','Divide'],
 'When the sample space is small, draw it. A grid turns a counting puzzle into colouring cells.');

X('pr','Arrangement with letters kept together',2,
 'The letters of the word EQUATION are arranged at random. Find the probability that all the vowels are together.',
 '1/14',
 ['How many vowels and consonants are there? Are any letters repeated?',
  'Five vowels (E, U, A, I, O), three consonants (Q, T, N), all different. Glue the vowels into one block.',
  'Arrange 4 units (block + 3 consonants), then arrange inside the block.'],
 ['{{Glue the "together" letters into one block}}, then multiply by arrangements inside it.',
  'Total arrangements of 8 different letters: 8!.'],
 ['Total: 8! = 40320.',
  'Block of 5 vowels + Q, T, N = 4 units: 4! = 24 ways.',
  'Inside the block: 5! = 120 ways.',
  'Favourable: 24 × 120 = 2880.',
  'P = 2880/40320 = {{1/14}}.'],
 {k:'rows',r:[['[E U A I O]','Q   T   N'],['4 units','4! × 5!'],['total','8!']],hl:0},
 ['Count all arrangements','Glue the block','Arrange outside and inside','Divide'],
 'A restriction like "together" is easiest when you build it in directly. Make the restricted group a single object, solve the simpler problem, then unpack.');

X('pr','Complement and union from given values',1,
 'If P(A) = 0.42, P(B) = 0.48 and P(A and B) = 0.16, find P(not A), P(A or B) and P(neither A nor B).',
 '0.58, 0.74, 0.26',
 ['P(not A) is the complement of A.',
  'Use the addition rule for P(A or B).',
  '"Neither A nor B" is the complement of "A or B".'],
 ['{{Neither A nor B = not (A or B)}}, so it is 1 − P(A ∪ B).'],
 ['P(not A) = 1 − 0.42 = {{0.58}}.',
  'P(A or B) = 0.42 + 0.48 − 0.16 = {{0.74}}.',
  'P(neither) = 1 − 0.74 = {{0.26}}.'],
 {k:'venn',a:'A',b:'B',A:0.26,AB:0.16,B:0.32,out:0.26},
 ['Find each complement','Apply the addition rule','Translate "neither"','Subtract from 1'],
 'Probability words map to set operations: "not" is a complement, "or" is a union, "neither" is the complement of a union. Translate the words first.');

X('pr','Odds in favour',1,
 'The odds in favour of an event are 3 : 5. Find the probability that it happens and the probability that it does not.',
 'P(happens) = 3/8, P(does not) = 5/8',
 ['Odds compare favourable outcomes with unfavourable ones. How many outcomes in total?',
  '3 favourable and 5 unfavourable make 8.',
  'P(happens) = favourable/total.'],
 ['{{Odds a : b means a favourable, b unfavourable, total a + b.}}'],
 ['Total = 3 + 5 = 8.',
  'P(happens) = {{3/8}}.',
  'P(does not) = {{5/8}}.'],
 {k:'ratio',parts:[[3,'Favourable: 3'],[5,'Unfavourable: 5']]},
 ['Read the odds','Find the total','Divide','Check the two add to 1'],
 'Odds and probability carry the same information in different units. Convert to parts of a whole and the question is done.');

/* ===== Measures of Dispersion ===== */
X('md','Mean deviation about the mean',1,
 'Find the mean deviation about the mean for the data 6, 7, 10, 12, 13, 4, 8, 12.',
 '2.75',
 ['First find the mean.',
  'Mean = 72/8 = 9. Find |x − 9| for each value.',
  'The deviations are 3, 2, 1, 3, 4, 5, 1, 3. Average them.'],
 ['{{Take absolute deviations}}: without the modulus they add to zero.'],
 ['Sum = 72, n = 8, so the mean is {{9}}.',
  '|x − 9|: 3, 2, 1, 3, 4, 5, 1, 3.',
  'Sum of deviations = {{22}}.',
  'Mean deviation = 22/8 = {{2.75}}.'],
 {k:'dots',v:[6,7,10,12,13,4,8,12],m:9},
 ['Find the centre','Measure each distance from it','Add the distances','Average them'],
 'Dispersion asks how far, on average, the data sit from their centre. Every measure here is a version of that idea; they differ in how they measure distance.');

X('md','Mean deviation about the median (discrete)',2,
 'Find the mean deviation about the median: x = 2, 5, 8, 11, 14, 17, 20 with frequencies f = 2, 4, 6, 5, 5, 4, 4.',
 '4.5',
 ['Find N and the cumulative frequencies.',
  'N = 30. The median is the value where the cumulative frequency first reaches N/2 = 15.',
  'Median = 11. Find f·|x − 11| for each row.'],
 ['{{Median from cumulative frequency}}, not from the middle of the x list.',
  'Multiply each deviation by its frequency.'],
