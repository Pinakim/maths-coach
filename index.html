"8² = 64, but the rule is 2ⁿ.", "That is n(P(A)) itself."], "s": ["2ⁿ = 64 ⇒ n = 6."]}, {"id": "se5", "k": "k2", "l": 1, "q": "A = {1, 2, 3, 4}, B = {3, 4, 5}. A − B =", "o": ["{1, 2}", "{5}", "{3, 4}", "{1, 2, 5}"], "a": 0, "t": ["", "{5} is B − A.", "{3, 4} is A ∩ B.", "That is the symmetric difference."], "s": ["Remove from A everything in B: {1, 2}."], "f": {"k": "venn", "a": "A", "b": "B", "A": "1, 2", "AB": "3, 4", "B": "5", "out": "none"}}, {"id": "se6", "k": "k2", "l": 2, "q": "U = {1, 2, …, 10}, A = {2, 4, 6, 8, 10}. A′ =", "o": ["{2, 4, 6, 8, 10}", "{1, 2, …, 10}", "∅", "{1, 3, 5, 7, 9}"], "a": 3, "t": ["That is A itself.", "That is U.", "A′ is empty only when A = U.", ""], "s": ["A′ = U − A = the odd numbers."]}, {"id": "se7", "k": "k2", "l": 2, "q": "A ∩ (A ∪ B) equals", "o": ["B", "A ∪ B", "A ∩ B", "A"], "a": 3, "t": ["B need not be inside A.", "Intersecting with A can only keep parts of A.", "A ∩ B is smaller than A in general.", ""], "s": ["A ⊂ A ∪ B, so A ∩ (A ∪ B) = A (absorption law)."]}, {"id": "se8", "k": "k2", "l": 3, "q": "If A ⊂ B, then A ∪ B equals", "o": ["B", "U", "A", "∅"], "a": 0, "t": ["", "Nothing says B = U.", "Union adds B’s extra elements.", "Union is never empty unless both are."], "s": ["Every element of A is already in B, so A ∪ B = B."]}, {"id": "se9", "k": "k3", "l": 1, "q": "(A ∪ B)′ equals", "o": ["A ∩ B", "(A ∩ B)′", "A′ ∩ B′", "A′ ∪ B′"], "a": 2, "t": ["The complement flips ∪ to ∩ and complements each set.", "That equals A′ ∪ B′.", "", "That is (A ∩ B)′."], "s": ["De Morgan: (A ∪ B)′ = A′ ∩ B′."]}, {"id": "se10", "k": "k3", "l": 2, "q": "A ∩ (B ∪ C) equals", "o": ["A ∪ (B ∩ C)", "(A ∩ B) ∩ C", "(A ∪ B) ∩ (A ∪ C)", "(A ∩ B) ∪ (A ∩ C)"], "a": 3, "t": ["The operations are swapped.", "That is A ∩ B ∩ C, too small.", "That is A ∪ (B ∩ C).", ""], "s": ["Distributive law: ∩ distributes over ∪."]}, {"id": "se11", "k": "k3", "l": 2, "q": "A − B equals", "o": ["A′ ∩ B", "B − A", "A ∪ B′", "A ∩ B′"], "a": 3, "t": ["That is B − A.", "Difference is not symmetric.", "Union with B′ adds things outside both.", ""], "s": ["A − B = elements in A and not in B = A ∩ B′."]}, {"id": "se12", "k": "k3", "l": 3, "q": "A − (B ∪ C) equals", "o": ["(A − B) ∩ (A − C)", "(A ∩ B) − C", "(A − B) ∪ (A − C)", "(A − B) ∪ C"], "a": 0, "t": ["", "That keeps elements of B.", "That is A − (B ∩ C).", "That adds C."], "s": ["A ∩ (B ∪ C)′ = A ∩ B′ ∩ C′.", "= (A ∩ B′) ∩ (A ∩ C′) = (A − B) ∩ (A − C)."]}, {"id": "se13", "k": "k4", "l": 1, "q": "n(A) = 20, n(B) = 15, n(A ∩ B) = 5. n(A ∪ B) =", "o": ["30", "40", "35", "25"], "a": 0, "t": ["", "You added the overlap instead of subtracting.", "The overlap is counted twice.", "Recheck: 35 − 5."], "s": ["20 + 15 − 5 = 30."]}, {"id": "se14", "k": "k4", "l": 2, "q": "Of 50 students, 30 play cricket, 25 football and 10 both. How many play neither?", "o": ["15", "45", "0", "5"], "a": 3, "t": ["15 is \"football only\".", "45 play at least one game.", "Subtract the overlap first: 45 play at least one.", ""], "s": ["n(C ∪ F) = 30 + 25 − 10 = 45.", "Neither = 50 − 45 = 5."], "f": {"k": "venn", "a": "Cricket", "b": "Football", "A": 20, "AB": 10, "B": 15, "out": 5}}, {"id": "se15", "k": "k4", "l": 2, "q": "n(A ∪ B) = 40, n(A) = 25, n(B) = 22. n(A ∩ B) =", "o": ["15", "3", "7", "47"], "a": 2, "t": ["15 is n(A only).", "Recheck: 47 − 40.", "", "47 is n(A) + n(B)."], "s": ["n(A ∩ B) = 25 + 22 − 40 = 7."]}, {"id": "se16", "k": "k4", "l": 3, "q": "In a group of 70, 37 like coffee and 52 like tea; everyone likes at least one. How many like coffee only?", "o": ["33", "37", "19", "18"], "a": 3, "t": ["33 like tea only.", "37 includes those who like both.", "19 like both.", ""], "s": ["Both = 37 + 52 − 70 = 19.", "Coffee only = 37 − 19 = 18."]}]}, {"id": "rf", "n": "Relations and Functions", "k": [{"id": "k1", "n": "Ordered pairs and A × B", "s": "(a, b) = (c, d) ⇔ a = c and b = d. n(A × B) = n(A) × n(B)."}, {"id": "k2", "n": "Relations", "s": "A relation from A to B is any subset of A × B, so there are 2^(n(A)n(B)) of them. Domain = first entries, range = second entries."}, {"id": "k3", "n": "Functions", "s": "A function gives every element of the domain exactly one image."}, {"id": "k4", "n": "Domain and range", "s": "Domain: exclude zero denominators and negatives under square roots. Range: solve y = f(x) for x and ask when x is real."}, {"id": "k5", "n": "Special functions and algebra", "s": "|x| ≥ 0; [x] is the greatest integer ≤ x; signum gives −1, 0, 1. (f + g)(x) = f(x) + g(x)."}], "q": [{"id": "rf1", "k": "k1", "l": 1, "q": "If (x + 1, y − 2) = (3, 1), then", "o": ["x = 2, y = −1", "x = 4, y = −1", "x = 3, y = 1", "x = 2, y = 3"], "a": 3, "t": ["y − 2 = 1 gives y = 3.", "Sign slips: x + 1 = 3 and y − 2 = 1.", "Solve each equation, don’t copy the right side.", ""], "s": ["x + 1 = 3 ⇒ x = 2; y − 2 = 1 ⇒ y = 3."]}, {"id": "rf2", "k": "k1", "l": 1, "q": "If n(A) = 3 and n(B) = 4, then n(A × B) =", "o": ["64", "12", "7", "81"], "a": 1, "t": ["That is 4³.", "", "Multiply, don’t add.", "That is 3⁴."], "s": ["3 × 4 = 12."]}, {"id": "rf3", "k": "k1", "l": 2, "q": "A × B = {(a, 1), (a, 2), (b, 1), (b, 2)}. Then B =", "o": ["{(1, 2)}", "{1, 2, a, b}", "{1, 2}", "{a, b}"], "a": 2, "t": ["B is a set of numbers, not pairs.", "B holds only the second entries.", "", "{a, b} is A."], "s": ["B = set of second entries = {1, 2}."]}, {"id": "rf4", "k": "k1", "l": 3, "q": "If A = {1, 2}, then n(A × A × A) =", "o": ["8", "4", "9", "6"], "a": 0, "t": ["", "That is A × A.", "3² is the wrong way round.", "2 × 3 is not the rule."], "s": ["2 × 2 × 2 = 8."]}, {"id": "rf5", "k": "k2", "l": 1, "q": "The number of relations from a 2-element set to a 3-element set is", "o": ["9", "6", "64", "32"], "a": 2, "t": ["3² is not the rule.", "6 is n(A × B); relations are its subsets.", "", "2⁵ uses the wrong exponent."], "s": ["n(A × B) = 6, so 2⁶ = 64 relations."]}, {"id": "rf6", "k": "k2", "l": 2, "q": "R = {(x, x + 2) : x ∈ {1, 2, 3}}. The range of R is", "o": ["{1, 2, 3, 4, 5}", "{1, 2, 3}", "{2, 3, 4}", "{3, 4, 5}"], "a": 3, "t": ["Range has only second entries.", "That is the domain.", "Add 2, not 1.", ""], "s": ["R = {(1, 3), (2, 4), (3, 5)}; range {3, 4, 5}."]}, {"id": "rf7", "k": "k2", "l": 2, "q": "R = {(x, y) : y = 2x − 1, x ∈ {1, 2, 3}} is", "o": ["{(1, 1), (2, 3), (3, 5)}", "{(1, 1), (3, 2), (5, 3)}", "{(1, 2), (2, 4), (3, 6)}", "{(1, 1), (2, 3), (3, 4)}"], "a": 0, "t": ["", "The pairs are reversed.", "That is y = 2x.", "2(3) − 1 = 5, not 4."], "s": ["x = 1, 2, 3 give y = 1, 3, 5."]}, {"id": "rf8", "k": "k2", "l": 3, "q": "R = {(x, y) : x² + y² = 25, x, y ∈ W}. The domain of R is", "o": ["{3, 4, 5}", "{0, 5}", "{0, 3, 4, 5}", "{−5, −4, −3, 0, 3, 4, 5}"], "a": 2, "t": ["(0, 5) is in R, so 0 is in the domain.", "(3, 4) and (4, 3) are also in R.", "", "W has no negative numbers."], "s": ["Pairs: (0, 5), (3, 4), (4, 3), (5, 0).", "Domain {0, 3, 4, 5}."]}, {"id": "rf9", "k": "k3", "l": 1, "q": "Which is a function from {1, 2, 3} to {a, b}?", "o": ["{(1, a), (2, a), (3, a), (3, b)}", "{(1, a), (2, b)}", "{(1, a), (1, b), (2, a), (3, b)}", "{(1, a), (2, a), (3, b)}"], "a": 3, "t": ["3 has two images.", "3 has no image.", "1 has two images.", ""], "s": ["Each of 1, 2, 3 needs exactly one image; repeats in the codomain are fine."]}, {"id": "rf10", "k": "k3", "l": 2, "q": "f(x) = x² − 3x + 2. f(f(0)) =", "o": ["6", "0", "2", "−2"], "a": 1, "t": ["Recheck f(2) = 4 − 6 + 2.", "", "f(0) = 2 is only the first step.", "A square plus …; recheck the arithmetic."], "s": ["f(0) = 2.", "f(2) = 4 − 6 + 2 = 0."]}, {"id": "rf11", "k": "k3", "l": 2, "q": "f(x) = x + 1/x. f(x) − f(1/x) =", "o": ["0", "2/x", "2x", "1"], "a": 0, "t": ["", "The terms cancel completely.", "f(1/x) = 1/x + x, the same as f(x).", "The terms cancel completely."], "s": ["f(1/x) = 1/x + x = f(x).", "Difference 0."]}, {"id": "rf12", "k": "k3", "l": 3, "q": "f(x) = (x − 1)/(x + 1). f(f(x)) =", "o": ["−x", "x", "−1/x", "1/x"], "a": 2, "t": ["Check x = 2: f(f(2)) = −1/2.", "Apply f twice carefully.", "", "Check the sign."], "s": ["f(f) = [(x − 1)/(x + 1) − 1]/[(x − 1)/(x + 1) + 1].", "= (−2)/(2x) = −1/x."]}, {"id": "rf13", "k": "k4", "l": 1, "q": "The domain of f(x) = 1/(x − 3) is", "o": ["(3, ∞)", "ℝ − {0}", "ℝ", "ℝ − {3}"], "a": 3, "t": ["Values below 3 are allowed too.", "The zero denominator is at x = 3, not 0.", "x = 3 makes the denominator zero.", ""], "s": ["Exclude x = 3: ℝ − {3}."]}, {"id": "rf14", "k": "k4", "l": 2, "q": "The domain of f(x) = √(4 − x²) is", "o": ["(−2, 2)", "[0, 2]", "[−2, 2]", "ℝ"], "a": 2, "t": ["At x = ±2 the root is √0 = 0, allowed.", "Negative x work too.", "", "Large |x| makes 4 − x² negative."], "s": ["4 − x² ≥ 0 ⇒ −2 ≤ x ≤ 2."]}, {"id": "rf15", "k": "k4", "l": 2, "q": "The range of f(x) = x² + 2 is", "o": ["[0, ∞)", "ℝ", "(2, ∞)", "[2, ∞)"], "a": 3, "t": ["The +2 shifts the range up.", "x² ≥ 0, so values below 2 never occur.", "2 is reached at x = 0.", ""], "s": ["x² ≥ 0 ⇒ x² + 2 ≥ 2, with 2 at x = 0."]}, {"id": "rf16", "k": "k4", "l": 3, "q": "The range of f(x) = x/(1 + x²) is", "o": ["ℝ", "[−1/2, 1/2]", "(−1/2, 1/2)", "[−1, 1]"], "a": 1, "t": ["The denominator grows faster.", "", "±1/2 are reached at x = ±1.", "Check: |x/(1 + x²)| ≤ 1/2."], "s": ["y = x/(1 + x²) ⇒ yx² − x + y = 0.", "x real ⇒ 1 − 4y² ≥ 0 ⇒ −1/2 ≤ y ≤ 1/2."]}, {"id": "rf17", "k": "k5", "l": 1, "q": "The range of f(x) = |x| is", "o": ["(0, ∞)", "[0, ∞)", "ℝ", "{0, 1}"], "a": 1, "t": ["|0| = 0 is included.", "", "A modulus is never negative.", "It takes every non-negative value."], "s": ["|x| ≥ 0 and takes every such value."]}, {"id": "rf18", "k": "k5", "l": 2, "q": "[−2.3] (greatest integer function) equals", "o": ["−3", "−2.3", "−2", "2"], "a": 0, "t": ["", "[x] is an integer.", "−2 is greater than −2.3; we need the integer ≤ −2.3.", "The sign stays negative."], "s": ["The greatest integer ≤ −2.3 is −3."], "f": {"k": "nline", "r": [-4, 0], "pts": [[-3, "−3", 2], [-2.3, "−2.3", 1], [-2, "−2", 5]]}}, {"id": "rf19", "k": "k5", "l": 2, "q": "f(x) = x² and g(x) = 2x + 1. (f + g)(2) =", "o": ["25", "7", "20", "9"], "a": 3, "t": ["25 is f(g(2)).", "Recheck: 4 + 5.", "20 is (fg)(2).", ""], "s": ["f(2) + g(2) = 4 + 5 = 9."]}, {"id": "rf20", "k": "k5", "l": 3, "q": "The range of the signum function is", "o": ["{0, 1}", "{−1, 1}", "[−1, 1]", "{−1, 0, 1}"], "a": 3, "t": ["sgn of a negative number is −1.", "sgn 0 = 0.", "It takes only three values.", ""], "s": ["sgn x = −1 (x < 0), 0 (x = 0), 1 (x > 0)."]}]}, {"id": "li", "n": "Linear Inequalities", "k": [{"id": "k1", "n": "Rules for solving", "s": "Add, subtract freely. Multiplying or dividing by a negative number reverses the inequality sign."}, {"id": "k2", "n": "Modulus inequalities", "s": "|x − a| < b ⇔ a − b < x < a + b. |x − a| > b ⇔ x < a − b or x > a + b."}, {"id": "k3", "n": "Rational inequalities", "s": "Bring everything to one side as a single fraction, mark the critical points, and test the sign in each interval. Never multiply by an unknown sign."}, {"id": "k4", "n": "Systems and word problems", "s": "Solve each inequality, then take the common part. Translate \"at least\" as ≥ and \"at most\" as ≤."}], "q": [{"id": "li1", "k": "k1", "l": 1, "q": "The solution of −3x > 12 is", "o": ["x < 4", "x > 4", "x < −4", "x > −4"], "a": 2, "t": ["The value is −4, and the sign reverses.", "Both the sign and the value are off.", "", "Dividing by −3 reverses the sign."], "s": ["Divide by −3 and reverse: x < −4."]}, {"id": "li2", "k": "k1", "l": 1, "q": "The solution of 3x − 7 > 5x − 1 is", "o": ["x < −3", "x > −3", "x < 3", "x > 3"], "a": 0, "t": ["", "−6 > 2x gives x < −3.", "Recheck the constants: −7 + 1 = −6.", "Both the sign and the value are off."], "s": ["−7 + 1 > 5x − 3x ⇒ −6 > 2x ⇒ x < −3."]}, {"id": "li3", "k": "k1", "l": 2, "q": "The solution of (x − 2)/3 ≥ (x + 1)/4 − 1 is", "o": ["x ≥ −1", "x ≥ 1", "x ≥ 11", "x ≤ −1"], "a": 0, "t": ["", "Recheck: −8 ≥ −9 + … gives x ≥ −1.", "You forgot to multiply the −1 by 12.", "Multiplying by 12 (positive) keeps the sign."], "s": ["× 12: 4(x − 2) ≥ 3(x + 1) − 12.", "4x − 8 ≥ 3x − 9 ⇒ x ≥ −1."]}, {"id": "li4", "k": "k1", "l": 3, "q": "The solution of −5 ≤ (5 − 3x)/2 ≤ 8 is", "o": ["−15 ≤ x ≤ 11", "−5 ≤ x ≤ 11/3", "x ≤ −11/3 or x ≥ 5", "−11/3 ≤ x ≤ 5"], "a": 3, "t": ["Divide by −3 after subtracting 5.", "Dividing by −3 reverses both signs; the ends swap.", "It is one connected interval.", ""], "s": ["× 2: −10 ≤ 5 − 3x ≤ 16.", "−15 ≤ −3x ≤ 11.", "÷ (−3), reversing: −11/3 ≤ x ≤ 5."]}, {"id": "li5", "k": "k2", "l": 1, "q": "|x| < 3 means", "o": ["x < −3 or x > 3", "−3 < x < 3", "x > −3", "x < 3"], "a": 1, "t": ["That is |x| > 3.", "", "x = 5 fails.", "x = −5 has |x| = 5, not < 3."], "s": ["Distance from 0 less than 3: −3 < x < 3."], "f": {"k": "nline", "r": [-5, 5], "pts": [[-3, "−3", 2], [3, "3", 2], [0, "0", 1]]}}, {"id": "li6", "k": "k2", "l": 2, "q": "|x − 2| ≤ 5 means", "o": ["−5 ≤ x ≤ 5", "−7 ≤ x ≤ 3", "x ≤ 7", "−3 ≤ x ≤ 7"], "a": 3, "t": ["Forgot the shift by 2.", "The centre is +2, not −2.", "The left end is 2 − 5 = −3.", ""], "s": ["−5 ≤ x − 2 ≤ 5 ⇒ −3 ≤ x ≤ 7."]}, {"id": "li7", "k": "k2", "l": 2, "q": "|2x − 1| > 3 means", "o": ["−1 < x < 2", "x < −1 or x > 2", "x > 2", "x < −2 or x > 1"], "a": 1, "t": ["\"> \" splits into two parts.", "", "The negative side x < −1 also works.", "Solve 2x − 1 > 3 and 2x − 1 < −3."], "s": ["2x − 1 > 3 ⇒ x > 2; 2x − 1 < −3 ⇒ x < −1."]}, {"id": "li8", "k": "k2", "l": 3, "q": "3|m − 6| − 4 < 11 gives", "o": ["1 < m < 5", "1 < m < 11", "−1 < m < 11", "m < 1 or m > 11"], "a": 1, "t": ["|m − 6| < 5, centred at 6.", "", "6 − 5 = 1, not −1.", "\"<\" gives one interval."], "s": ["3|m − 6| < 15 ⇒ |m − 6| < 5.", "1 < m < 11."]}, {"id": "li9", "k": "k3", "l": 2, "q": "(x − 1)/(x + 2) > 0 holds when", "o": ["x > 1", "x ≤ −2 or x ≥ 1", "x < −2 or x > 1", "−2 < x < 1"], "a": 2, "t": ["x < −2 also makes both factors negative.", "x = −2 is undefined and x = 1 gives 0.", "", "That is where the fraction is negative."], "s": ["Critical points −2 and 1.", "Positive outside them: x < −2 or x > 1."]}, {"id": "li10", "k": "k3", "l": 2, "q": "(x + 3)/(x − 2) ≤ 0 holds when", "o": ["−3 ≤ x < 2", "−3 < x < 2", "−3 ≤ x ≤ 2", "x ≤ −3 or x > 2"], "a": 0, "t": ["", "x = −3 gives 0, which satisfies ≤ 0.", "x = 2 makes the denominator zero.", "That is where it is ≥ 0."], "s": ["Critical points −3 and 2.", "Negative between them; include −3, exclude 2."]}, {"id": "li11", "k": "k3", "l": 3, "q": "(x − 2)/(x + 5) > 2 holds when", "o": ["−12 < x < −5", "−5 < x < 12", "x > −12", "x < −12"], "a": 0, "t": ["", "Bring everything to one side first.", "Never multiply by x + 5 without knowing its sign.", "x < −12 gives a value below 2."], "s": ["(x − 2)/(x + 5) − 2 > 0 ⇒ (−x − 12)/(x + 5) > 0.", "⇒ (x + 12)/(x + 5) < 0 ⇒ −12 < x < −5."]}, {"id": "li12", "k": "k3", "l": 1, "q": "1/x > 0 holds when", "o": ["x ≠ 0", "x > 0", "x < 0", "for all real x"], "a": 1, "t": ["Negative x gives negative 1/x.", "", "That makes 1/x negative.", "x = 0 is undefined, and negatives fail."], "s": ["1/x has the sign of x: x > 0."]}, {"id": "li13", "k": "k4", "l": 1, "q": "Marks 70 and 75 in two tests. For an average of at least 60 over three tests, the third mark must be", "o": ["at least 35", "at most 35", "at least 60", "at least 45"], "a": 0, "t": ["", "\"At least\" means ≥.", "The total needed is 180.", "Recheck: 180 − 145."], "s": ["(70 + 75 + x)/3 ≥ 60 ⇒ x ≥ 35."]}, {"id": "li14", "k": "k4", "l": 2, "q": "x + 2 ≥ 0 and 3x − 6 < 0 together give", "o": ["−2 < x ≤ 2", "x ≥ −2", "x < 2", "−2 ≤ x < 2"], "a": 3, "t": ["Check which end is strict.", "Take the common part of both.", "Take the common part of both.", ""], "s": ["x ≥ −2 and x < 2 ⇒ −2 ≤ x < 2."]}, {"id": "li15", "k": "k4", "l": 2, "q": "How many pairs of consecutive odd natural numbers, both greater than 10, have a sum less than 40?", "o": ["5", "3", "9", "4"], "a": 3, "t": ["(19, 21) sums to 40, not less.", "Count (17, 19) too: sum 36.", "Count pairs, not numbers.", ""], "s": ["x > 10 and 2x + 2 < 40 ⇒ 11 ≤ x ≤ 17, x odd.", "Pairs (11, 13), (13, 15), (15, 17), (17, 19)."]}, {"id": "li16", "k": "k4", "l": 3, "q": "A triangle’s longest side is 3 times its shortest, and the third side is 2 cm shorter than the longest. If the perimeter is at least 61 cm, the shortest side is at least", "o": ["9 cm", "61/7 cm", "7 cm", "8 cm"], "a": 0, "t": ["", "You forgot the −2.", "7 gives 47.", "8 gives a perimeter of 54."], "s": ["Sides x, 3x, 3x − 2.", "7x − 2 ≥ 61 ⇒ x ≥ 9."]}]}, {"id": "bt", "n": "Binomial Theorem", "k": [{"id": "k1", "n": "Expansion and number of terms", "s": "(a + b)ⁿ has n + 1 terms with powers of a falling and b rising. In (a + b)ⁿ ± (a − b)ⁿ, half the terms cancel."}, {"id": "k2", "n": "General term", "s": "T_{r+1} = ⁿC_r aⁿ⁻ʳ bʳ. Keep the sign and the number inside b, then match the power you want."}, {"id": "k3", "n": "Middle and independent terms", "s": "n even: one middle term T_{n/2 + 1}; n odd: two. Term independent of x: set the power of x to 0."}, {"id": "k4", "n": "Binomial coefficients", "s": "ⁿC_r = ⁿC_{n−r}. Sum of all coefficients = value at x = 1 (2ⁿ for (1 + x)ⁿ)."}, {"id": "k5", "n": "Applications", "s": "Write a number as (1 + small)ⁿ or (k ± 1)ⁿ to approximate, compare, or find remainders."}], "q": [{"id": "bt1", "k": "k1", "l": 1, "q": "The number of terms in (2x + 3y)⁸ is", "o": ["10", "9", "8", "16"], "a": 1, "t": ["Only 8 + 1.", "", "n + 1 terms, not n.", "The coefficients don’t change the count."], "s": ["n + 1 = 9."]}, {"id": "bt2", "k": "k1", "l": 2, "q": "(x + 2)³ expands to", "o": ["x³ + 6x² + 6x + 8", "x³ + 3x² + 3x + 8", "x³ + 6x² + 12x + 8", "x³ + 8"], "a": 2, "t": ["Middle term 3 · x · 2² = 12x.", "The 2 must be raised to powers too.", "", "(a + b)³ ≠ a³ + b³."], "s": ["x³ + 3(x²)(2) + 3(x)(4) + 8."]}, {"id": "bt3", "k": "k1", "l": 2, "q": "(√2 + 1)⁴ + (√2 − 1)⁴ equals", "o": ["2", "34", "24", "17"], "a": 1, "t": ["The sum doesn’t collapse to 2.", "", "Recheck: 2(4 + 12 + 1).", "Odd terms cancel and even terms double."], "s": ["= 2[(√2)⁴ + 6(√2)² + 1] = 2(4 + 12 + 1) = 34."]}, {"id": "bt4", "k": "k1", "l": 3, "q": "After simplifying, (x + a)¹⁰⁰ + (x − a)¹⁰⁰ has how many terms?", "o": ["202", "101", "51", "50"], "a": 2, "t": ["That counts both expansions.", "Odd powers of a cancel.", "", "Even r from 0 to 100 gives 51 values."], "s": ["Only even r survive: r = 0, 2, …, 100 → 51 terms."]}, {"id": "bt5", "k": "k2", "l": 1, "q": "The general term of (a + b)ⁿ is", "o": ["ⁿC_r aʳ bʳ", "ⁿC_r aⁿ⁻ʳ bʳ", "ⁿC_{r+1} aⁿ⁻ʳ bʳ", "ⁿP_r aⁿ⁻ʳ bʳ"], "a": 1, "t": ["The powers must add to n.", "", "The coefficient of T_{r+1} is ⁿC_r.", "Coefficients use C, not P."], "s": ["T_{r+1} = ⁿC_r aⁿ⁻ʳ bʳ."]}, {"id": "bt6", "k": "k2", "l": 2, "q": "The 4th term of (2x − 1)⁶ is", "o": ["−240x⁴", "160x³", "20x³", "−160x³"], "a": 3, "t": ["That is T₃.", "(−1)³ is negative.", "Forgot the 2³ = 8.", ""], "s": ["T₄: r = 3: ⁶C₃(2x)³(−1)³ = 20 × 8 × (−1)x³."]}, {"id": "bt7", "k": "k2", "l": 2, "q": "The coefficient of x⁵ in (x + 3)⁸ is", "o": ["168", "1512", "13608", "6048"], "a": 1, "t": ["Forgot the ⁸C₃ = 56; 168 = ⁸C₃ × 3.", "", "The power of 3 is 3, not 5.", "Recheck 56 × 27."], "s": ["x⁵ needs r = 3: ⁸C₃ × 3³ = 56 × 27 = 1512."]}, {"id": "bt8", "k": "k2", "l": 3, "q": "The coefficient of x⁷ in (ax² + 1/(bx))¹¹ is", "o": ["462a⁶/b⁵", "330a⁶/b⁵", "462a⁵/b⁶", "462a⁶b⁵"], "a": 0, "t": ["", "¹¹C₅ = 462, not 330.", "Powers of a and b are swapped.", "b sits in the denominator."], "s": ["Power of x: 2(11 − r) − r = 7 ⇒ r = 5.", "¹¹C₅ a⁶ b⁻⁵ = 462a⁶/b⁵."]}, {"id": "bt9", "k": "k3", "l": 1, "q": "The middle term of (1 + x)¹⁰ is", "o": ["120x⁵", "252x⁶", "210x⁴", "252x⁵"], "a": 3, "t": ["¹⁰C₅ = 252.", "Power of x in T₆ is 5.", "That is T₅.", ""], "s": ["11 terms, middle T₆ = ¹⁰C₅ x⁵."]}, {"id": "bt10", "k": "k3", "l": 2, "q": "The term independent of x in (x + 1/x)⁶ is", "o": ["15", "1", "20", "6"], "a": 2, "t": ["15 is ⁶C₂ or ⁶C₄.", "1 is ⁶C₀.", "", "6 is ⁶C₁."], "s": ["Power 6 − 2r = 0 ⇒ r = 3: ⁶C₃ = 20."]}, {"id": "bt11", "k": "k3", "l": 2, "q": "The term independent of x in (x² − 1/x)⁹ is", "o": ["126", "36", "−84", "84"], "a": 3, "t": ["126 is ⁹C₄.", "36 is ⁹C₂.", "r = 6 is even, so the sign is +.", ""], "s": ["Power 18 − 3r = 0 ⇒ r = 6: ⁹C₆ = 84."]}, {"id": "bt12", "k": "k3", "l": 3, "q": "The middle term(s) of (x + 1)⁷ are", "o": ["35x⁴ and 35x³", "21x⁵ and 35x⁴", "35x⁴ only", "35x³ only"], "a": 0, "t": ["", "21x⁵ is T₃.", "8 terms means two middle terms.", "8 terms means two middle terms."], "s": ["T₄ = ⁷C₃ x⁴ = 35x⁴; T₅ = ⁷C₄ x³ = 35x³."]}, {"id": "bt13", "k": "k4", "l": 1, "q": "The sum of the coefficients in (1 + x)⁸ is", "o": ["8", "256", "128", "64"], "a": 1, "t": ["8 is the power.", "", "Put x = 1: 2⁸.", "That is 2⁶."], "s": ["(1 + 1)⁸ = 256."]}, {"id": "bt14", "k": "k4", "l": 2, "q": "If ⁿC₇ = ⁿC₅, then n =", "o": ["35", "6", "12", "2"], "a": 2, "t": ["Not a product.", "Recheck: r + s = n.", "", "Equal coefficients mean 7 + 5 = n."], "s": ["ⁿC_r = ⁿC_s with r ≠ s ⇒ n = r + s = 12."]}, {"id": "bt15", "k": "k4", "l": 2, "q": "The sum of the coefficients of (2x − 1)⁷ is", "o": ["1", "−1", "128", "0"], "a": 0, "t": ["", "Put x = 1: (2 − 1)⁷.", "2⁷ ignores the −1.", "The sum isn’t zero here."], "s": ["(2 − 1)⁷ = 1."]}, {"id": "bt16", "k": "k4", "l": 3, "q": "The coefficients of the 2nd, 3rd and 4th terms of (1 + x)ⁿ are in AP. Then n =", "o": ["14", "2", "9", "7"], "a": 3, "t": ["Solve n² − 9n + 14 = 0.", "n = 2 has no 4th term.", "Recheck the quadratic.", ""], "s": ["2 ⁿC₂ = ⁿC₁ + ⁿC₃ ⇒ n² − 9n + 14 = 0.", "n = 7 (n = 2 is invalid)."]}, {"id": "bt17", "k": "k5", "l": 1, "q": "(1.01)⁵ to 3 decimal places is", "o": ["1.005", "1.051", "1.050", "1.510"], "a": 1, "t": ["Used n × 0.001.", "", "Include the second term 10(0.01)².", "Decimal place slip."], "s": ["1 + 5(0.01) + 10(0.0001) + … = 1.0510…"]}, {"id": "bt18", "k": "k5", "l": 2, "q": "Which is larger: (1.01)¹⁰⁰⁰⁰⁰⁰ or 10000?", "o": ["10000", "They are equal", "Cannot tell", "(1.01)¹⁰⁰⁰⁰⁰⁰"], "a": 3, "t": ["The first two terms alone exceed 10000.", "They are not equal.", "The expansion decides it.", ""], "s": ["(1 + 0.01)¹⁰⁰⁰⁰⁰⁰ > 1 + 1000000 × 0.01 = 10001."]}, {"id": "bt19", "k": "k5", "l": 2, "q": "The remainder when 9⁹⁹ is divided by 8 is", "o": ["8", "1", "7", "0"], "a": 1, "t": ["A remainder is less than 8.", "", "7 would come from (8 − 1).", "(8 + 1)⁹⁹ leaves 1."], "s": ["9⁹⁹ = (8 + 1)⁹⁹ = 8k + 1."]}, {"id": "bt20", "k": "k5", "l": 3, "q": "For every natural n, 6ⁿ − 5n leaves remainder ___ on division by 25.", "o": ["0", "5", "1", "6"], "a": 2, "t": ["The constant term of (1 + 5)ⁿ is 1.", "5n cancels exactly.", "", "6 is the base."], "s": ["6ⁿ = (1 + 5)ⁿ = 1 + 5n + 25(…).", "6ⁿ − 5n = 1 + 25k."]}]}, {"id": "td", "n": "3D Geometry", "k": [{"id": "k1", "n": "Coordinates, octants, planes", "s": "On the xy-plane z = 0, yz-plane x = 0, zx-plane y = 0. Signs of (x, y, z) decide the octant."}, {"id": "k2", "n": "Distance formula", "s": "PQ = √((x₂ − x₁)² + (y₂ − y₁)² + (z₂ − z₁)²). Distance from the x-axis is √(y² + z²)."}, {"id": "k3", "n": "Section formula and centroid", "s": "m : n internally: ((mx₂ + nx₁)/(m + n), …). A negative ratio means external division. Centroid = average of vertices."}, {"id": "k4", "n": "Collinearity and locus", "s": "Collinear ⇔ the longest distance equals the sum of the other two. For a locus, use P(x, y, z) and simplify."}], "q": [{"id": "td1", "k": "k1", "l": 1, "q": "The point (−3, 1, 2) lies in octant", "o": ["I", "III", "VI", "II"], "a": 3, "t": ["x is negative.", "III needs y < 0.", "VI needs z < 0.", ""], "s": ["Signs (−, +, +): octant II."]}, {"id": "td2", "k": "k1", "l": 1, "q": "Every point on the yz-plane has", "o": ["x = y", "y = 0", "z = 0", "x = 0"], "a": 3, "t": ["That is a slanted plane.", "y = 0 is the zx-plane.", "z = 0 is the xy-plane.", ""], "s": ["The yz-plane is where x = 0."]}, {"id": "td3", "k": "k1", "l": 2, "q": "The foot of the perpendicular from (2, −3, 4) to the zx-plane is", "o": ["(2, 0, 4)", "(0, −3, 4)", "(2, −3, 0)", "(0, −3, 0)"], "a": 0, "t": ["", "That is on the yz-plane.", "That is on the xy-plane.", "That is on the y-axis."], "s": ["zx-plane: y = 0. Keep x and z: (2, 0, 4)."]}, {"id": "td4", "k": "k1", "l": 3, "q": "The image of (−4, 0, 1) in the zx-plane is", "o": ["(4, 0, −1)", "(−4, 0, 1)", "(4, 0, 1)", "(−4, 0, −1)"], "a": 1, "t": ["Reflection in the zx-plane changes only y.", "", "Only y changes sign.", "Only y changes sign."], "s": ["Reflecting in y = 0 flips y, and y = 0 already.", "The point lies on the plane, so it is its own image."]}, {"id": "td5", "k": "k2", "l": 1, "q": "The distance between (1, 2, 3) and (4, 6, 3) is", "o": ["25", "7", "√41", "5"], "a": 3, "t": ["That is the distance squared.", "Square and add, don’t add 3 + 4.", "z-difference is 0.", ""], "s": ["√(9 + 16 + 0) = 5."]}, {"id": "td6", "k": "k2", "l": 2, "q": "The distance of (3, 4, 12) from the origin is", "o": ["13", "169", "5", "19"], "a": 0, "t": ["", "That is the distance squared.", "You dropped z.", "Square, add, then root."], "s": ["√(9 + 16 + 144) = 13."]}, {"id": "td7", "k": "k2", "l": 2, "q": "The distance of (4, −3, 5) from the y-axis is", "o": ["√34", "√41", "5√2", "3"], "a": 1, "t": ["√34 is from the x-axis.", "", "5√2 is the distance from the origin.", "3 is |y|, along the axis."], "s": ["From the y-axis: √(x² + z²) = √(16 + 25) = √41."]}, {"id": "td8", "k": "k2", "l": 3, "q": "The point on the y-axis equidistant from (3, 1, 2) and (5, 5, 2) is", "o": ["(0, 4, 0)", "(0, 3, 0)", "(5, 0, 0)", "(0, 5, 0)"], "a": 3, "t": ["Check: distances √22 and √30.", "Check: distances √21 and √29 differ.", "That is on the x-axis.", ""], "s": ["(0, y, 0): 9 + (y − 1)² + 4 = 25 + (y − 5)² + 4.", "8y = 40 ⇒ y = 5."]}, {"id": "td9", "k": "k3", "l": 1, "q": "The midpoint of (2, −1, 4) and (4, 3, −2) is", "o": ["(3, 1, 1)", "(1, 2, −3)", "(6, 2, 2)", "(3, 2, 1)"], "a": 0, "t": ["", "That is half the difference.", "Divide the sums by 2.", "Recheck y: (−1 + 3)/2 = 1."], "s": ["Average each coordinate: (3, 1, 1)."]}, {"id": "td10", "k": "k3", "l": 2, "q": "The point dividing (1, −2, 3) and (3, 4, −5) internally in the ratio 2 : 3 is", "o": ["(2, 1, −1)", "(9/5, 2/5, −1/5)", "(9/5, −2/5, 1/5)", "(11/5, 8/5, −9/5)"], "a": 1, "t": ["That is the midpoint.", "", "Sign slips in y and z.", "That is the ratio 3 : 2."], "s": ["((2 × 3 + 3 × 1)/5, (2 × 4 + 3 × (−2))/5, (2 × (−5) + 3 × 3)/5)."]}, {"id": "td11", "k": "k3", "l": 2, "q": "The centroid of (2, 3, −1), (4, −1, 5) and (−3, 4, 2) is", "o": ["(3/2, 3, 3)", "(1, 2, 3)", "(1, 2, 2)", "(3, 6, 6)"], "a": 2, "t": ["Divide by 3, not 2.", "Recheck z: (−1 + 5 + 2)/3 = 2.", "", "Divide the sums by 3."], "s": ["((2 + 4 − 3)/3, (3 − 1 + 4)/3, (−1 + 5 + 2)/3) = (1, 2, 2)."]}, {"id": "td12", "k": "k3", "l": 3, "q": "The yz-plane divides the join of (2, 4, 5) and (3, 5, −4) in the ratio", "o": ["2 : 3 internally", "3 : 2 internally", "2 : 3 externally", "3 : 2 externally"], "a": 2, "t": ["k came out negative, so the division is external.", "The division is external, and the order is 2 : 3.", "", "The order of the ratio is 2 : 3."], "s": ["k : 1 with x = (3k + 2)/(k + 1) = 0 ⇒ k = −2/3.", "Negative: externally 2 : 3."]}, {"id": "td13", "k": "k4", "l": 2, "q": "Are (−2, 3, 5), (1, 2, 3) and (7, 0, −1) collinear?", "o": ["Yes", "No, they form a right triangle", "Cannot be decided", "No, they form a scalene triangle"], "a": 0, "t": ["", "AB + BC = AC exactly.", "The distances decide it.", "AB + BC = AC exactly."], "s": ["AB = √14, BC = 2√14, AC = 3√14.", "AB + BC = AC ⇒ collinear."]}, {"id": "td14", "k": "k4", "l": 2, "q": "A(0, 7, −10), B(1, 6, −6), C(4, 9, −6) form a triangle that is", "o": ["scalene", "isosceles but not right-angled", "equilateral", "isosceles and right-angled"], "a": 3, "t": ["AB = BC.", "AB² + BC² = AC².", "AC is longer than AB and BC.", ""], "s": ["AB² = 18, BC² = 18, AC² = 36.", "AB = BC and AB² + BC² = AC²."]}, {"id": "td15", "k": "k4", "l": 3, "q": "The locus of points equidistant from A(1, 2, 3) and B(3, 2, −1) is", "o": ["2x − z = 0", "x − 2z = 0", "x + 2z = 0", "x − 2z = 4"], "a": 1, "t": ["Coefficients swapped.", "", "Sign slip in the z terms.", "The constants cancel to 0."], "s": ["PA² = PB² ⇒ −2x − 6z + 14 = −6x + 2z + 14.", "4x − 8z = 0 ⇒ x − 2z = 0."]}, {"id": "td16", "k": "k4", "l": 1, "q": "The locus z = 0 is", "o": ["the yz-plane", "the z-axis", "the xy-plane", "a single point"], "a": 2, "t": ["The yz-plane has x = 0.", "The z-axis has x = y = 0.", "", "Only one coordinate is fixed."], "s": ["z = 0 with x, y free: the xy-plane."]}]}, {"id": "ld", "n": "Limits and Derivatives", "k": [{"id": "k1", "n": "Algebraic limits", "s": "If substitution gives 0/0, factorise, rationalise, or use lim (xⁿ − aⁿ)/(x − a) = naⁿ⁻¹. At infinity, divide by the highest power."}, {"id": "k2", "n": "Trigonometric limits", "s": "lim sin x/x = lim tan x/x = 1 (x in radians). Make the angle and the denominator match: sin 5x/(5x)."}, {"id": "k3", "n": "Exponential and log limits", "s": "lim (eˣ − 1)/x = 1, lim (aˣ − 1)/x = log a, lim log(1 + x)/x = 1."}, {"id": "k4", "n": "First principles", "s": "f′(x) = lim_{h→0} [f(x + h) − f(x)]/h. Simplify until h cancels, then let h → 0."}, {"id": "k5", "n": "Rules of differentiation", "s": "(xⁿ)′ = nxⁿ⁻¹; (uv)′ = u′v + uv′; (u/v)′ = (u′v − uv′)/v²."}], "q": [{"id": "ld1", "k": "k1", "l": 1, "q": "lim (x→3) (x² − 9)/(x − 3) =", "o": ["6", "3", "0", "does not exist"], "a": 0, "t": ["", "Cancel to x + 3, then substitute.", "0/0 is not the answer; simplify first.", "After cancelling the limit exists."], "s": ["(x² − 9)/(x − 3) = x + 3 → 6."]}, {"id": "ld2", "k": "k1", "l": 2, "q": "lim (x→1) (x¹⁵ − 1)/(x¹⁰ − 1) =", "o": ["15", "5", "3/2", "1"], "a": 2, "t": ["Not just the top.", "Not a difference.", "", "Use n aⁿ⁻¹ on top and bottom."], "s": ["Divide top and bottom by (x − 1): 15/10 = 3/2."]}, {"id": "ld3", "k": "k1", "l": 2, "q": "lim (x→0) (√(1 + x) − 1)/x =", "o": ["0", "1", "2", "1/2"], "a": 3, "t": ["0/0 needs work.", "Rationalise: 1/(√(1 + x) + 1).", "The denominator is 2, not 1/2.", ""], "s": ["Multiply by (√(1 + x) + 1): 1/(√(1 + x) + 1) → 1/2."]}, {"id": "ld4", "k": "k1", "l": 3, "q": "lim (x→∞) (3x² − 2x + 1)/(5x² + 7) =", "o": ["∞", "3/5", "1/7", "0"], "a": 1, "t": ["Same degree gives a finite limit.", "", "Divide by x², not compare constants.", "Top and bottom have the same degree."], "s": ["Divide by x²: (3 − 2/x + 1/x²)/(5 + 7/x²) → 3/5."]}, {"id": "ld5", "k": "k2", "l": 1, "q": "lim (x→0) sin 5x / x =", "o": ["0", "5", "1/5", "1"], "a": 1, "t": ["sin 5x ~ 5x for small x.", "", "Upside down.", "Match 5x in the denominator."], "s": ["5 × sin 5x/(5x) → 5."]}, {"id": "ld6", "k": "k2", "l": 2, "q": "lim (x→0) (1 − cos 2x)/x² =", "o": ["4", "2", "1", "0"], "a": 1, "t": ["2 sin²x/x² → 2.", "", "1 − cos 2x = 2 sin²x.", "Use the identity before substituting."], "s": ["1 − cos 2x = 2 sin²x.", "2 (sin x/x)² → 2."]}, {"id": "ld7", "k": "k2", "l": 2, "q": "lim (x→0) tan 3x / sin 4x =", "o": ["4/3", "3/4", "1", "12"], "a": 1, "t": ["Upside down.", "", "The angles differ.", "Divide, don’t multiply."], "s": ["tan 3x ~ 3x and sin 4x ~ 4x: 3/4."]}, {"id": "ld8", "k": "k2", "l": 3, "q": "lim (x→0) (tan x − sin x)/x³ =", "o": ["1/2", "1", "1/6", "0"], "a": 0, "t": ["", "The two limits don’t just cancel.", "Check (1 − cos x)/x² → 1/2.", "tan x − sin x = tan x(1 − cos x)."], "s": ["tan x(1 − cos x)/x³ = (tan x/x) × (1 − cos x)/x².", "→ 1 × 1/2 = 1/2."]}, {"id": "ld9", "k": "k3", "l": 1, "q": "lim (x→0) (eˣ − 1)/x =", "o": ["0", "∞", "e", "1"], "a": 3, "t": ["Standard limit equals 1.", "The limit is finite.", "Standard limit equals 1, not e.", ""], "s": ["Standard result: 1."]}, {"id": "ld10", "k": "k3", "l": 2, "q": "lim (x→0) log(1 + 2x)/x =", "o": ["1", "1/2", "2", "0"], "a": 2, "t": ["Match 2x in the denominator.", "Upside down.", "", "It is finite and non-zero."], "s": ["2 × log(1 + 2x)/(2x) → 2."]}, {"id": "ld11", "k": "k3", "l": 2, "q": "lim (x→0) (3ˣ − 1)/x =", "o": ["3", "1/log 3", "1", "log 3"], "a": 3, "t": ["That forgets the log.", "Upside down.", "1 is for eˣ.", ""], "s": ["(aˣ − 1)/x → log a = log 3."]}, {"id": "ld12", "k": "k3", "l": 3, "q": "lim (x→0) (e³ˣ − e²ˣ)/x =", "o": ["5", "6", "1", "0"], "a": 2, "t": ["Subtract, don’t add.", "Not a product.", "", "It is finite and non-zero."], "s": ["= (e³ˣ − 1)/x − (e²ˣ − 1)/x → 3 − 2 = 1."]}, {"id": "ld13", "k": "k4", "l": 1, "q": "By definition, f′(x) =", "o": ["lim_{h→0} [f(x + h) − f(x)]/h", "lim_{h→0} [f(x) − f(h)]/h", "lim_{h→0} f(x + h)/h", "lim_{h→0} [f(x + h) + f(x)]/h"], "a": 0, "t": ["", "Wrong points subtracted.", "Missing − f(x).", "A derivative uses a difference."], "s": ["The derivative is the limit of the difference quotient."]}, {"id": "ld14", "k": "k4", "l": 2, "q": "From first principles, the derivative of x² is", "o": ["x", "2x", "x²", "2x + h"], "a": 1, "t": ["Recheck (x + h)² − x².", "", "x² is the function itself.", "h → 0 removes h."], "s": ["[(x + h)² − x²]/h = 2x + h → 2x."]}, {"id": "ld15", "k": "k4", "l": 2, "q": "From first principles, the derivative of 1/x is", "o": ["−1/x", "1/x²", "log x", "−1/x²"], "a": 3, "t": ["Square the x.", "Sign: 1/(x + h) − 1/x is negative for h > 0.", "log x is an antiderivative idea, not the derivative.", ""], "s": ["[1/(x + h) − 1/x]/h = −1/(x(x + h)) → −1/x²."]}, {"id": "ld16", "k": "k4", "l": 3, "q": "f(x) = (x³ − 1)/(x − 1) for x ≠ 1 and f(1) = 3. Using the definition, f′(1) =", "o": ["1", "2", "3", "0"], "a": 2, "t": ["Check with 2x + 1 at x = 1.", "That is f′(1/2).", "", "f is x² + x + 1 everywhere, not constant."], "s": ["f(x) = x² + x + 1, and f(1) = 3 matches.", "f′(1) = lim (3h + h²)/h = 3."]}, {"id": "ld17", "k": "k5", "l": 1, "q": "d/dx (x⁵) =", "o": ["x⁶/6", "5x⁵", "x⁴", "5x⁴"], "a": 3, "t": ["That is integration.", "Reduce the power by 1.", "Bring the 5 down.", ""], "s": ["Power rule: 5x⁴."]}, {"id": "ld18", "k": "k5", "l": 2, "q": "d/dx (x² sin x) =", "o": ["2x sin x + x² cos x", "x² cos x", "2x cos x", "2x sin x − x² cos x"], "a": 0, "t": ["", "Missing u′v.", "Product rule needs two terms.", "The second term is +."], "s": ["u′v + uv′ = 2x sin x + x² cos x."]}, {"id": "ld19", "k": "k5", "l": 2, "q": "d/dx [(x + 1)/(x − 1)] =", "o": ["−2/(x + 1)²", "1", "−2/(x − 1)²", "2/(x − 1)²"], "a": 2, "t": ["The denominator is (x − 1)².", "Not 1: use the quotient rule.", "", "u′v − uv′ = (x − 1) − (x + 1) = −2."], "s": ["[(x − 1) − (x + 1)]/(x − 1)² = −2/(x − 1)²."]}, {"id": "ld20", "k": "k5", "l": 3, "q": "f(x) = 1 + x + x² + … + x¹⁰⁰. f′(1) =", "o": ["5051", "10100", "100", "5050"], "a": 3, "t": ["The constant 1 contributes 0.", "Divide by 2.", "Sum 1 + 2 + … + 100, not just 100.", ""], "s": ["f′(x) = 1 + 2x + … + 100x⁹⁹.", "f′(1) = 1 + 2 + … + 100 = 5050."]}]}, {"id": "st", "n": "Statistics", "k": [{"id": "k1", "n": "Range and mean deviation", "s": "Range = max − min. Mean deviation = Σ|x − centre|/n; it is least about the median."}, {"id": "k2", "n": "Variance and standard deviation", "s": "σ² = Σ(x − x̄)²/n = Σx²/n − x̄². σ = √σ²."}, {"id": "k3", "n": "Shifting and scaling", "s": "Adding a constant changes the mean but not the spread. Multiplying by k multiplies σ by |k| and σ² by k²."}, {"id": "k4", "n": "Grouped data, step deviation", "s": "Use mid-points; u = (x − A)/h. Mean = A + h Σfu/N; σ² = h²[Σfu²/N − (Σfu/N)²]."}, {"id": "k5", "n": "Coefficient of variation", "s": "CV = σ/x̄ × 100. Lower CV means more consistent; compare CVs when means differ."}], "q": [{"id": "st1", "k": "k1", "l": 1, "q": "The range of 12, 5, 9, 21, 7 is", "o": ["10.8", "16", "21", "5"], "a": 1, "t": ["That is the mean.", "", "That is the maximum.", "That is the minimum."], "s": ["21 − 5 = 16."]}, {"id": "st2", "k": "k1", "l": 2, "q": "The mean deviation about the mean of 2, 4, 6, 8, 10 is", "o": ["2.4", "6", "3", "0"], "a": 0, "t": ["", "6 is the mean.", "Recheck: 12/5.", "Use absolute deviations, so they don’t cancel."], "s": ["Mean 6; |x − 6|: 4, 2, 0, 2, 4.", "12/5 = 2.4."], "f": {"k": "dots", "v": [2, 4, 6, 8, 10], "m": 6}}, {"id": "st3", "k": "k1", "l": 2, "q": "The mean deviation about the median of 3, 9, 5, 3, 12, 10, 18, 4, 7, 19, 21 is about", "o": ["9", "5.27", "6", "4.27"], "a": 1, "t": ["9 is the median.", "", "Recheck the total: 58.", "Arithmetic slip."], "s": ["Sorted, median = 9.", "Σ|x − 9| = 58; 58/11 ≈ 5.27."]}, {"id": "st4", "k": "k1", "l": 3, "q": "Mean deviation is smallest when taken about", "o": ["zero", "the mean", "the mode", "the median"], "a": 3, "t": ["Zero is not special.", "The mean minimises the squared deviations, not the absolute ones.", "The mode has no such property.", ""], "s": ["Σ|x − a| is least when a is the median."]}, {"id": "st5", "k": "k2", "l": 1, "q": "The variance of 2, 4, 6, 8, 10 is", "o": ["8", "40", "6", "√8"], "a": 0, "t": ["", "Divide by n = 5.", "That is the mean.", "That is the SD."], "s": ["Mean 6; squared deviations 16, 4, 0, 4, 16 = 40.", "40/5 = 8."]}, {"id": "st6", "k": "k2", "l": 2, "q": "The standard deviation of 1, 2, 3, 4, 5 is", "o": ["√2", "3", "1", "2"], "a": 0, "t": ["", "3 is the mean.", "Recheck: 10/5 = 2.", "2 is the variance."], "s": ["Σ(x − 3)² = 10; variance 2; SD √2."]}, {"id": "st7", "k": "k2", "l": 2, "q": "The variance of the first n natural numbers is", "o": ["(n² + 1)/12", "(n + 1)/2", "(n² − 1)/12", "n²/12"], "a": 2, "t": ["Sign slip.", "That is the mean.", "", "Missing the −1."], "s": ["σ² = (n + 1)(2n + 1)/6 − (n + 1)²/4 = (n² − 1)/12."]}, {"id": "st8", "k": "k2", "l": 3, "q": "The mean of 100 observations is 40. One value was misread as 50 instead of 40. The correct mean is", "o": ["39.9", "40", "39", "40.1"], "a": 0, "t": ["", "The error changes the total.", "The total drops by 10, not 100.", "The wrong value was too large."], "s": ["Correct total = 4000 − 50 + 40 = 3990.", "Mean 39.9."]}, {"id": "st9", "k": "k3", "l": 1, "q": "If every value increases by 5, the standard deviation", "o": ["is multiplied by 5", "increases by 25", "increases by 5", "is unchanged"], "a": 3, "t": ["That is for multiplying by 5.", "Shifting doesn’t change the spread.", "Sh /* ---------- Concept Builder: adaptive concept MCQs with chapter concept circles ---------- */
var CB_SOON=[],CB_ORD=['se','rf','tr','cx','qe','li','pc','bt','ss','sl','ci','cs','td','ld','st','pr'];CB.sort(function(a,b){return CB_ORD.indexOf(a.id)-CB_ORD.indexOf(b.id)});
var CBS=null,CB_SHORT={se:'Sets',rf:'Func.',tr:'Trig',cx:'Complex',qe:'Quad.',li:'Ineq.',pc:'P & C',bt:'Binomial',ss:'Series',sl:'Lines',ci:'Circles',cs:'Conics',td:'3D',ld:'Limits',st:'Stats',pr:'Prob.'}; /* live session */
var LVN=['','Basic','Standard','Tricky'];
function cbSt(){S.cb=S.cb||{};S.cb.k=S.cb.k||{};S.cb.h=S.cb.h||{};S.cb.lv=S.cb.lv||{};return S.cb}
function cbCh(id){return CB.filter(function(c){return c.id===id})[0]}
function cbK(ch,k){var s=cbSt(),key=ch+'.'+k;return s.k[key]||(s.k[key]={c:0,n:0,ok:0})}
function cbFill(c){var n=c.k.filter(function(k){return cbK(c.id,k.id).c}).length;return{n:n,t:c.k.length}}
/* colour of a chapter's circle */
function cbState(c){var f=cbFill(c),h=(cbSt().h[c.id]||[]);
  if(f.n<f.t)return{pct:Math.round(f.n/f.t*100),cls:'lg',lab:f.n+' of '+f.t+' concepts cracked',tag:f.n?'Building':'Not started'};
  var l6=h.slice(-6),l5=h.slice(-5);
  if(l6.some(function(e){return e.sev==='g'}))return{pct:100,cls:'rd',lab:'A basic slip: revisit',tag:'Needs work'};
  if(l5.some(function(e){return e.sev==='m'}))return{pct:100,cls:'yl',lab:'A tricky miss: tidy up',tag:'Moderate'};
  if(l6.length>=6&&l6.every(function(e){return e.ok})&&l6.filter(function(e){return e.l===3}).length>=2)return{pct:100,cls:'dg',lab:'All concepts, tricky ones right',tag:'Very good'};
  return{pct:100,cls:'lg',lab:'All concepts cracked',tag:'Good'}}
function cbRing(c,size){var st=cbState(c);return'<span class="ring '+st.cls+'" style="--p:'+st.pct+'%;width:'+size+'px;height:'+size+'px" role="img" aria-label="'+esc(c.n+': '+st.tag+', '+st.lab)+'"></span>'}
/* card on the Practise home */
function cbCard(){var h='<div class="card cbcard"><span class="cbcap">Concept Builder</span><p class="sub" style="margin:8px 0 10px">Adaptive concept questions. Each circle fills green as concepts are cracked.</p><div class="cbmini">';
  CB.forEach(function(c){h+='<button class="cbm" onclick="cbOpen(\''+c.id+'\')">'+cbRing(c,40)+'<small>'+esc(CB_SHORT[c.id]||c.n)+'</small></button>'});
  return h+'</div><button class="btn cbbtn" onclick="view=\'cb\';CBS=null;render();window.scrollTo(0,0)">Open Concept Builder</button></div>'}
function cbView(){if(CBS)return cbQ();cbHome()}
function cbHome(){
  var h='<p class="back"><button class="link" onclick="view=\'practice\';render()">← Practise</button></p><h1><span class="cbcap">Concept Builder</span></h1><p class="sub" style="margin-top:8px">Pick a chapter. Questions get harder as you get them right and easier when you slip, until every concept clicks.</p>';
  h+='<div class="cbgrid">';CB.forEach(function(c){var st=cbState(c);h+='<button class="cbtile" onclick="cbOpen(\''+c.id+'\')">'+cbRing(c,78)+'<b>'+esc(c.n)+'</b><small>'+esc(st.tag)+' · '+esc(st.lab)+'</small></button>'});h+='</div>';
  h+='<div class="card"><b>What the colours mean</b><div class="leg"><span><i class="ring" style="--p:0%"></i>Not started</span><span><i class="ring lg" style="--p:60%"></i>Filling: concepts being cracked</span><span><i class="ring dg" style="--p:100%"></i>Very good</span><span><i class="ring lg" style="--p:100%"></i>Good</span><span><i class="ring yl" style="--p:100%"></i>Moderate mistake</span><span><i class="ring rd" style="--p:100%"></i>Basic mistake: revisit</span></div><p class="sub" style="margin:8px 0 0">Correct answers bring a yellow or red circle back to green.</p></div>';
  if(CB_SOON.length)h+='<div class="card"><b>Coming in the next batches</b><div class="chips">'+CB_SOON.map(function(n){return'<span class="chip">'+esc(n)+'</span>'}).join('')+'</div></div>';
  app.innerHTML=h}
function cbOpen(id){view='cb';var c=cbCh(id),s=cbSt();CBS={ch:id,L:s.lv[id]||2,focus:null,recall:[],seen:[],n:0,ok:0,cur:null,pick:null,startN:cbFill(c).n,exp:false};cbNext();render();window.scrollTo(0,0)}
/* SAT-style pick: due recall → current focus → an uncracked concept → weakest concept */
function cbNext(){var c=cbCh(CBS.ch),k=null,i;
  for(i=0;i<CBS.recall.length;i++)if(CBS.recall[i].due<=CBS.n){k=CBS.recall[i].k;CBS.recall.splice(i,1);break}
  if(!k&&CBS.focus)k=CBS.focus;
  if(!k){var un=c.k.filter(function(x){return!cbK(c.id,x.id).c});
    if(un.length)k=un[Math.floor(Math.random()*Math.min(2,un.length))].id;
    else{var ks=c.k.slice().sort(function(a,b){var A=cbK(c.id,a.id),B=cbK(c.id,b.id);return(A.ok/(A.n||1))-(B.ok/(B.n||1))+Math.random()*.3-.15});k=ks[0].id}}
  var recent=CBS.seen.slice(-6),L=CBS.L;
  function pool(f){return c.q.filter(function(q){return f(q)&&recent.indexOf(q.id)<0})}
  var cand=pool(function(q){return q.k===k&&q.l===L&&CBS.seen.indexOf(q.id)<0});
  if(!cand.length)cand=pool(function(q){return q.k===k&&CBS.seen.indexOf(q.id)<0}).sort(function(a,b){return Math.abs(a.l-L)-Math.abs(b.l-L)}).slice(0,2);
  if(!cand.length)cand=pool(function(q){return q.k===k});
  if(!cand.length)cand=pool(function(){return true});
  CBS.cur=cand[Math.floor(Math.random()*cand.length)];CBS.pick=null;CBS.exp=false}
function cbQ(){
  var c=cbCh(CBS.ch),q=CBS.cur,kk=c.k.filter(function(x){return x.id===q.k})[0],done=CBS.pick!=null,ok=done&&CBS.pick===q.a;
  var h='<div class="cbtop"><button class="link" onclick="cbEnd()">← End session</button>'+cbRing(c,34)+'</div>';
  h+='<div class="meta"><span>'+esc(c.n)+' · '+esc(kk.n)+'</span><span class="lvl l'+q.l+'">'+LVN[q.l]+'</span></div>';
  h+='<div class="card"><div class="q">'+esc(q.q)+'</div>';
  q.o.forEach(function(o,i){var cl='';if(done){if(i===q.a)cl=' ok';else if(i===CBS.pick)cl=' bad'}
    h+='<button class="opt'+cl+'" onclick="cbAns('+i+')"'+(done?' disabled':'')+'>('+'abcd'[i]+') '+esc(o)+'</button>'});
  if(done){
    h+=ok?'<div class="fb ok"><b>'+CHEER[CBS.n%CHEER.length]+'</b> '+esc(q.s[q.s.length-1])+'</div>':'<div class="fb bad"><b>Not quite.</b> The answer is ('+'abcd'[q.a]+'). Here is why.</div>';
    if(!ok||CBS.exp)h+=cbExpl(q,kk,ok);
    else h+='<button class="link" style="margin-top:10px" onclick="CBS.exp=true;cbQ()">Show the full explanation</button>';
    h+='<button class="btn" onclick="cbGo()">Next question</button><button class="btn alt chatb" onclick="cbDoubt()">'+CHAT_ICON+'Ask a doubt in Claude chat</button>'}
  h+='</div><p class="sub" style="text-align:center">'+CBS.n+' answered · '+CBS.ok+' right this session</p>';
  app.innerHTML=h}
function cbExpl(q,kk,ok){var h='<div class="expl cbx"><h3>Top-level concept</h3><div class="pivot"><b>'+esc(kk.n)+'.</b> '+esc(kk.s)+'</div>';
  if(!ok)h+='<h3>Why your choice was a trap</h3><p style="margin:0">'+esc(q.t[CBS.pick])+'</p>';
  if(q.f)h+='<h3>The picture</h3>'+figure(q.f);
  h+='<h3>Step by step</h3><ol class="steps">'+q.s.map(function(s){return'<li>'+esc(s)+'</li>'}).join('')+'</ol><div class="ansb" style="margin-top:10px"><small>Answer</small><div>('+'abcd'[q.a]+') '+esc(q.o[q.a])+'</div></div></div>';
  return h}
function cbAns(i){if(CBS.pick!=null)return;var c=cbCh(CBS.ch),q=CBS.cur,ok=i===q.a,s=cbSt(),K=cbK(c.id,q.k),H=s.h[c.id]=s.h[c.id]||[];
  CBS.pick=i;CBS.n++;CBS.seen.push(q.id);K.n++;
  var prev=null;for(var j=H.length-1;j>=0;j--)if(H[j].k===q.k){prev=H[j];break}
  var sev='';
  if(ok){CBS.ok++;K.ok++;if(q.l>=2)K.c=1;CBS.L=Math.min(3,CBS.L+1);if(CBS.focus===q.k&&(K.c||q.l>=2))CBS.focus=null}
  else{sev=(q.l===1||(prev&&!prev.ok))?'g':'m';CBS.L=Math.max(1,CBS.L-1);CBS.focus=q.k;CBS.recall.push({k:q.k,due:CBS.n+3})}
  H.push({k:q.k,l:q.l,ok:ok,sev:sev,ts:Date.now()});if(H.length>60)s.h[c.id]=H.slice(-60);
  s.lv[c.id]=CBS.L;
  var kk=c.k.filter(function(x){return x.id===q.k})[0];
  if(ok)mkFix('cb:'+q.id);else mkAdd({src:'Concept Builder',topic:c.n,concept:kk.n,q:q.q,o:q.o,a:q.a,pick:i,note:q.t[i],h:q.s.join(' '),ref:'cb:'+q.id});
  S.ev.push({k:'cb',topic:c.n,ok:ok,habit:ok?'':'Concept: '+kk.n,type:'concept builder',ts:Date.now()});
  save();cbQ();var f=document.querySelector('.fb');if(f)f.scrollIntoView({block:'nearest',behavior:'smooth'})}
function cbGo(){cbNext();cbQ();window.scrollTo(0,0)}
function cbDoubt(){var c=cbCh(CBS.ch),q=CBS.cur,kk=c.k.filter(function(x){return x.id===q.k})[0],ok=CBS.pick===q.a;
  openChat(chatHead()+'Chapter: '+c.n+' — concept: '+kk.n+'\nQuestion: '+q.q+'\nOptions: '+q.o.map(function(o,i){return'('+'abcd'[i]+') '+o}).join(' | ')+'\n'+(ok?'I chose the right answer ('+q.o[q.a]+').':'I chose ('+'abcd'[CBS.pick]+') '+q.o[CBS.pick]+', but the answer is ('+'abcd'[q.a]+') '+q.o[q.a]+'. The app says: '+q.t[CBS.pick])+'\nApp’s explanation: '+q.s.join(' ')+'\nKey idea: '+kk.s+'\n\nMy doubt: ')}
function cbEnd(){var c=cbCh(CBS.ch),st=cbState(c),f=cbFill(c),gain=f.n-CBS.startN;
  var h='<h1>Session finished</h1><p class="sub">'+esc(c.n)+'</p><div class="card" style="text-align:center">'+cbRing(c,110)+'<p style="margin:12px 0 4px"><b>'+esc(st.tag)+'</b></p><p class="sub" style="margin:0">'+esc(st.lab)+'</p></div>';
  h+='<div class="stats"><div class="stat"><b>'+CBS.n+'</b><span>answered</span></div><div class="stat"><b>'+CBS.ok+'</b><span>right</span></div><div class="stat"><b>'+(gain>0?'+'+gain:0)+'</b><span>concepts cracked</span></div></div>';
  h+='<div class="card"><b>Concepts</b>'+c.k.map(function(k){var K=cbK(c.id,k.id);return'<div class="tbar"><span>'+esc(k.n)+'</span><span class="tr"><i style="width:'+(K.n?Math.round(K.ok/K.n*100):0)+'%;background:'+(K.c?'var(--ok)':'var(--c4)')+'"></i></span><em>'+(K.c?'✓':K.ok+'/'+K.n)+'</em></div>'}).join('')+'</div>';
  h+='<button class="btn" onclick="cbOpen(\''+c.id+'\')">Keep going</button><button class="btn alt" onclick="CBS=null;render()">All chapters</button>';
  CBS=null;app.innerHTML=h;window.scrollTo(0,0)}

/* ---------- Mistakes log: every mistake from every section, tracked until fixed ---------- */
var MKF={st:'open',ch:'All'},MKR=null;
function mkList(){S.mk=S.mk||[];return S.mk}
function mkAdd(e){var L=mkList(),ref=e.ref||(e.src+':'+String(e.q||'').slice(0,120)),now=Date.now();
  var x=L.filter(function(m){return m.ref===ref&&!m.fx})[0];
  if(x){x.n++;x.ts=now;if(e.pick!=null)x.pick=e.pick;if(e.note)x.note=e.note;if(e.mine)x.mine=e.mine}
  else{e.ref=ref;e.id='m'+now.toString(36)+Math.floor(Math.random()*1e4);e.n=1;e.t0=now;e.ts=now;e.fx=0;L.push(e)}
  if(L.length>400){var open=L.filter(function(m){return!m.fx}),fixed=L.filter(function(m){return m.fx});S.mk=fixed.slice(-(400-Math.min(open.length,400))).concat(open.slice(-400))}}
function mkFix(ref){mkList().forEach(function(m){if(m.ref===ref&&!m.fx)m.fx=Date.now()})}
/* one-time: rebuild earlier practice mistakes from the activity history */
function mkSeed(){if(S.mkSeed)return;S.mkSeed=1;
  S.ev.forEach(function(e){if(e.k!=='q'||e.ok||!e.q)return;var q=Q.filter(function(x){return x.q.slice(0,90)===e.q})[0];if(!q)return;
    var p=q.o.indexOf(e.pick);mkAdd({src:'Practise',topic:NM[q.p]||q.p,q:q.q,o:q.o,a:q.a,pick:p<0?null:p,habit:tg(e.tag)[0],h:q.h,ref:'q:'+q.q});var m=mkList()[mkList().length-1];m.t0=m.ts=e.ts||m.ts});
  save()}
function mkCard(){mkSeed();var L=mkList(),open=L.filter(function(m){return!m.fx}).length,fixed=L.length-open;
  return'<div class="card mkcard"><b>My mistakes</b><p class="sub" style="margin:4px 0 0">'+(L.length?open+' still open · '+fixed+' fixed. Every slip from every section is kept here until you get it right.':'Every slip from every section will be kept here, so you can retry it until it’s fixed.')+'</p><button class="btn mkbtn" onclick="view=\'mk\';MKR=null;render();window.scrollTo(0,0)"'+(L.length?'':' disabled')+'>Open my mistakes</button></div>'}
function mkWhen(t){var d=Math.floor((Date.now()-t)/864e5);return d<1?'today':d<2?'yesterday':d<7?d+' days ago':new Date(t).toLocaleDateString()}
function mkView(){if(MKR)return mkRetry();mkSeed();
  var L=mkList(),open=L.filter(function(m){return!m.fx}),fixed=L.filter(function(m){return m.fx}),pool=MKF.st==='open'?open:fixed;
  var chs={};pool.forEach(function(m){chs[m.topic]=(chs[m.topic]||0)+1});if(MKF.ch!=='All'&&!chs[MKF.ch])MKF.ch='All';
  var shown=pool.filter(function(m){return MKF.ch==='All'||m.topic===MKF.ch}).sort(function(a,b){return b.ts-a.ts});
  var h='<p class="back"><button class="link" onclick="view=\'practice\';render()">← Practise</button></p><h1>My mistakes</h1><p class="sub">Every wrong answer from Practise, Concept Builder, Notebook checks, Book examples and Sample papers. Retry one until you get it right and it moves to Fixed.</p>';
  h+='<div class="stats"><div class="stat"><b>'+open.length+'</b><span>open</span></div><div class="stat"><b>'+fixed.length+'</b><span>fixed</span></div><div class="stat"><b>'+L.reduce(function(s,m){return s+m.n},0)+'</b><span>slips in all</span></div></div>';
  var rt=open.filter(function(m){return m.o}).length;
  if(rt)h+='<button class="btn" onclick="mkStart()">Retry my open mistakes ('+rt+')</button>';
  h+='<div class="seg" role="tablist" style="margin-top:12px"><button role="tab" aria-selected="'+(MKF.st==='open')+'" onclick="MKF.st=\'open\';mkView()">Open ('+open.length+')</button><button role="tab" aria-selected="'+(MKF.st==='fixed')+'" onclick="MKF.st=\'fixed\';mkView()">Fixed ('+fixed.length+')</button></div>';
  var ck=Object.keys(chs).sort(function(a,b){return chs[b]-chs[a]});
  if(ck.length>1)h+='<div class="chaps">'+['All'].concat(ck).map(function(c){return'<button class="chap'+(c===MKF.ch?' on':'')+'" onclick="MKF.ch=this.dataset.c;mkView()" data-c="'+esc(c)+'">'+esc(c)+' <small>'+(c==='All'?pool.length:chs[c])+'</small></button>'}).join('')+'</div>';
  if(!shown.length)h+='<div class="card"><p class="sub" style="margin:0">'+(MKF.st==='open'?'No open mistakes here. Well done!':'Nothing fixed yet. Retry an open mistake to move it here.')+'</p></div>';
  shown.slice(0,60).forEach(function(m){h+=mkItem(m)});
  if(shown.length>60)h+='<p class="sub">Showing the 60 most recent.</p>';
  app.innerHTML=h}
function mkItem(m){var h='<div class="card mki'+(m.fx?' fx':'')+'"><div class="meta" style="margin:0 0 6px"><span>'+esc(m.topic)+' · '+esc(m.src)+'</span><span>'+mkWhen(m.ts)+(m.n>1?' · ×'+m.n:'')+'</span></div>';
  h+='<div class="mkq ctext">'+esc(m.q||'(question not recorded)')+'</div>';
  if(m.o&&m.pick!=null)h+='<div class="mkr bad">Your answer: '+esc(m.o[m.pick])+'</div>';
  else if(m.mine)h+='<div class="mkr bad">'+esc(m.mine)+'</div>';
  if(m.o)h+='<div class="mkr ok">Right answer: '+esc(m.o[m.a])+'</div>';else if(m.ans)h+='<div class="mkr ok">Answer: '+esc(m.ans)+'</div>';
  if(m.habit||m.concept)h+='<div class="chips" style="margin-top:6px">'+(m.concept?'<span class="chip">'+esc(m.concept)+'</span>':'')+(m.habit&&m.habit!==m.concept?'<span class="chip">'+esc(m.habit)+'</span>':'')+'</div>';
  if(m.note)h+='<p class="sub" style="margin:6px 0 0">'+esc(m.note)+'</p>';
  if(m.fx)h+='<p class="sub" style="margin:6px 0 0;color:var(--ok)">✓ Fixed '+mkWhen(m.fx)+'</p>';
  h+='<div class="row2">'+(!m.fx&&m.o?'<button class="btn alt" onclick="mkStart(\''+m.id+'\')">Retry</button>':!m.fx?'<button class="btn alt" onclick="mkDone(\''+m.id+'\')">I’ve understood it</button>':'<button class="btn alt" onclick="mkReopen(\''+m.id+'\')">Practise again</button>')+'<button class="btn alt" onclick="mkDoubt(\''+m.id+'\')">Ask a doubt</button></div>';
  return h+'</div>'}
function mkGet(id){return mkList().filter(function(m){return m.id===id})[0]}
function mkDone(id){var m=mkGet(id);if(m){m.fx=Date.now();save();mkView()}}
function mkReopen(id){var m=mkGet(id);if(m){m.fx=0;save();MKF.st='open';mkView()}}
function mkDoubt(id){var m=mkGet(id);if(!m)return;
  openChat(chatHead()+'This is a mistake I made earlier ('+m.src+', '+m.topic+(m.concept?' — '+m.concept:'')+').\nQuestion: '+(m.q||'')+'\n'+(m.o?'Options: '+m.o.join(' | ')+'\n':'')+(m.o&&m.pick!=null?'My answer: '+m.o[m.pick]+'\n':m.mine?m.mine+'\n':'')+(m.o?'Right answer: '+m.o[m.a]+'\n':m.ans?'Answer: '+m.ans+'\n':'')+(m.habit?'My app’s note on the slip: '+m.habit+'\n':'')+(m.note?m.note+'\n':'')+(m.h?'Method: '+m.h+'\n':'')+'\nHelp me understand where I went wrong, then give me one similar question to try.\n\nMy doubt: ')}
function mkStart(id){var open=mkList().filter(function(m){return!m.fx&&m.o});
  var q=id?open.filter(function(m){return m.id===id}):open.sort(function(a,b){return b.n-a.n||a.ts-b.ts});
  if(!q.length)return;MKR={q:q.map(function(m){return m.id}),i:0,pick:null,ok:0};view='mk';mkRetry();window.scrollTo(0,0)}
function mkRetry(){var m=mkGet(MKR.q[MKR.i]);if(!m){MKR=null;return mkView()}
  var done=MKR.pick!=null,ok=done&&MKR.pick===m.a;
  var h='<div class="meta"><span>Retry · '+esc(m.topic)+'</span><span>'+(MKR.i+1)+' / '+MKR.q.length+'</span></div><div class="bar"><i style="width:'+(MKR.i/MKR.q.length*100)+'%"></i></div><div class="card"><div class="q">'+esc(m.q)+'</div>';
  m.o.forEach(function(o,k){var cl='';if(done){if(k===m.a)cl=' ok';else if(k===MKR.pick)cl=' bad'}h+='<button class="opt'+cl+'" onclick="mkPick('+k+')"'+(done?' disabled':'')+'>'+esc(o)+'</button>'});
  if(done){h+='<div class="fb '+(ok?'ok':'bad')+'"><b>'+(ok?'Fixed! This one moves to your Fixed list.':'Still tricky. It stays open for another go.')+'</b>'+(m.h?'<div class="ctext" style="margin-top:6px">'+esc(m.h)+'</div>':'')+'</div>';
    h+='<button class="btn" onclick="mkNext()">'+(MKR.i+1<MKR.q.length?'Next mistake':'Finish')+'</button><button class="btn alt chatb" onclick="mkDoubt(\''+m.id+'\')">'+CHAT_ICON+'Ask a doubt in Claude chat</button>'}
  h+='</div><button class="btn alt" onclick="MKR=null;mkView()">Back to my mistakes</button>';
  app.innerHTML=h}
function mkPick(k){if(MKR.pick!=null)return;var m=mkGet(MKR.q[MKR.i]);MKR.pick=k;
  if(k===m.a){m.fx=Date.now();MKR.ok++}else{m.n++;m.ts=Date.now()}
  S.ev.push({k:'mk',topic:m.topic,ok:k===m.a,habit:k===m.a?'':(m.habit||m.concept||'Repeated mistake'),type:'mistake retry',ts:Date.now()});save();mkRetry()}
function mkNext(){MKR.i++;MKR.pick=null;if(MKR.i>=MKR.q.length){var ok=MKR.ok,n=MKR.q.length;MKR=null;mkView();showToast(ok+' of '+n+' fixed this round.');return}mkRetry();window.scrollTo(0,0)}

/* ---------- weekly progress report (WhatsApp) ---------- */
var WKN={'Trigonometric Functions':'Trigonometry','Straight Lines':'Points and Straight Lines'};
function wkTopic(e){var n=e.k==='q'?(NM[e.p]||e.p):(e.topic||'Other');return WKN[n]||n}
function wkDate(t){return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'})}
function wkText(){
  var now=Date.now(),from=now-7*864e5,ev=S.ev.filter(function(e){return e.ts&&e.ts>=from}),t='📘 Maths Coach – weekly report ('+wkDate(from)+' – '+wkDate(now)+')\n';
  if(!ev.length)return t+'\nNo practice recorded this week.';
  var days={};ev.forEach(function(e){days[dayKey(e.ts)]=1});
  var ans=ev.filter(function(e){return e.k!=='pp'}),ok=ans.filter(function(e){return e.ok}).length;
  t+='\nActive days: '+Object.keys(days).length+' of 7\nAnswers checked: '+ans.length+(ans.length?' ('+Math.round(ok/ans.length*100)+'% right)':'')+'\n';
  var by={};ans.forEach(function(e){var k=wkTopic(e);by[k]=by[k]||[0,0];by[k][1]++;if(e.ok)by[k][0]++});
  var ch=Object.keys(by).sort(function(a,b){return by[a][0]/by[a][1]-by[b][0]/by[b][1]});
  if(ch.length){t+='\nBy chapter (weakest first):\n';ch.slice(0,10).forEach(function(k){var v=by[k];t+='• '+k+': '+v[0]+'/'+v[1]+'\n'})}
  if(typeof CB!=='undefined'){var touched=CB.filter(function(c){return(cbSt().h[c.id]||[]).some(function(h){return h.ts>=from})});
    if(touched.length){t+='\nConcept circles:\n';touched.forEach(function(c){var s=cbState(c),em={dg:'🟢',lg:'🟩',yl:'🟡',rd:'🔴'}[s.cls]||'⚪';t+=em+' '+c.n+': '+s.tag+(s.pct<100?' ('+s.lab+')':'')+'\n'})}}
  if(typeof PP!=='undefined'){var pp=PP.filter(function(p){return ev.some(function(e){return e.k==='pp'&&e.pid===p.id})});
    if(pp.length){t+='\nSample papers saved:\n';pp.forEach(function(p){var sc=ppScore(p);t+='• '+p.t+': '+sc.got+'/'+sc.out+' marked (best '+ppS(p.id).best+'/80)\n'})}}
  var L=(S.mk||[]),nw=L.filter(function(m){return m.t0>=from}).length,fx=L.filter(function(m){return m.fx&&m.fx>=from}).length,op=L.filter(function(m){return!m.fx}).length;
  t+='\nMistakes: '+nw+' new, '+fx+' fixed this week, '+op+' still open\n';
  var hab={};ev.forEach(function(e){if(!e.ok&&e.k!=='pp'){var h=e.k==='q'?tg(e.tag)[0]:(e.habit||'').replace(/^Concept: /,'');if(h)hab[h]=(hab[h]||0)+1}});
  var H=Object.keys(hab).sort(function(a,b){return hab[b]-hab[a]}).slice(0,4);
  if(H.length)t+='Main slips: '+H.map(function(k){return k+' ('+hab[k]+'×)'}).join(', ')+'\n';
  var nb=ev.filter(function(e){return e.k==='nb'}).length;if(nb)t+='Notebook checks: '+nb+'\n';
  return t.trim()}
function wkCard(){var last=S.wkSent?'Last sent '+mkWhen(S.wkSent)+'.':'Not sent yet.';
  return'<div class="card wkcard"><b>Weekly report for the teacher</b><p class="sub" style="margin:4px 0 6px">The last 7 days: active days, accuracy by chapter, concept circles, sample papers and mistakes. '+last+'</p><details><summary>Preview</summary><pre>'+esc(wkText())+'</pre></details><a class="btn wa" target="_blank" rel="noopener" style="text-decoration:none" href="https://wa.me/'+(S.tw||'')+'?text='+encodeURIComponent(wkText())+'" onclick="wkSent()">'+(S.tw?'Send weekly report to the teacher':'Send weekly report on WhatsApp')+'</a><button class="btn alt" onclick="wkCopy()">Copy weekly report</button></div>'}
function wkSent(){S.wkSent=Date.now();save()}
function wkCopy(){var t=wkText();try{navigator.clipboard.writeText(t).then(function(){showToast('Weekly report copied. Paste it into any chat.')},function(){showToast('Open Preview, then press and hold to copy.')})}catch(e){showToast('Open Preview, then press and hold to copy.')}wkSent()}
function wkNudge(){if(!S.ev.length)return'';var first=S.ev[0].ts||Date.now(),due=S.wkSent?Date.now()-S.wkSent>=7*864e5:Date.now()-first>=6*864e5;
  return due?'<div class="note wknote"><b>Weekly report is due.</b> Send this week’s progress to the teacher. <button class="link" onclick="view=\'spots\';render();window.scrollTo(0,0)">Open the report</button></div>':''}

render();
</script>
</body></html>
