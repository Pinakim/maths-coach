var PPI=null,PPR={},PPT=null,PPC={};
var RN=['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii','xiii','xiv','xv','xvi','xvii','xviii','xix','xx'];
var SECS=[['A',20,'Very short answers, 1 mark each'],['B',14,'Short answers, 2 marks each'],['C',21,'Moderately long answers, 3 marks each'],['D',25,'Long answers, 5 marks each']];
function ppS(id){S.pp=S.pp||{};if(!S.pp[id])S.pp[id]={mk:{},pk:{},t0:0,best:null};var r=S.pp[id];r.mk=r.mk||{};r.pk=r.pk||{};return r}
function ppPaper(){return PP.filter(function(p){return p.id===PPI})[0]}
function ppFind(key,p){p=p||ppPaper();var sec=key[0],n=parseInt(key.slice(1),10),q=p[sec].filter(function(x){return x.n===n})[0];var si=key.indexOf('.')>0?parseInt(key.split('.')[1],10):null;return{p:p,q:q,sub:si==null?null:q.sub[si],si:si}}
function ppKeys(p){var k=[];SECS.forEach(function(x){var s=x[0];p[s].forEach(function(q){if(q.sub)q.sub.forEach(function(_,i){k.push(s+q.n+'.'+i)});else k.push(s+q.n)})});return k}
function ppMax(key,p){var f=ppFind(key,p);return f.sub?1:f.q.m}
function ppChap(key,p){var f=ppFind(key,p);if(f.sub)return f.sub.c;var r=ppS(f.p.id),a=f.q.alt[r.pk[key]||0]||f.q.alt[0];return a.c}
function ppScore(p){var r=ppS(p.id),got=0,out=0;ppKeys(p).forEach(function(k){if(r.mk[k]!=null){got+=r.mk[k];out+=ppMax(k,p)}});return{got:got,out:out}}
function sk(k){return k.replace('.','_')}

function ppView(){if(PPI&&ppPaper())return ppOne();PPI=null;ppList()}
function ppList(){
  var h='<h1>Final exam sample papers</h1><p class="sub">Five full papers on the school’s final exam pattern. Sit one like the real exam, then mark it here or let Claude mark a photo of each answer.</p>';
  h+='<div class="card"><b>Paper pattern</b><div class="pat">'+SECS.map(function(x){return'<div><span>Section '+x[0]+'</span><b>'+x[1]+'</b><small>'+['1 mark','2 marks','3 marks','5 marks'][SECS.indexOf(x)]+'</small></div>'}).join('')+'</div>';
  h+='<p class="sub" style="margin:10px 0 0">80 marks · 3 hours · 20 questions, all compulsory. Q1 has 20 one-mark parts (17 MCQs, 3 short answers) · Q2–8: 2 marks · Q9–15: 3 marks · Q16–20: 5 marks. Sections B, C and D each have three questions with an internal choice (OR).</p></div><div class="card">';
  PP.forEach(function(p,i){var r=ppS(p.id),sc=ppScore(p),pill;
    if(r.best!=null)pill='<span class="pill ok">Best '+r.best+'/80</span>';else if(sc.out)pill='<span class="pill mid">'+sc.got+'/'+sc.out+' marked</span>';else if(r.t0)pill='<span class="pill st">Started</span>';else pill='<span class="pill">Not started</span>';
    h+='<button class="trow" onclick="ppOpen(\''+p.id+'\')"><span class="tn">'+(i+1)+'</span><span class="tt"><b>'+esc(p.t)+'</b><small>Full syllabus · 80 marks · 3 hours</small></span>'+pill+'</button>'});
  h+='</div><div class="note">Built on the pattern and question styles of the school’s recent final and half-yearly papers, across the whole year’s syllabus. Every answer was checked by calculation.</div>';
  app.innerHTML=h;
}
function ppOpen(id){PPI=id;PPR={};PPC={};render();window.scrollTo(0,0)}
function ppBack(){PPI=null;render();window.scrollTo(0,0)}

function ppOne(){
  var p=ppPaper(),r=ppS(p.id);
  var h='<p class="back"><button class="link" onclick="ppBack()">← All papers</button></p><h1>'+esc(p.t)+'</h1><p class="sub">Maximum marks 80 · Time 3 hours, plus 15 minutes reading time</p>';
  h+='<div class="card"><div id="ppTimer"></div><details style="margin-top:10px"><summary>Instructions</summary><ul class="ins"><li>20 questions in four sections, A to D. All questions are compulsory.</li><li>Section A: 1 mark each. Section B: 2 marks each. Section C: 3 marks each. Section D: 5 marks each.</li><li>Three questions in each of Sections B, C and D have an internal choice (OR): answer one part only.</li><li>For MCQs, write only one option.</li><li>Write all working, including rough work, beside the answer. Marks are shown in brackets.</li></ul></details></div>';
  SECS.forEach(function(x){h+='<h2 class="sech">Section '+x[0]+' <span>'+x[1]+' marks</span></h2><p class="sub" style="margin:-6px 2px 10px">'+x[2]+'</p>';
    p[x[0]].forEach(function(q){h+='<div class="qcard pq" id="c_'+sk(x[0]+q.n)+'">'+ppCard(x[0],q)+'</div>'})});
  h+='<div class="card hi" id="ppSum">'+ppSumHtml(p)+'</div>';
  app.innerHTML=h;ppTick();clearInterval(PPT);PPT=setInterval(ppTick,15000);ppWire();
}
function ppTick(){var el=document.getElementById('ppTimer');if(!el){clearInterval(PPT);return}var r=ppS(PPI);
  if(!r.t0){el.innerHTML='<b>Exam timer</b><p class="sub" style="margin:2px 0 0">Sit the paper in one go, like the real exam.</p><button class="btn" onclick="ppStart()">Start 3-hour timer</button>';return}
  var left=r.t0+3*3600e3-Date.now(),txt;
  if(left>0){var m=Math.ceil(left/60000);txt='<b class="tbig">'+Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min</b> left'}else txt='<b class="tbig">Time is up</b> · stop writing and start marking';
  el.innerHTML='<div class="meta" style="margin:0"><span>'+txt+'</span><button class="link" onclick="ppStop()">Stop timer</button></div><div class="bar" style="margin:8px 0 0"><i style="width:'+Math.min(100,Math.max(0,(Date.now()-r.t0)/(3*36e3)))+'%"></i></div>'}
function ppStart(){ppS(PPI).t0=Date.now();save();ppTick()}
function ppStop(){ppS(PPI).t0=0;save();ppTick()}

function ppCard(sec,q){
  var key=sec+q.n,r=ppS(PPI),h='<div class="meta" style="margin:0 0 6px"><span class="eyebrow">Question '+q.n+'</span><span class="mk">['+(q.sub?q.sub.length+' × 1 = ':'')+q.m+']</span></div>';
  if(q.sub)h+='<p class="sub" style="margin:0 0 6px">In parts (i) to (xvii) choose the correct option; answer (xviii) to (xx) as instructed.</p>';
  if(q.sub){q.sub.forEach(function(s,i){h+=ppSub(key+'.'+i,s,i)});return h}
  q.alt.forEach(function(a,i){
    if(q.alt.length>1)h+=(i?'<div class="orx">OR</div>':'')+'<div class="altl">('+RN[i]+')</div>';
    h+='<div class="chipc">'+esc(a.c)+'</div><div class="qq ctext">'+esc(a.q)+'</div>';
    if(PPR[key])h+='<div class="expl"><div class="ansb"><small>Answer</small><div class="ctext">'+esc(a.ans)+'</div></div><h3>Marking scheme</h3><ol class="steps">'+a.s.map(function(st){var m=st.match(/^(.*)\s\[(\d)\]$/);return'<li>'+esc(m?m[1]:st)+(m?' <span class="mk">['+m[2]+']</span>':'')+'</li>'}).join('')+'</ol></div>'});
  h+='<div class="row2"><button class="btn alt" onclick="ppReveal(\''+key+'\')">'+(PPR[key]?'Hide answer':'Show answer')+'</button><button class="btn alt cl" onclick="ppCl(\''+key+'\')">'+(PPC[key]?'Close':'Claude marks it')+'</button></div>';
  if(PPC[key])h+=ppClBox(key,q);
  h+='<div class="mrow"><span>My marks</span><div class="mchips">';
  for(var m=0;m<=q.m;m++)h+='<button class="mc'+(r.mk[key]===m?' on':'')+'" onclick="ppMark(\''+key+'\','+m+')" aria-pressed="'+(r.mk[key]===m)+'">'+m+'</button>';
  h+='</div></div>';
  if(q.alt.length>1&&r.mk[key]!=null)h+='<div class="mrow"><span>I answered</span><div class="mchips">'+q.alt.map(function(_,i){return'<button class="mc'+((r.pk[key]||0)===i?' on':'')+'" onclick="ppAlt(\''+key+'\','+i+')">('+RN[i]+')</button>'}).join('')+'</div></div>';
  h+='<button class="link chatl" onclick="ppChat(\''+key+'\')">'+CHAT_ICON+' Discuss this question in Claude chat</button>';
  return h;
}
function ppSub(key,s,i){
  var r=ppS(PPI),done=r.mk[key]!=null,h='<div class="psub"><div class="qq ctext"><b>('+RN[i]+')</b> '+esc(s.q)+'</div>';
  if(s.o){s.o.forEach(function(o,k){var c='';if(done){if(k===s.a)c=' ok';else if(r.pk[key]===k)c=' bad'}
      h+='<button class="opt sm'+c+'" onclick="ppPick(\''+key+'\','+k+')"'+(done?' disabled':'')+'>('+'abcd'[k]+') '+esc(o)+'</button>'});
    if(done)h+='<div class="fb '+(r.mk[key]?'ok':'bad')+'"><b>'+(r.mk[key]?'1 mark.':'0 marks.')+'</b> '+esc(s.s)+'</div>'}
  else{
    if(PPR[key]||done)h+='<div class="ansb"><small>Answer</small><div>'+esc(s.ans)+'</div></div><p class="sub" style="margin:6px 0 0">'+esc(s.s)+'</p>';
    if(!PPR[key]&&!done)h+='<button class="btn alt" onclick="ppReveal(\''+key+'\')">Show answer</button>';
    else h+='<div class="mrow"><span>My mark</span><div class="mchips"><button class="mc'+(r.mk[key]===1?' on':'')+'" onclick="ppMark(\''+key+'\',1)">Got it · 1</button><button class="mc'+(r.mk[key]===0?' on':'')+'" onclick="ppMark(\''+key+'\',0)">Missed · 0</button></div></div>'}
  return h+'</div>';
}
function ppRe(key){var top=key.split('.')[0],f=ppFind(top),el=document.getElementById('c_'+sk(top));if(el){el.innerHTML=ppCard(top[0],f.q);ppWire()}var s=document.getElementById('ppSum');if(s)s.innerHTML=ppSumHtml(f.p)}
function ppReveal(key){PPR[key]=!PPR[key];ppRe(key)}
function ppPick(key,k){var f=ppFind(key),r=ppS(PPI);if(r.mk[key]!=null)return;r.pk[key]=k;r.mk[key]=k===f.sub.a?1:0;save();ppRe(key)}

function ppSumHtml(p){
  var r=ppS(p.id),sc=ppScore(p),keys=ppKeys(p),lost={},left=0;
  keys.forEach(function(k){if(r.mk[k]==null){left++;return}var c=ppChap(k,p);lost[c]=lost[c]||[0,0];lost[c][0]+=r.mk[k];lost[c][1]+=ppMax(k,p)});
  var h='<b>Your score</b><div class="stats" style="margin:10px 0"><div class="stat"><b>'+sc.got+'</b><span>marks scored</span></div><div class="stat"><b>'+sc.out+'</b><span>marks checked</span></div><div class="stat"><b>'+(sc.out?Math.round(sc.got/sc.out*100):0)+'%</b><span>so far</span></div></div>';
  var ch=Object.keys(lost);
  if(ch.length){h+='<div class="sub" style="margin:0 0 4px">By chapter</div>';ch.sort(function(a,b){return lost[a][0]/lost[a][1]-lost[b][0]/lost[b][1]}).forEach(function(c){var v=lost[c],pc=v[0]/v[1];
    h+='<div class="tbar"><span>'+esc(c)+'</span><span class="tr"><i style="width:'+Math.round(pc*100)+'%;background:'+(pc<.5?'var(--bad)':pc<.8?'var(--c4)':'var(--ok)')+'"></i></span><em>'+v[0]+'/'+v[1]+'</em></div>'})}
  else h+='<p class="sub" style="margin:0">Mark each question to see where marks were lost.</p>';
  if(r.best!=null)h+='<p class="sub" style="margin:8px 0 0">Best saved score: '+r.best+'/80</p>';
  h+='<button class="btn" onclick="ppFinish()"'+(sc.out?'':' disabled')+'>'+(left?'Save score ('+left+' parts unmarked)':'Save score')+'</button>';

  ppKeys(p).forEach(function(k){if(r.mk[k]==null)return;var c=ppChap(k),ok=r.mk[k]===ppMax(k);var f_=ppFind(k,p),al_=f_.sub||(f_.q.alt[r.pk[k]||0]||f_.q.alt[0]),mc_=!!(f_.sub&&f_.sub.o),ref_='pp:'+p.id+':'+k;

os 45°, which is not zero.", "", "√3/2 is cos 30°."], "s": ["1 − 2sin²A = cos 2A.", "cos 45° = 1/√2."]}, {"id": "tr15", "k": "k4", "l": 2, "q": "sin 75° + sin 15° equals", "o": ["√2", "√3/2", "1", "√6/2"], "a": 3, "t": ["Check: 2 sin 45° cos 30° = √6/2 ≈ 1.22, not √2 ≈ 1.41.", "You dropped the factor 2 sin 45° = √2.", "sin A + sin B is not sin(A + B).", ""], "s": ["sin C + sin D = 2 sin((C + D)/2) cos((C − D)/2).", "= 2 sin 45° cos 30° = 2 × (1/√2) × (√3/2) = √6/2."]}, {"id": "tr16", "k": "k4", "l": 2, "q": "(sin 5x + sin 3x)/(cos 5x + cos 3x) equals", "o": ["tan 4x", "tan x", "cot 4x", "tan 8x"], "a": 0, "t": ["", "The half-difference cos x cancels; the half-sum 4x stays.", "Sine on top, cosine below: tangent, not cotangent.", "Halve the sum: (5x + 3x)/2 = 4x."], "s": ["Top: 2 sin 4x cos x. Bottom: 2 cos 4x cos x.", "Cancel 2 cos x: tan 4x."]}, {"id": "tr17", "k": "k4", "l": 3, "q": "cos 20° + cos 100° + cos 140° equals", "o": ["0", "−1/2", "1", "1/2"], "a": 0, "t": ["", "The pair gives −cos 20°, which exactly cancels cos 20°.", "Pair cos 100° + cos 140° = −cos 20°; the total cancels.", "1/2 would need a leftover cos 60°."], "s": ["cos 100° + cos 140° = 2 cos 120° cos 20° = −cos 20°.", "So the sum is cos 20° − cos 20° = 0."]}, {"id": "tr18", "k": "k4", "l": 1, "q": "sin C + sin D equals", "o": ["2 cos((C + D)/2) sin((C − D)/2)", "2 sin((C + D)/2) cos((C − D)/2)", "2 cos((C + D)/2) cos((C − D)/2)", "2 sin((C + D)/2) sin((C − D)/2)"], "a": 1, "t": ["That is sin C − sin D.", "", "That is cos C + cos D.", "No sum formula has two sines on the right."], "s": ["Sum of sines: sine of the half-sum, cosine of the half-difference."]}, {"id": "tr19", "k": "k5", "l": 1, "q": "The general solution of sin x = 0 is", "o": ["x = (2n + 1)π/2", "x = nπ", "x = nπ/2", "x = 2nπ"], "a": 1, "t": ["Those are the zeros of cos x.", "", "nπ/2 includes π/2, where sin = 1.", "2nπ misses π, 3π, … where sine is also 0."], "s": ["Sine is zero at 0, π, 2π, … and the negatives.", "So x = nπ, n ∈ Z."]}, {"id": "tr20", "k": "k5", "l": 2, "q": "The general solution of cos x = −1/2 is", "o": ["x = nπ + (−1)ⁿ(2π/3)", "x = 2nπ ± π/3", "x = nπ ± 2π/3", "x = 2nπ ± 2π/3"], "a": 3, "t": ["That form is for sin x = sin α.", "cos π/3 = +1/2; the negative value needs 2π/3.", "The cosine form uses 2nπ, not nπ.", ""], "s": ["cos x = cos(2π/3).", "cos x = cos α ⇒ x = 2nπ ± α, so x = 2nπ ± 2π/3."]}, {"id": "tr21", "k": "k5", "l": 2, "q": "The solutions of tan x = −√3 in [0, 2π) are", "o": ["2π/3, 5π/3", "2π/3, 4π/3", "π/3, 4π/3", "5π/6, 11π/6"], "a": 0, "t": ["", "tan is positive at 4π/3 (Q3).", "Those solve tan x = +√3.", "Those solve tan x = −1/√3."], "s": ["Reference angle π/3; tan is negative in Q2 and Q4.", "x = π − π/3 = 2π/3 and x = 2π − π/3 = 5π/3."]}, {"id": "tr22", "k": "k5", "l": 3, "q": "The general solution of 2cos²x + 3 sin x = 0 is", "o": ["x = nπ + (−1)ⁿ π/6", "x = nπ + (−1)ⁿ⁺¹ π/6", "No solution", "x = nπ ± π/6"], "a": 1, "t": ["That solves sin x = +1/2; here sin x = −1/2.", "", "sin x = 2 is rejected, but sin x = −1/2 still gives solutions.", "The ± form belongs to cosine equations."], "s": ["2(1 − sin²x) + 3 sin x = 0 ⇒ 2sin²x − 3 sin x − 2 = 0.", "(2 sin x + 1)(sin x − 2) = 0, and sin x = 2 is impossible.", "sin x = −1/2 = sin(−π/6) ⇒ x = nπ + (−1)ⁿ(−π/6)."]}]}, {"id": "qe", "n": "Quadratic Equations", "k": [{"id": "k1", "n": "Discriminant and nature of roots", "s": "D = b² − 4ac: D > 0 real and distinct, D = 0 real and equal, D < 0 non-real (complex conjugate pair)."}, {"id": "k2", "n": "Sum and product of roots", "s": "α + β = −b/a and αβ = c/a. Express anything symmetric in α, β using these two."}, {"id": "k3", "n": "Forming a new equation", "s": "A quadratic with roots p and q is x² − (p + q)x + pq = 0."}, {"id": "k4", "n": "Conditions on the roots", "s": "Translate the condition (difference, ratio, common root, signs) into sum and product, then solve."}, {"id": "k5", "n": "Maximum, minimum and sign", "s": "Complete the square: a(x + b/2a)² − D/4a. If a > 0 and D < 0, the expression is positive for all x."}], "q": [{"id": "qe1", "k": "k1", "l": 1, "q": "The roots of 2x² − 3x + 5 = 0 are", "o": ["Rational", "Real and distinct", "Real and equal", "Non-real (complex)"], "a": 3, "t": ["Rational roots need D to be a perfect square ≥ 0.", "D = 9 − 40 = −31 < 0.", "D would have to be 0.", ""], "s": ["D = (−3)² − 4(2)(5) = −31.", "D < 0, so the roots are a complex conjugate pair."]}, {"id": "qe2", "k": "k1", "l": 2, "q": "x² − 4x + k = 0 has real and equal roots when k =", "o": ["−4", "4", "2", "16"], "a": 1, "t": ["D = 16 − 4k = 0 gives k = +4.", "", "Check: x² − 4x + 2 has D = 8 > 0.", "You used D = b² − k instead of b² − 4ac."], "s": ["Equal roots ⇔ D = 0.", "16 − 4k = 0 ⇒ k = 4 (root x = 2, twice)."]}, {"id": "qe3", "k": "k1", "l": 2, "q": "x² + kx + 9 = 0 has real roots when", "o": ["k ≥ 6 only", "k ≤ −6 or k ≥ 6", "−6 ≤ k ≤ 6", "k > 6"], "a": 1, "t": ["k² ≥ 36 also allows negative k ≤ −6.", "", "That is where D ≤ 0, the opposite condition.", "k = ±6 give real (equal) roots too, and k ≤ −6 works."], "s": ["Real roots ⇔ D = k² − 36 ≥ 0.", "k² ≥ 36 ⇒ k ≤ −6 or k ≥ 6."], "f": {"k": "nline", "r": [-10, 10], "pts": [[-6, "−6", 2], [6, "6", 2], [0, "0: no real roots", 5]]}}, {"id": "qe4", "k": "k1", "l": 3, "q": "(k + 1)x² + 2(k + 3)x + (k + 8) = 0 has equal roots when k =", "o": ["1", "−1/3", "3", "1/3"], "a": 3, "t": ["Check k = 1: D/4 = 16 − 18 = −2 ≠ 0.", "Sign slip: −3k + 1 = 0 gives k = +1/3.", "You may have used D = b² + 4ac.", ""], "s": ["D/4 = (k + 3)² − (k + 1)(k + 8).", "= k² + 6k + 9 − (k² + 9k + 8) = −3k + 1.", "−3k + 1 = 0 ⇒ k = 1/3."]}, {"id": "qe5", "k": "k2", "l": 1, "q": "The sum of the roots of 3x² − 5x + 2 = 0 is", "o": ["5/3", "−5/3", "5/2", "2/3"], "a": 0, "t": ["", "Sum = −b/a = −(−5)/3 = +5/3.", "Divide by a = 3, not by c.", "2/3 is the product c/a."], "s": ["α + β = −b/a = 5/3."]}, {"id": "qe6", "k": "k2", "l": 2, "q": "If α, β are the roots of x² − 5x + 3 = 0, then α² + β² =", "o": ["19", "22", "25", "31"], "a": 0, "t": ["", "You subtracted αβ once; the identity needs 2αβ.", "25 is (α + β)²; subtract 2αβ.", "You added 2αβ instead of subtracting."], "s": ["α + β = 5, αβ = 3.", "α² + β² = (α + β)² − 2αβ = 25 − 6 = 19."]}, {"id": "qe7", "k": "k2", "l": 2, "q": "If α, β are the roots of x² − 3x + 1 = 0, then 1/α + 1/β =", "o": ["−3", "1/3", "1", "3"], "a": 3, "t": ["α + β = +3 here.", "1/α + 1/β = (α + β)/αβ, not αβ/(α + β).", "That is αβ.", ""], "s": ["1/α + 1/β = (α + β)/(αβ) = 3/1 = 3."]}, {"id": "qe8", "k": "k2", "l": 3, "q": "If α, β are the roots of x² − 2x + 4 = 0, then α³ + β³ =", "o": ["8", "−16", "32", "−8"], "a": 1, "t": ["8 is (α + β)³; subtract 3αβ(α + β).", "", "You added 3αβ(α + β) instead of subtracting.", "3αβ(α + β) = 24, not 16."], "s": ["α + β = 2, αβ = 4.", "α³ + β³ = (α + β)³ − 3αβ(α + β) = 8 − 24 = −16."]}, {"id": "qe9", "k": "k3", "l": 1, "q": "The quadratic with roots 2 and −3 is", "o": ["x² − x + 6 = 0", "x² − x − 6 = 0", "x² + x + 6 = 0", "x² + x − 6 = 0"], "a": 3, "t": ["Both sum and product signs are off.", "Sum = −1, so the x-term is −(−1)x = +x.", "Product 2 × (−3) = −6, not +6.", ""], "s": ["Sum = −1, product = −6.", "x² − (−1)x + (−6) = x² + x − 6 = 0."]}, {"id": "qe10", "k": "k3", "l": 2, "q": "The equation whose roots are the reciprocals of the roots of 2x² − 5x + 3 = 0 is", "o": ["3x² − 5x + 2 = 0", "3x² + 5x + 2 = 0", "2x² + 5x + 3 = 0", "5x² − 2x + 3 = 0"], "a": 0, "t": ["", "Swap a and c but keep b = −5.", "Reciprocal roots swap a and c; they do not change the sign of b.", "Only a and c swap."], "s": ["Replace x by 1/x: 2/x² − 5/x + 3 = 0.", "Multiply by x²: 3x² − 5x + 2 = 0."]}, {"id": "qe11", "k": "k3", "l": 3, "q": "If α, β are the roots of x² − 3x + 1 = 0, the equation with roots α² and β² is", "o": ["x² − 7x − 1 = 0", "x² − 9x + 1 = 0", "x² − 7x + 1 = 0", "x² + 7x + 1 = 0"], "a": 2, "t": ["α²β² = (αβ)² = 1, positive.", "α² + β² = 9 − 2 = 7, not 9.", "", "The x-coefficient is −(sum) = −7."], "s": ["α² + β² = (α + β)² − 2αβ = 9 − 2 = 7.", "α²β² = 1.", "x² − 7x + 1 = 0."]}, {"id": "qe12", "k": "k3", "l": 2, "q": "The equation whose roots are double the roots of x² − 4x + 3 = 0 is", "o": ["x² − 8x + 6 = 0", "x² − 4x + 12 = 0", "x² − 8x + 12 = 0", "2x² − 8x + 6 = 0"], "a": 2, "t": ["Product becomes 4 × 3 = 12 (each root doubled).", "The sum doubles too: 8, not 4.", "", "Multiplying the equation by 2 does not change its roots."], "s": ["Roots 1 and 3 become 2 and 6.", "Sum 8, product 12: x² − 8x + 12 = 0."]}, {"id": "qe13", "k": "k4", "l": 2, "q": "If the roots of x² + px + 12 = 0 differ by 1, then p =", "o": ["±1", "±12", "±7", "±5"], "a": 2, "t": ["The difference is 1; p is the sum (with a sign).", "12 is the product.", "", "(α − β)² = p² − 48 = 1 gives p² = 49."], "s": ["(α − β)² = (α + β)² − 4αβ = p² − 48.", "p² − 48 = 1 ⇒ p = ±7 (roots 3, 4 or −3, −4)."]}, {"id": "qe14", "k": "k4", "l": 2, "q": "x² − 2x + k = 0 has roots of opposite signs when", "o": ["k > 0", "k > 1", "k < 0", "k < 1"], "a": 2, "t": ["k > 0 gives roots of the same sign.", "k > 1 gives non-real roots.", "", "k < 1 only makes the roots real."], "s": ["Opposite signs ⇔ product of roots < 0.", "Product = k, so k < 0 (then D > 0 automatically)."]}, {"id": "qe15", "k": "k4", "l": 3, "q": "x² + ax + b = 0 and x² + bx + a = 0 (a ≠ b) have a common root. Then a + b =", "o": ["−1", "0", "1", "ab"], "a": 0, "t": ["", "Put x = 1: 1 + a + b = 0.", "Subtracting gives (a − b)x = a − b, so the common root is 1.", "The condition involves a + b, not ab."], "s": ["Subtract: (a − b)x + (b − a) = 0 ⇒ x = 1.", "Put x = 1: 1 + a + b = 0 ⇒ a + b = −1."]}, {"id": "qe16", "k": "k4", "l": 3, "q": "If one root of x² − px + q = 0 is twice the other, then", "o": ["9p² = 2q", "p² = 9q", "p² = 2q", "2p² = 9q"], "a": 3, "t": ["You swapped the coefficients.", "Roots α, 2α give 3α = p and 2α² = q; the 2 stays.", "The sum is 3α, not 2α.", ""], "s": ["3α = p, 2α² = q.", "α = p/3 ⇒ q = 2p²/9 ⇒ 2p² = 9q."]}, {"id": "qe17", "k": "k5", "l": 1, "q": "The minimum value of x² − 6x + 10 is", "o": ["1", "10", "−1", "3"], "a": 0, "t": ["", "10 is the value at x = 0, not the minimum.", "(x − 3)² + 1 ≥ 1, never −1.", "3 is where the minimum occurs, not its value."], "s": ["x² − 6x + 10 = (x − 3)² + 1.", "Minimum 1 at x = 3."], "f": {"k": "plane", "x": [-1, 6], "y": [-1, 11], "el": [{"fn": "x*x-6*x+10", "c": 1, "w": 3}, {"p": [3, 1], "l": "(3, 1)", "c": 2}]}}, {"id": "qe18", "k": "k5", "l": 2, "q": "2x² + kx + 2 > 0 for all real x when", "o": ["−4 < k < 4", "k < −4 or k > 4", "−2 < k < 2", "k > 4"], "a": 0, "t": ["", "That is where D > 0.", "D = k² − 16 < 0 allows |k| up to 4.", "k > 4 makes D > 0, so the graph dips below 0."], "s": ["a = 2 > 0, so we need D < 0.", "k² − 16 < 0 ⇒ −4 < k < 4."]}, {"id": "qe19", "k": "k5", "l": 3, "q": "For real x, the range of (x² − x + 1)/(x² + x + 1) is", "o": ["[1/3, 3]", "[0, 3]", "(1/3, 3)", "[1/3, 1]"], "a": 0, "t": ["", "The numerator is always positive, so 0 is never reached.", "Both ends are reached (x = 1 and x = −1).", "At x = −1 the value is 3."], "s": ["Put y = (x² − x + 1)/(x² + x + 1): (y − 1)x² + (y + 1)x + (y − 1) = 0.", "x real ⇒ (y + 1)² − 4(y − 1)² ≥ 0 ⇒ 3y² − 10y + 3 ≤ 0.", "1/3 ≤ y ≤ 3."]}, {"id": "qe20", "k": "k5", "l": 2, "q": "The maximum value of 4x − x² − 1 is", "o": ["2", "−1", "3", "4"], "a": 2, "t": ["2 is where the maximum occurs.", "−1 is the value at x = 0.", "", "4 ignores the constant −1."], "s": ["4x − x² − 1 = −(x − 2)² + 3.", "Maximum 3 at x = 2."]}]}, {"id": "cx", "n": "Complex Numbers", "k": [{"id": "k1", "n": "Powers of i and algebra", "s": "i² = −1 and powers of i repeat every 4: i, −1, −i, 1. Expand like algebra, then replace i²."}, {"id": "k2", "n": "Conjugate, modulus, division", "s": "|a + ib| = √(a² + b²); z z̄ = |z|². Divide by multiplying top and bottom by the conjugate."}, {"id": "k3", "n": "Argument and polar form", "s": "Find the acute angle from |b/a|, then place it by quadrant. Principal argument lies in (−π, π]."}, {"id": "k4", "n": "Square roots and equations", "s": "Set (x + iy)² = a + ib; use x² − y² = a, 2xy = b and x² + y² = |a + ib|. D < 0 gives complex roots."}, {"id": "k5", "n": "Cube roots of unity and loci", "s": "1 + ω + ω² = 0, ω³ = 1. |z − a| is the distance from z to a."}], "q": [{"id": "cx1", "k": "k1", "l": 1, "q": "i⁴³ equals", "o": ["1", "−1", "−i", "i"], "a": 2, "t": ["Remainder 3, not 0.", "Remainder 3, not 2.", "", "43 leaves remainder 3 on division by 4, and i³ = −i."], "s": ["43 = 4 × 10 + 3.", "i⁴³ = i³ = −i."], "f": {"k": "icycle", "n": 43}}, {"id": "cx2", "k": "k1", "l": 1, "q": "(2 + 3i)(1 − i) equals", "o": ["2 − 3i", "5 − i", "5 + i", "−1 + i"], "a": 2, "t": ["That is not a product; it is the conjugate of 2 + 3i.", "Check the i terms: −2i + 3i = +i.", "", "You took i² = +1."], "s": ["2 − 2i + 3i − 3i².", "= 2 + i + 3 = 5 + i."]}, {"id": "cx3", "k": "k1", "l": 2, "q": "i + i² + i³ + … + i¹⁰⁰ equals", "o": ["0", "i", "−1", "1"], "a": 0, "t": ["", "No terms are left over after 25 blocks.", "No terms are left over after 25 blocks.", "Every block of four sums to 0, and 100 terms is 25 full blocks."], "s": ["i + i² + i³ + i⁴ = i − 1 − i + 1 = 0.", "100 terms = 25 such blocks, so the sum is 0."]}, {"id": "cx4", "k": "k1", "l": 3, "q": "(1 + i)¹⁰ equals", "o": ["32", "−32i", "1024", "32i"], "a": 3, "t": ["You lost the i: (2i)⁵ = 32i.", "(2i)⁵ = 32 i⁵ = 32i; i⁵ = +i.", "|1 + i|¹⁰ = 32, not 2¹⁰.", ""], "s": ["(1 + i)² = 2i.", "(1 + i)¹⁰ = (2i)⁵ = 32 i⁵ = 32i."]}, {"id": "cx5", "k": "k2", "l": 1, "q": "|3 − 4i| equals", "o": ["5", "7", "25", "−5"], "a": 0, "t": ["", "Square, add, then take the root; do not add 3 + 4.", "25 is |z|²; take the square root.", "A modulus is never negative."], "s": ["√(3² + 4²) = √25 = 5."]}, {"id": "cx6", "k": "k2", "l": 2, "q": "(1 + i)/(1 − i) equals", "o": ["0", "i", "1", "−i"], "a": 1, "t": ["The numerator is not zero.", "", "The modulus is 1, but the value is i.", "(1 + i)² = 2i, positive."], "s": ["Multiply by (1 + i)/(1 + i).", "(1 + i)²/2 = 2i/2 = i."]}, {"id": "cx7", "k": "k2", "l": 2, "q": "The multiplicative inverse of 3 + 4i is", "o": ["(3 − 4i)/25", "(3 − 4i)/5", "3 − 4i", "(−3 + 4i)/25"], "a": 0, "t": ["", "Divide by |z|² = 25, not |z| = 5.", "That is only the conjugate.", "The real part stays positive."], "s": ["1/z = z̄/|z|².", "= (3 − 4i)/25."]}, {"id": "cx8", "k": "k2", "l": 3, "q": "z = x + iy with y > 0, z + z̄ = 6 and z z̄ = 13. Then z =", "o": ["3 + 2i", "3 − 2i", "2 + 3i", "6 + 13i"], "a": 0, "t": ["", "y > 0 is given.", "z + z̄ = 2x = 6 gives x = 3.", "z + z̄ and z z̄ are not the parts of z."], "s": ["z + z̄ = 2x = 6 ⇒ x = 3.", "z z̄ = x² + y² = 13 ⇒ y² = 4, y = 2.", "z = 3 + 2i."]}, {"id": "cx9", "k": "k3", "l": 1, "q": "The principal argument of i is", "o": ["−π/2", "π", "0", "π/2"], "a": 3, "t": ["−π/2 is the argument of −i.", "π is the argument of negative real numbers.", "0 is the argument of positive real numbers.", ""], "s": ["i is on the positive imaginary axis.", "arg i = π/2."]}, {"id": "cx10", "k": "k3", "l": 2, "q": "The principal argument of −1 + i√3 is", "o": ["π/3", "−π/3", "−2π/3", "2π/3"], "a": 3, "t": ["π/3 is only the acute angle; the point is in Q2.", "The point is above the real axis, so the argument is positive.", "That would be in Q3.", ""], "s": ["Acute angle: tan α = √3 ⇒ α = π/3.", "Q2: arg = π − π/3 = 2π/3."], "f": {"k": "plane", "x": [-2.4, 2.4], "y": [-0.8, 2.4], "ax": ["Re", "Im"], "el": [{"seg": [[0, 0], [-1, 1.732]], "c": 1, "w": 3}, {"arc": [0, 0, 0.55, 0, 120], "c": 2, "l": "2π/3", "lp": [0.3, 0.75]}, {"p": [-1, 1.732], "l": "−1 + √3 i", "c": 1, "lp": [-1.9, 2.05]}]}}, {"id": "cx11", "k": "k3", "l": 2, "q": "The polar form of −2 − 2i is", "o": ["2(cos π/4 + i sin π/4)", "2√2(cos(−3π/4) + i sin(−3π/4))", "2√2(cos π/4 + i sin π/4)", "2√2(cos 3π/4 + i sin 3π/4)"], "a": 1, "t": ["The modulus is √8 = 2√2.", "", "π/4 is in Q1.", "3π/4 is in Q2; −2 − 2i is in Q3."], "s": ["r = √(4 + 4) = 2√2.", "Q3: arg = −(π − π/4) = −3π/4."]}, {"id": "cx12", "k": "k3", "l": 3, "q": "If arg z = π/3, then arg z̄ =", "o": ["2π/3", "4π/3", "π/3", "−π/3"], "a": 3, "t": ["That would be reflection in the imaginary axis.", "4π/3 is outside (−π, π].", "Conjugation reflects z in the real axis, flipping the sign.", ""], "s": ["z̄ is the mirror image of z in the real axis.", "arg z̄ = −arg z = −π/3."]}, {"id": "cx13", "k": "k4", "l": 2, "q": "The square roots of 3 + 4i are", "o": ["±(1 + 2i)", "±(2 − i)", "±√7", "±(2 + i)"], "a": 3, "t": ["(1 + 2i)² = −3 + 4i.", "(2 − i)² = 3 − 4i.", "You cannot take roots of the parts separately.", ""], "s": ["x² − y² = 3, 2xy = 4, x² + y² = 5.", "x² = 4, y² = 1, xy > 0: ±(2 + i)."]}, {"id": "cx14", "k": "k4", "l": 1, "q": "The roots of x² + 4 = 0 are", "o": ["±4i", "No roots", "±2", "±2i"], "a": 3, "t": ["(4i)² = −16.", "There are no real roots, but there are complex ones.", "(±2)² = 4, not −4.", ""], "s": ["x² = −4 ⇒ x = ±√(−4) = ±2i."]}, {"id": "cx15", "k": "k4", "l": 2, "q": "The roots of x² + x + 1 = 0 are", "o": ["(−1 ± √3)/2", "(1 ± i√3)/2", "No solution", "(−1 ± i√3)/2"], "a": 3, "t": ["D = −3 < 0, so √D needs i.", "The formula starts with −b = −1.", "D < 0 means complex roots, not no roots.", ""], "s": ["D = 1 − 4 = −3.", "x = (−1 ± i√3)/2."]}, {"id": "cx16", "k": "k4", "l": 3, "q": "Real x, y with (x + iy)(2 − 3i) = 4 + i are", "o": ["x = 5/13, y = 14/13", "x = 2, y = −1/3", "x = 11/13, y = 14/13", "x = 5/13, y = −14/13"], "a": 0, "t": ["", "You divided part by part, which is not allowed.", "Check the real part: (8 + 3i²)/13 = 5/13.", "Sign slip in the imaginary part."], "s": ["x + iy = (4 + i)/(2 − 3i) = (4 + i)(2 + 3i)/13.", "= (8 + 14i − 3)/13 = (5 + 14i)/13."]}, {"id": "cx17", "k": "k5", "l": 1, "q": "If ω is a non-real cube root of unity, 1 + ω + ω² =", "o": ["0", "1", "3", "−1"], "a": 0, "t": ["", "3 is 1 + 1 + 1, true only for the real root 1.", "They sum to 0.", "The three cube roots of 1 always add to 0."], "s": ["ω³ − 1 = (ω − 1)(ω² + ω + 1) = 0 and ω ≠ 1.", "So 1 + ω + ω² = 0."]}, {"id": "cx18", "k": "k5", "l": 2, "q": "(1 + ω − ω²)(1 − ω + ω²) equals", "o": ["0", "1", "4", "−4"], "a": 2, "t": ["Replace 1 + ω by −ω² first; it does not vanish.", "The product is 4ω³ = 4.", "", "(−2ω²)(−2ω) is positive."], "s": ["1 + ω = −ω², so the first bracket is −2ω².", "1 + ω² = −ω, so the second is −2ω.", "Product = 4ω³ = 4."]}, {"id": "cx19", "k": "k5", "l": 2, "q": "The locus of z with |z − 2| = |z + 2| is", "o": ["The imaginary axis", "A circle of radius 2", "The real axis", "The line x = 2"], "a": 0, "t": ["", "It is a line, not a circle.", "Points equidistant from 2 and −2 lie on their perpendicular bisector, x = 0.", "x = 2 passes through one of the points."], "s": ["|z − 2| and |z + 2| are distances to 2 and −2.", "Equal distances ⇒ perpendicular bisector: x = 0."], "f": {"k": "plane", "x": [-3.5, 3.5], "y": [-2.5, 2.5], "ax": ["Re", "Im"], "el": [{"ln": [1, 0, 0], "c": 1, "w": 3, "l": "x = 0"}, {"p": [2, 0], "l": "2", "c": 2}, {"p": [-2, 0], "l": "−2", "c": 2}, {"p": [0, 1.5], "l": "z", "c": 3}, {"seg": [[0, 1.5], [2, 0]], "c": 3, "dash": 1}, {"seg": [[0, 1.5], [-2, 0]], "c": 3, "dash": 1}]}}, {"id": "cx20", "k": "k5", "l": 3, "q": "ω²⁰²⁶ + ω²⁰²⁷ + 1 equals", "o": ["2", "0", "1", "−1"], "a": 1, "t": ["Reduce the powers mod 3 first.", "", "2026 and 2027 reduce to powers 1 and 2, giving 1 + ω + ω².", "Reduce the powers mod 3 first."], "s": ["2026 = 3 × 675 + 1 ⇒ ω²⁰²⁶ = ω.", "2027 ⇒ ω².", "ω + ω² + 1 = 0."]}]}, {"id": "cs", "n": "Conic Sections", "k": [{"id": "k1", "n": "Parabola standard forms", "s": "y² = 4ax opens right: focus (a, 0), directrix x = −a. x² = 4ay opens up. A minus sign flips the direction."}, {"id": "k2", "n": "Ellipse: a, b, c, e", "s": "x²/a² + y²/b² = 1 with a > b: c² = a² − b², e = c/a < 1. The larger denominator decides the major axis."}, {"id": "k3", "n": "Hyperbola: a, b, c, e", "s": "x²/a² − y²/b² = 1: c² = a² + b², e = c/a > 1. The positive term decides the transverse axis."}, {"id": "k4", "n": "Latus rectum and directrix", "s": "Parabola: latus rectum 4a. Ellipse and hyperbola: latus rectum 2b²/a, directrices x = ±a/e."}, {"id": "k5", "n": "Finding the equation", "s": "Decide the type and orientation, write the standard form, then use the given data to find a and b."}], "q": [{"id": "cs1", "k": "k1", "l": 1, "q": "The focus of y² = 8x is", "o": ["(0, 2)", "(−2, 0)", "(2, 0)", "(8, 0)"], "a": 2, "t": ["y² means the axis is the x-axis.", "+8x opens to the right.", "", "4a = 8 gives a = 2; the focus is (a, 0)."], "s": ["Compare with y² = 4ax: a = 2.", "Focus (a, 0) = (2, 0)."], "f": {"k": "plane", "x": [-3, 7], "y": [-6, 6], "el": [{"pa": ["t*t/8", "t"], "t": [-7, 7], "c": 1, "w": 3}, {"p": [2, 0], "l": "focus (2, 0)", "c": 2}, {"ln": [1, 0, 2], "c": 5, "dash": 1, "l": "x = −2"}]}}, {"id": "cs2", "k": "k1", "l": 1, "q": "The directrix of x² = −12y is", "o": ["x = −3", "y = 3", "y = −3", "x = 3"], "a": 1, "t": ["The directrix is a horizontal line here.", "", "It opens downward, so the directrix is above the vertex.", "x² means the axis is vertical, so the directrix is horizontal."], "s": ["x² = −4ay with a = 3: opens down, focus (0, −3).", "Directrix y = 3."]}, {"id": "cs3", "k": "k1", "l": 2, "q": "The axis of the parabola x² = 6y is", "o": ["y = 6", "The x-axis", "x = 6", "The y-axis"], "a": 3, "t": ["The axis is a line through the vertex.", "x² = 4ay has the y-axis as its axis.", "The axis is a line through the vertex.", ""], "s": ["x² = 4ay opens up along the y-axis (x = 0)."]}, {"id": "cs4", "k": "k1", "l": 3, "q": "The vertex of (y − 2)² = 8(x + 3) is", "o": ["(−3, −2)", "(−3, 2)", "(2, −3)", "(3, −2)"], "a": 1, "t": ["y − 2 gives y = +2.", "", "The y-value comes from y − 2.", "Shifts flip sign: x + 3 means x = −3."], "s": ["Put X = x + 3, Y = y − 2: Y² = 8X.", "Vertex at X = Y = 0: (−3, 2)."]}, {"id": "cs5", "k": "k2", "l": 1, "q": "For x²/25 + y²/16 = 1,", "o": ["a = 5, b = 4, c = √41", "a = 5, b = 4, c = 3", "a = 5, b = 4, c = 9", "a = 25, b = 16, c = 9"], "a": 1, "t": ["For an ellipse c² = a² − b² (minus).", "", "c = √9 = 3.", "a and b are square roots of the denominators."], "s": ["a² = 25, b² = 16.", "c² = 25 − 16 = 9, c = 3."]}, {"id": "cs6", "k": "k2", "l": 2, "q": "The eccentricity of x²/25 + y²/16 = 1 is", "o": ["3/5", "4/5", "√41/5", "5/3"], "a": 0, "t": ["", "e = c/a; b/a = 4/5 is not e.", "Ellipse uses c² = a² − b².", "An ellipse has e < 1."], "s": ["c = 3, a = 5.", "e = 3/5."], "f": {"k": "plane", "x": [-6.5, 6.5], "y": [-4.6, 4.6], "el": [{"pa": ["5*Math.cos(t)", "4*Math.sin(t)"], "t": [0, 6.3], "c": 1, "w": 3}, {"p": [3, 0], "l": "(3, 0)", "c": 2}, {"p": [-3, 0], "l": "(−3, 0)", "c": 2}]}}, {"id": "cs7", "k": "k2", "l": 2, "q": "The major axis of 9x² + 4y² = 36 lies along", "o": ["the line y = x", "the y-axis", "neither axis", "the x-axis"], "a": 1, "t": ["The larger denominator decides.", "", "Standard ellipses have axes along x and y.", "After dividing: x²/4 + y²/9 = 1; 9 > 4 sits under y²."], "s": ["Divide by 36: x²/4 + y²/9 = 1.", "The larger denominator (9) is under y², so the major axis is the y-axis."]}, {"id": "cs8", "k": "k2", "l": 3, "q": "The ellipse with foci (±4, 0) and vertices (±5, 0) is", "o": ["x²/25 + y²/16 = 1", "x²/25 + y²/9 = 1", "x²/25 + y²/41 = 1", "x²/16 + y²/9 = 1"], "a": 1, "t": ["16 is c², not b².", "", "For an ellipse b² = a² − c².", "a = 5, so 25 goes under x²."], "s": ["a = 5, c = 4.", "b² = 25 − 16 = 9.", "x²/25 + y²/9 = 1."]}, {"id": "cs9", "k": "k3", "l": 1, "q": "For x²/9 − y²/16 = 1, c =", "o": ["7", "25", "5", "√7"], "a": 2, "t": ["c² = 25, so c = 5.", "25 is c².", "", "√7 comes from subtracting; a hyperbola adds."], "s": ["c² = a² + b² = 9 + 16 = 25, c = 5."]}, {"id": "cs10", "k": "k3", "l": 2, "q": "The eccentricity of x²/9 − y²/16 = 1 is", "o": ["4/3", "√7/3", "5/3", "3/5"], "a": 2, "t": ["e = c/a, not b/a.", "Hyperbola uses c² = a² + b².", "", "A hyperbola has e > 1."], "s": ["c = 5, a = 3.", "e = 5/3."], "f": {"k": "plane", "x": [-8, 8], "y": [-7, 7], "el": [{"pa": ["3*Math.cosh(t)", "4*Math.sinh(t)"], "t": [-1.6, 1.6], "c": 1, "w": 3}, {"pa": ["-3*Math.cosh(t)", "4*Math.sinh(t)"], "t": [-1.6, 1.6], "c": 1, "w": 3}, {"p": [5, 0], "l": "(5, 0)", "c": 2}, {"p": [-5, 0], "l": "(−5, 0)", "c": 2}]}}, {"id": "cs11", "k": "k3", "l": 2, "q": "The foci of y²/16 − x²/9 = 1 are", "o": ["(±5, 0)", "(0, ±5)", "(0, ±4)", "(0, ±√7)"], "a": 1, "t": ["The y² term is positive, so the foci are on the y-axis.", "", "(0, ±4) are the vertices.", "A hyperbola adds: c² = 16 + 9."], "s": ["Transverse axis along y; c² = 16 + 9 = 25.", "Foci (0, ±5)."]}, {"id": "cs12", "k": "k3", "l": 3, "q": "The eccentricity of the rectangular hyperbola x² − y² = a² is", "o": ["1/√2", "2", "1", "√2"], "a": 3, "t": ["A hyperbola has e > 1.", "e² = 2, so e = √2.", "e = 1 is a parabola.", ""], "s": ["b = a, so c² = 2a².", "e = c/a = √2."]}, {"id": "cs13", "k": "k4", "l": 1, "q": "The length of the latus rectum of y² = 12x is", "o": ["4", "3", "12", "6"], "a": 2, "t": ["4 is the coefficient form 4a; here 4a = 12.", "3 is a, the focal distance.", "", "The latus rectum is 4a, not 2a."], "s": ["4a = 12.", "Latus rectum = 4a = 12."]}, {"id": "cs14", "k": "k4", "l": 2, "q": "The length of the latus rectum of x²/36 + y²/16 = 1 is", "o": ["16/3", "32/3", "8/3", "18"], "a": 0, "t": ["", "2b²/a = 32/6; simplify.", "You halved twice.", "You swapped a and b."], "s": ["a = 6, b = 4.", "2b²/a = 32/6 = 16/3."]}, {"id": "cs15", "k": "k4", "l": 2, "q": "The directrices of x²/25 + y²/9 = 1 are", "o": ["x = ±4", "x = ±5", "x = ±25/4", "x = ±16/5"], "a": 2, "t": ["x = ±4 gives the foci.", "x = ±5 are the vertices.", "", "a/e = 5/(4/5) = 25/4."], "s": ["c = 4, e = 4/5.", "Directrices x = ±a/e = ±25/4."]}, {"id": "cs16", "k": "k4", "l": 3, "q": "The latus rectum of an ellipse equals half its minor axis. Its eccentricity is", "o": ["1/√2", "1/2", "3/4", "√3/2"], "a": 3, "t": ["That would need b/a = 1/√2.", "2b²/a = b gives b/a = 1/2, not e = 1/2.", "e² = 3/4, so e = √3/2.", ""], "s": ["2b²/a = b ⇒ b/a = 1/2.", "e² = 1 − b²/a² = 1 − 1/4 = 3/4.", "e = √3/2."]}, {"id": "cs17", "k": "k5", "l": 1, "q": "The parabola with vertex at the origin and focus (0, −3) is", "o": ["y² = −12x", "x² = −12y", "x² = −3y", "x² = 12y"], "a": 1, "t": ["Focus on the y-axis means x² = …", "", "4a = 12, not 3.", "Focus below the vertex: it opens down."], "s": ["Focus (0, −a) with a = 3: x² = −4ay.", "x² = −12y."]}, {"id": "cs18", "k": "k5", "l": 2, "q": "The parabola with vertex at the origin, axis along the x-axis, passing through (2, 3), is", "o": ["y² = 9x", "2y² = 9x", "2x² = 9y", "3y² = 2x"], "a": 1, "t": ["9 = 4a × 2 gives 4a = 9/2, not 9.", "", "Axis along x means y² = 4ax.", "Substitute the point correctly: 9 = 4a(2)."], "s": ["y² = 4ax through (2, 3): 9 = 8a.", "4a = 9/2: y² = 9x/2, i.e. 2y² = 9x."]}, {"id": "cs19", "k": "k5", "l": 2, "q": "The hyperbola with vertices (±2, 0) and foci (±3, 0) is", "o": ["x²/4 − y²/5 = 1", "x²/4 − y²/9 = 1", "x²/9 − y²/4 = 1", "x²/4 + y²/5 = 1"], "a": 0, "t": ["", "b² = c² − a² = 5, not c².", "a = 2 belongs under x².", "A hyperbola has a minus sign."], "s": ["a = 2, c = 3.", "b² = 9 − 4 = 5.", "x²/4 − y²/5 = 1."]}, {"id": "cs20", "k": "k5", "l": 3, "q": "The ellipse with centre at the origin, foci on the x-axis, e = 1/2 and latus rectum 3 is", "o": ["x²/3 + y²/4 = 1", "x²/4 + y²/2 = 1", "x²/16 + y²/12 = 1", "x²/4 + y²/3 = 1"], "a": 3, "t": ["Foci on the x-axis need the larger denominator under x².", "Check e: 1 − 2/4 = 1/2, so e = 1/√2.", "Check the latus rectum: 2(12)/4 = 6, not 3.", ""], "s": ["b² = a²(1 − e²) = 3a²/4.", "2b²/a = 3a/2 = 3 ⇒ a = 2, b² = 3.", "x²/4 + y²/3 = 1."]}]}, {"id": "pc", "n": "Permutations and Combinations", "k": [{"id": "k1", "n": "Fundamental counting principle", "s": "AND means multiply, OR means add. Fill the restricted place first."}, {"id": "k2", "n": "Permutations (arrangements)", "s": "ⁿP_r = n!/(n − r)! counts ordered arrangements of r things from n different things."}, {"id": "k3", "n": "Repeated letters and restrictions", "s": "Divide by the factorial of each repeat count. \"Together\": glue into a block. \"Not together\": arrange the others, then use the gaps."}, {"id": "k4", "n": "Combinations (selections)", "s": "ⁿC_r = n!/(r!(n − r)!) counts selections where order does not matter. \"At least\" is often easiest as total minus the opposite."}, {"id": "k5", "n": "Circles and geometric counts", "s": "n things in a circle: (n − 1)!; a necklace: (n − 1)!/2. Lines from points: ⁿC₂; diagonals: ⁿC₂ − n."}], "q": [{"id": "pc1", "k": "k1", "l": 1, "q": "With 3 shirts and 4 pairs of trousers, the number of different outfits is", "o": ["7", "12", "34", "81"], "a": 1, "t": ["Shirt AND trousers: multiply, not add.", "", "There is no such count.", "That would be 3⁴."], "s": ["Choose a shirt (3 ways) and trousers (4 ways).", "3 × 4 = 12."]}, {"id": "pc2", "k": "k1", "l": 2, "q": "How many 3-digit numbers can be formed from 1, 2, 3, 4, 5 if digits may repeat?", "o": ["15", "60", "125", "243"], "a": 2, "t": ["15 adds instead of multiplying.", "60 is without repetition.", "", "243 is 3⁵, the wrong way round."], "s": ["Each of the 3 places has 5 choices.", "5 × 5 × 5 = 125."]}, {"id": "pc3", "k": "k1", "l": 2, "q": "How many 4-digit even numbers can be formed from 1, 2, 3, 4, 5 without repetition?", "o": ["72", "120", "48", "24"], "a": 2, "t": ["Fill the units digit first.", "120 ignores the \"even\" condition.", "", "Two choices for the units digit, not one."], "s": ["Units digit: 2 or 4 (2 ways).", "Other 3 places from the 4 remaining digits: ⁴P₃ = 24.", "2 × 24 = 48."]}, {"id": "pc4", "k": "k1", "l": 3, "q": "How many 4-digit numbers greater than 4000 can be formed from 0, 1, 3, 4, 5 without repetition?", "o": ["24", "48", "96", "60"], "a": 1, "t": ["Two choices for the first digit.", "", "First digit must be 4 or 5, not any non-zero digit.", "The other places use the remaining 4 digits, including 0."], "s": ["First digit 4 or 5: 2 ways.", "Remaining 3 places from 4 digits: 4 × 3 × 2 = 24.", "2 × 24 = 48."]}, {"id": "pc5", "k": "k2", "l": 1, "q": "⁶P₂ equals", "o": ["36", "12", "30", "15"], "a": 2, "t": ["6² allows repetition.", "6 × 2 is not ⁶P₂.", "", "15 is ⁶C₂."], "s": ["⁶P₂ = 6 × 5 = 30."]}, {"id": "pc6", "k": "k2", "l": 2, "q": "If ⁿP₄ = 20 × ⁿP₂, then n =", "o": ["8", "6", "5", "7"], "a": 3, "t": ["(n − 2)(n − 3) = 30 for n = 8.", "Check: (n − 2)(n − 3) = 20.", "n must be at least 4 and (n − 2)(n − 3) = 6 for n = 5.", ""], "s": ["ⁿP₄/ⁿP₂ = (n − 2)(n − 3) = 20.", "n − 2 = 5 ⇒ n = 7."]}, {"id": "pc7", "k": "k2", "l": 2, "q": "The number of ways to arrange 5 different books in a row is", "o": ["120", "24", "60", "25"], "a": 0, "t": ["", "24 is 4!.", "60 is 5!/2.", "5 × 5 allows repeats of the same book."], "s": ["5! = 120."]}, {"id": "pc8", "k": "k2", "l": 3, "q": "5 people sit in a row. In how many ways can two particular people never sit together?", "o": ["48", "24", "72", "96"], "a": 2, "t": ["48 is the number of ways they DO sit together.", "24 is 4!.", "", "Subtract from 5! = 120."], "s": ["Total 5! = 120.", "Together: 4! × 2! = 48.", "Never together: 120 − 48 = 72."], "f": {"k": "rows", "r": [["total", "5! = 120"], ["together", "[AB] + 3 others: 4! × 2 = 48"], ["never together", "120 − 48 = 72"]], "hl": 2}}, {"id": "pc9", "k": "k3", "l": 1, "q": "The number of arrangements of the letters of LEVEL is", "o": ["120", "60", "20", "30"], "a": 3, "t": ["L and E are each repeated twice.", "You divided by only one 2!.", "5!/(2!2!) = 30.", ""], "s": ["5 letters: L ×2, E ×2, V.", "5!/(2! 2!) = 30."]}, {"id": "pc10", "k": "k3", "l": 2, "q": "The number of arrangements of the letters of ALLAHABAD is", "o": ["15120", "7560", "3780", "362880"], "a": 1, "t": ["A appears 4 times, so divide by 4!.", "", "Check the L count: it is 2.", "That ignores the repeated letters."], "s": ["9 letters: A ×4, L ×2, H, B, D.", "9!/(4! 2!) = 7560."]}, {"id": "pc11", "k": "k3", "l": 2, "q": "Arrangements of DAUGHTER with the vowels together number", "o": ["40320", "36000", "4320", "720"], "a": 2, "t": ["40320 is all arrangements.", "36000 is \"not all together\".", "", "720 forgets to arrange the vowels inside the block."], "s": ["Vowels A, U, E as one block: 6 units ⇒ 6!.", "Inside the block: 3!.", "6! × 3! = 4320."], "f": {"k": "rows", "r": [["block", "[A U E] D G H T R"], ["units", "6 ⇒ 6! = 720"], ["inside", "× 3! = 4320"]], "hl": 2}}, {"id": "pc12", "k": "k3", "l": 3, "q": "5 boys and 3 girls sit in a row so that no two girls are together. The number of ways is", "o": ["4320", "14400", "720", "2880"], "a": 1, "t": ["4320 treats the girls as one block.", "", "720 counts only part of the arrangement.", "2880 forgets to arrange the boys or girls."], "s": ["Seat the boys: 5! = 120; this makes 6 gaps.", "Place 3 girls in 6 gaps: ⁶P₃ = 120.", "120 × 120 = 14400."]}, {"id": "pc13", "k": "k4", "l": 1, "q": "⁸C₃ equals", "o": ["56", "70", "336", "24"], "a": 0, "t": ["", "70 is ⁸C₄.", "336 is ⁸P₃.", "24 is 4!."], "s": ["⁸C₃ = (8 × 7 × 6)/(3 × 2 × 1) = 56."]}, {"id": "pc14", "k": "k4", "l": 2, "q": "If ⁿC₉ = ⁿC₈, then ⁿC₁₇ =", "o": ["0", "136", "1", "17"], "a": 2, "t": ["17 is ¹⁷C₁.", "ⁿC_n is 1, not 0.", "", "n = 17, and ¹⁷C₁₇ = 1."], "s": ["ⁿC_r = ⁿC_s ⇒ r + s = n ⇒ n = 17.", "¹⁷C₁₇ = 1."]}, {"id": "pc15", "k": "k4", "l": 2, "q": "A committee of 3 men and 2 women is chosen from 6 men and 4 women. The number of ways is", "o": ["120", "210", "252", "24"], "a": 0, "t": ["", "210 is ¹⁰C₄.", "252 is ¹⁰C₅, ignoring the men/women split.", "Use combinations, not just products of small numbers."], "s": ["⁶C₃ × ⁴C₂ = 20 × 6 = 120."]}, {"id": "pc16", "k": "k4", "l": 3, "q": "A committee of 4 from 5 men and 3 women must have at least 1 woman. The number of ways is", "o": ["60", "65", "70", "105"], "a": 1, "t": ["Recheck: 70 − 5.", "", "70 is all committees, including all-men.", "105 = ³C₁ × ⁷C₃ counts some committees more than once."], "s": ["Total ⁸C₄ = 70.", "All men: ⁵C₄ = 5.", "At least one woman: 70 − 5 = 65."]}, {"id": "pc17", "k": "k5", "l": 1, "q": "The number of diagonals of a hexagon is", "o": ["6", "12", "15", "9"], "a": 3, "t": ["6 is the number of sides.", "Subtract the 6 sides from ⁶C₂.", "15 counts sides too.", ""], "s": ["⁶C₂ − 6 = 15 − 6 = 9."]}, {"id": "pc18", "k": "k5", "l": 2, "q": "The number of ways 6 people can sit round a circular table is", "o": ["720", "60", "36", "120"], "a": 3, "t": ["720 is a row; in a circle rotations are the same.", "60 halves for flips, which is only for necklaces.", "36 is 6².", ""], "s": ["Fix one person; arrange the other 5: 5! = 120."]}, {"id": "pc19", "k": "k5", "l": 2, "q": "The number of different necklaces from 7 different beads is", "o": ["5040", "360", "120", "720"], "a": 1, "t": ["5040 is a row.", "", "120 is 5!.", "A necklace can be flipped over: divide by 2."], "s": ["Circle: (7 − 1)! = 720.", "Necklace (flip allowed): 720/2 = 360."]}, {"id": "pc20", "k": "k5", "l": 3, "q": "The number of triangles formed from 10 points, of which 4 are collinear, is", "o": ["112", "114", "120", "116"], "a": 3, "t": ["Only ⁴C₃ = 4 are lost.", "Only ⁴C₃ = 4 are lost.", "Remove the ⁴C₃ = 4 \"triangles\" with collinear vertices.", ""], "s": ["All choices: ¹⁰C₃ = 120.", "Collinear triples: ⁴C₃ = 4.", "120 − 4 = 116."]}]}, {"id": "ss", "n": "Sequences and Series", "k": [{"id": "k1", "n": "AP: nth term and sum", "s": "aₙ = a + (n − 1)d and Sₙ = n/2 [2a + (n − 1)d]. Use n − 1 because the first term is already counted."}, {"id": "k2", "n": "GP: nth term and sum", "s": "aₙ = arⁿ⁻¹; Sₙ = a(rⁿ − 1)/(r − 1); for |r| < 1, S∞ = a/(1 − r)."}, {"id": "k3", "n": "AM and GM", "s": "AM = (a + b)/2, GM = √(ab), and AM ≥ GM for positive numbers. n means between a and b make n + 2 terms."}, {"id": "k4", "n": "Special sums", "s": "Σk = n(n + 1)/2, Σk² = n(n + 1)(2n + 1)/6, Σk³ = [n(n + 1)/2]². Split the general term into these."}, {"id": "k5", "n": "Choosing terms smartly", "s": "AP: a − d, a, a + d. GP: a/r, a, ar. A term from a sum formula: aₙ = Sₙ − Sₙ₋₁."}], "q": [{"id": "ss1", "k": "k1", "l": 1, "q": "The 15th term of 7, 11, 15, … is", "o": ["67", "59", "60", "63"], "a": 3, "t": ["You used 15d instead of 14d.", "Common difference is +4, not −4.", "Check: 7 + 14 × 4.", ""], "s": ["a = 7, d = 4.", "a₁₅ = 7 + 14 × 4 = 63."], "f": {"k": "seq", "items": ["7", "11", "15", "…", "63"], "lab": ["a₁", "a₂", "a₃", "", "a₁₅"], "hl": [4], "op": "+4"}}, {"id": "ss2", "k": "k1", "l": 2, "q": "The sum of the first 20 terms of 2, 5, 8, … is", "o": ["640", "61", "610", "1220"], "a": 2, "t": ["You used nd instead of (n − 1)d.", "61 is the bracket before multiplying by n/2.", "", "You forgot the n/2 at the front."], "s": ["S₂₀ = 20/2 [2(2) + 19(3)].", "= 10 × 61 = 610."]}, {"id": "ss3", "k": "k1", "l": 2, "q": "How many terms of 3, 7, 11, … add up to 210?", "o": ["14", "21", "7", "10"], "a": 3, "t": ["Check S₁₄ = 7 × 58 = 406.", "21 is a term value, not a count.", "S₇ = 7 × 15 = 105.", ""], "s": ["Sₙ = n/2 [6 + 4(n − 1)] = n(2n + 1).", "n(2n + 1) = 210 ⇒ 2n² + n − 210 = 0 ⇒ n = 10."]}, {"id": "ss4", "k": "k1", "l": 3, "q": "In an AP the pth term is q and the qth term is p (p ≠ q). The (p + q)th term is", "o": ["1", "p + q", "pq", "0"], "a": 3, "t": ["Work out d first.", "That would need d = +1; here d = −1.", "No product appears.", ""], "s": ["a + (p − 1)d = q and a + (q − 1)d = p ⇒ d = −1.", "a = p + q − 1.", "a_{p+q} = a + (p + q − 1)(−1) = 0."]}, {"id": "ss5", "k": "k2", "l": 1, "q": "The 6th term of 3, 6, 12, … is", "o": ["192", "96", "18", "48"], "a": 1, "t": ["That is 3 × 2⁶; the power is n − 1 = 5.", "", "That treats it as an AP.", "That is the 5th term."], "s": ["a = 3, r = 2.", "a₆ = 3 × 2⁵ = 96."], "f": {"k": "seq", "items": ["3", "6", "12", "24", "48", "96"], "lab": ["a₁", "a₂", "a₃", "a₄", "a₅", "a₆"], "hl": [5], "op": "×2"}}, {"id": "ss6", "k": "k2", "l": 2, "q": "The sum to infinity of 9 − 3 + 1 − … is", "o": ["27/4", "Not defined", "27/2", "6"], "a": 0, "t": ["", "|r| = 1/3 < 1, so the sum exists.", "r = −1/3, not +1/3.", "6 is the sum of the first two terms."], "s": ["a = 9, r = −1/3.", "S∞ = 9/(1 + 1/3) = 27/4."]}, {"id": "ss7", "k": "k2", "l": 2, "q": "Which term of 2, 2√2, 4, … is 128?", "o": ["13th", "64th", "7th", "12th"], "a": 0, "t": ["", "64 is (√2)¹², not the term number.", "7 would need r = 2.", "The power of √2 is n − 1 = 12, so n = 13."], "s": ["a = 2, r = √2: 2(√2)ⁿ⁻¹ = 128.", "(√2)ⁿ⁻¹ = 64 = (√2)¹² ⇒ n = 13."]}, {"id": "ss8", "k": "k2", "l": 3, "q": "The sum of n terms of 1 + 3 + 9 + … is", "o": ["(3ⁿ⁺¹ − 1)/2", "(3ⁿ − 1)/2", "(3ⁿ − 1)/3", "3ⁿ − 1"], "a": 1, "t": ["That is n + 1 terms.", "", "Divide by r − 1, not r.", "Divide by r − 1 = 2."], "s": ["a = 1, r = 3.", "Sₙ = (3ⁿ − 1)/(3 − 1)."]}, {"id": "ss9", "k": "k3", "l": 1, "q": "The GM of 4 and 9 is", "o": ["36", "6.5", "6", "13"], "a": 2, "t": ["36 is the product; take its root.", "6.5 is the AM.", "", "13 is the sum."], "s": ["GM = √(4 × 9) = 6."]}, {"id": "ss10", "k": "k3", "l": 2, "q": "The AM of two positive numbers is 10 and their GM is 8. The numbers are", "o": ["18 and 2", "16 and 4", "12 and 8", "10 and 8"], "a": 1, "t": ["18 × 2 = 36, not 64.", "", "12 × 8 = 96, but the product must be 64.", "Those are the means themselves."], "s": ["a + b = 20 and ab = 64.", "Roots of t² − 20t + 64 = 0: 16 and 4."]}, {"id": "ss11", "k": "k3", "l": 2, "q": "Three AMs inserted between 3 and 19 are", "o": ["7, 11, 19", "7, 11, 15", "5, 9, 13", "6, 11, 16"], "a": 1, "t": ["19 is an end term, not a mean.", "", "Check: 13 + 4 = 17 ≠ 19.", "d = (19 − 3)/4 = 4, so the steps are equal 4s."], "s": ["5 terms in all, so d = (19 − 3)/4 = 4.", "Means: 7, 11, 15."]}, {"id": "ss12", "k": "k3", "l": 3, "q": "If a, b, c (all positive) are in GP, then log a, log b, log c are in", "o": ["AP", "Both AP and GP", "Neither AP nor GP", "GP"], "a": 0, "t": ["", "They form an AP.", "Logs turn products into sums.", "b² = ac gives 2 log b = log a + log c, an AP condition."], "s": ["b² = ac.", "Take logs: 2 log b = log a + log c, so they are in AP."]}, {"id": "ss13", "k": "k4", "l": 1, "q": "1 + 2 + 3 + … + 50 equals", "o": ["1250", "2550", "1225", "1275"], "a": 3, "t": ["50 × 50/2 uses n instead of n + 1.", "Divide n(n + 1) by 2.", "That is 49 × 50/2.", ""], "s": ["Σk = n(n + 1)/2 = 50 × 51/2 = 1275."]}, {"id": "ss14", "k": "k4", "l": 2, "q": "1² + 2² + … + 10² equals", "o": ["55", "385", "330", "3025"], "a": 1, "t": ["55 is the sum of the numbers.", "", "Check with n(n + 1)(2n + 1)/6.", "3025 is the sum of cubes."], "s": ["10 × 11 × 21/6 = 385."]}, {"id": "ss15", "k": "k4", "l": 2, "q": "1³ + 2³ + … + 10³ equals", "o": ["385", "1000", "3025", "5050"], "a": 2, "t": ["385 is the sum of squares.", "1000 is only 10³.", "", "5050 is 1 + … + 100."], "s": ["[10 × 11/2]² = 55² = 3025."]}, {"id": "ss16", "k": "k4", "l": 3, "q": "The sum to n terms of 1·2 + 2·3 + 3·4 + … is", "o": ["n²(n + 1)²/4", "n(n + 1)(n + 2)/3", "n(n + 1)(2n + 1)/6", "n(n + 1)/2"], "a": 1, "t": ["That is Σk³.", "", "That is Σk² alone; the general term is k² + k.", "That is Σk."], "s": ["Tₖ = k(k + 1) = k² + k.", "Sₙ = n(n + 1)(2n + 1)/6 + n(n + 1)/2 = n(n + 1)(n + 2)/3."]}, {"id": "ss17", "k": "k5", "l": 2, "q": "The sum of n terms of an AP is 3n² + 5n. Its 10th term is", "o": ["59", "35", "62", "350"], "a": 2, "t": ["Check: S₁₀ − S₉ = 350 − 288.", "35 is S₁₀/10.", "", "350 is S₁₀, the total."], "s": ["a₁₀ = S₁₀ − S₉.", "= 350 − 288 = 62."]}, {"id": "ss18", "k": "k5", "l": 2, "q": "Three numbers in AP have sum 15 and product 80. They are", "o": ["2, 5, 8", "1, 5, 9", "3, 5, 7", "4, 5, 6"], "a": 0, "t": ["", "Product 1 × 5 × 9 = 45.", "Product 3 × 5 × 7 = 105.", "Product 4 × 5 × 6 = 120."], "s": ["Take 5 − d, 5, 5 + d (sum 15).", "5(25 − d²) = 80 ⇒ d = 3.", "2, 5, 8."]}, {"id": "ss19", "k": "k5", "l": 3, "q": "Three numbers in GP have product 216 and sum 21. They are", "o": ["3, 6, 12", "4, 6, 9", "1, 6, 36", "2, 6, 18"], "a": 0, "t": ["", "Sum 4 + 6 + 9 = 19.", "Sum 1 + 6 + 36 = 43.", "Sum 2 + 6 + 18 = 26."], "s": ["Take 6/r, 6, 6r (product 216).", "6/r + 6 + 6r = 21 ⇒ 2r² − 5r + 2 = 0 ⇒ r = 2.", "3, 6, 12."]}, {"id": "ss20", "k": "k5", "l": 1, "q": "A sequence has Sₙ = n². Its nth term is", "o": ["2n", "n²", "2n + 1", "2n − 1"], "a": 3, "t": ["Check n = 1: a₁ = 1, not 2.", "n² is the sum, not the term.", "Check n = 1: a₁ = S₁ = 1.", ""], "s": ["aₙ = Sₙ − Sₙ₋₁ = n² − (n − 1)² = 2n − 1."]}]}, {"id": "sl", "n": "Points and Straight Lines", "k": [{"id": "k1", "n": "Distance, section and area", "s": "d = √((x₂ − x₁)² + (y₂ − y₁)²); m : n point = ((mx₂ + nx₁)/(m + n), …); area = ½|x₁(y₂ − y₃) + …|."}, {"id": "k2", "n": "Slope and its uses", "s": "m = (y₂ − y₁)/(x₂ − x₁). Parallel: equal slopes. Perpendicular: m₁m₂ = −1. tan θ = |(m₁ − m₂)/(1 + m₁m₂)|."}, {"id": "k3", "n": "Forms of a line", "s": "Point-slope y − y₁ = m(x − x₁); intercept x/a + y/b = 1; normal x cos α + y sin α = p."}, {"id": "k4", "n": "Distance from a line", "s": "Point to line: |ax₁ + by₁ + c|/√(a² + b²). Parallel lines: match coefficients, then |c₁ − c₂|/√(a² + b²)."}, {"id": "k5", "n": "Collinearity and locus", "s": "Collinear ⇔ zero area. For a locus, call the point (x, y), write the condition, simplify."}], "q": [{"id": "sl1", "k": "k1", "l": 1, "q": "The distance between (2, −1) and (5, 3) is", "o": ["√13", "25", "7", "5"], "a": 3, "t": ["y-difference is 3 − (−1) = 4, not 2.", "25 is d²; take the root.", "Square, add, then root; do not add 3 + 4.", ""], "s": ["d = √(3² + 4²) = 5."], "f": {"k": "plane", "x": [0, 6], "y": [-2, 4], "el": [{"seg": [[2, -1], [5, 3]], "c": 1, "w": 3}, {"seg": [[2, -1], [5, -1]], "c": 5, "dash": 1}, {"seg": [[5, -1], [5, 3]], "c": 5, "dash": 1}, {"p": [2, -1], "l": "(2, −1)", "c": 2}, {"p": [5, 3], "l": "(5, 3)", "c": 2}, {"tx": [3.3, -1.6], "l": "3", "c": 3}, {"tx": [5.2, 1], "l": "4", "c": 3}]}}, {"id": "sl2", "k": "k1", "l": 2, "q": "The point dividing (1, 2) and (7, 8) internally in the ratio 1 : 2 is", "o": ["(5, 6)", "(3, 4)", "(4, 5)", "(13, 14)"], "a": 1, "t": ["That is the ratio 2 : 1 (closer to the second point).", "", "That is the midpoint.", "That is an external division."], "s": ["((1 × 7 + 2 × 1)/3, (1 × 8 + 2 × 2)/3) = (3, 4)."]}, {"id": "sl3", "k": "k1", "l": 2, "q": "The area of the triangle with vertices (0, 0), (4, 0) and (0, 6) is", "o": ["12", "10", "24", "6"], "a": 0, "t": ["", "10 adds the legs.", "You forgot the ½.", "6 is a side, not the area."], "s": ["Right angle at the origin: ½ × 4 × 6 = 12."]}, {"id": "sl4", "k": "k1", "l": 3, "q": "The centroid of (1, 4), (−3, 2) and (5, −3) is", "o": ["(3/2, 3/2)", "(3, 3)", "(1, 3)", "(1, 1)"], "a": 3, "t": ["Divide by 3, not 2.", "That is the sum; divide by 3.", "Check y: (4 + 2 − 3)/3 = 1.", ""], "s": ["((1 − 3 + 5)/3, (4 + 2 − 3)/3) = (1, 1)."]}, {"id": "sl5", "k": "k2", "l": 1, "q": "The slope of the line through (2, 3) and (6, 11) is", "o": ["−2", "1/2", "8/3", "2"], "a": 3, "t": ["Both coordinates increase, so the slope is positive.", "Rise over run, not run over rise.", "Use the change in x, 6 − 2 = 4.", ""], "s": ["m = (11 − 3)/(6 − 2) = 8/4 = 2."]}, {"id": "sl6", "k": "k2", "l": 2, "q": "The slope of a line perpendicular to 3x − 4y + 7 = 0 is", "o": ["3/4", "−3/4", "−4/3", "4/3"], "a": 2, "t": ["3/4 is the slope of the line itself.", "Change the sign too, but of 3/4: gives −4/3.", "", "Flip and change sign."], "s": ["Given slope 3/4.", "Perpendicular slope = −1/(3/4) = −4/3."]}, {"id": "sl7", "k": "k2", "l": 2, "q": "The acute angle between y = x and y = √3 x is", "o": ["60°", "30°", "15°", "45°"], "a": 2, "t": ["60° is the inclination of y = √3x.", "30° is the inclination of y = x/√3; here the lines are at 45° and 60°.", "", "45° is the inclination of y = x."], "s": ["Inclinations 45° and 60°.", "Angle between = 15°."]}, {"id": "sl8", "k": "k2", "l": 3, "q": "2x + ky = 3 and 3x − 6y = 1 are perpendicular when k =", "o": ["4", "1", "−1", "−4"], "a": 1, "t": ["Sign slip in the product.", "", "Check: slopes −2/k and 1/2 multiply to −1/k.", "k = −4 makes them parallel."], "s": ["Slopes −2/k and 1/2.", "(−2/k)(1/2) = −1 ⇒ k = 1."]}, {"id": "sl9", "k": "k3", "l": 1, "q": "The line through (1, −2) with slope 3 is", "o": ["y = 3x − 5", "y = 3x + 5", "y = 3x − 7", "y = 3x + 1"], "a": 0, "t": ["", "Check the point: 3 + 5 ≠ −2.", "Check: 3 − 7 = −4 ≠ −2.", "Check: 3 + 1 = 4 ≠ −2."], "s": ["y + 2 = 3(x − 1).", "y = 3x − 5."]}, {"id": "sl10", "k": "k3", "l": 2, "q": "The line with x-intercept 3 and y-intercept −2 is", "o": ["2x + 3y = 6", "−x/2 + y/3 = 1", "3x − 2y = 6", "2x − 3y = 6"], "a": 3, "t": ["That has y-intercept +2.", "The intercepts are swapped.", "That has intercepts 2 and −3.", ""], "s": ["x/3 + y/(−2) = 1.", "Multiply by 6: 2x − 3y = 6."]}, {"id": "sl11", "k": "k3", "l": 2, "q": "The line through (2, 3) with equal intercepts on the axes is", "o": ["x + y = 1", "x + y = 5", "2x + 3y = 13", "x − y = −1"], "a": 1, "t": ["(2, 3) is not on x + y = 1.", "", "Its intercepts are 13/2 and 13/3.", "Equal intercepts give x + y = a."], "s": ["x/a + y/a = 1 ⇒ x + y = a.", "2 + 3 = a: x + y = 5."]}, {"id": "sl12", "k": "k3", "l": 3, "q": "The normal form of x + √3 y = 8 is", "o": ["x cos 30° + y sin 30° = 4", "x cos 30° + y sin 30° = 8", "x cos 60° + y sin 60° = 4", "x cos 60° + y sin 60° = 8"], "a": 2, "t": ["cos α = 1/2 and sin α = √3/2 gives α = 60°.", "Both the angle and p are off.", "", "Divide by √(1 + 3) = 2 first."], "s": ["Divide by √(1 + 3) = 2: (1/2)x + (√3/2)y = 4.", "cos α = 1/2, sin α = √3/2 ⇒ α = 60°, p = 4."]}, {"id": "sl13", "k": "k4", "l": 1, "q": "The distance of (3, 4) from 3x + 4y − 5 = 0 is", "o": ["20", "5", "4", "25"], "a": 2, "t": ["Divide |20| by √(9 + 16) = 5.", "5 is the distance from the origin to (3, 4).", "", "25 is a² + b²."], "s": ["|9 + 16 − 5|/5 = 20/5 = 4."]}, {"id": "sl14", "k": "k4", "l": 2, "q": "The distance between 3x + 4y = 7 and 6x + 8y + 6 = 0 is", "o": ["1/5", "1", "13/10", "2"], "a": 3, "t": ["Match coefficients: the second line is 3x + 4y + 3 = 0.", "Recheck |−7 − 3|.", "Make the coefficients match before subtracting c values.", ""], "s": ["Second line: 3x + 4y + 3 = 0.", "d = |−7 − 3|/5 = 2."]}, {"id": "sl15", "k": "k4", "l": 2, "q": "The distance of the origin from 12x − 5y + 26 = 0 is", "o": ["26/17", "26", "2", "13"], "a": 2, "t": ["Divide by 13, not by 17.", "Divide by √(144 + 25) = 13.", "", "13 is the denominator."], "s": ["|26|/√(144 + 25) = 26/13 = 2."]}, {"id": "sl16", "k": "k4", "l": 3, "q": "The foot of the perpendicular from the origin to x + y = 4 is", "o": ["(1, 3)", "(2, 2)", "(4, 4)", "(4, 0)"], "a": 1, "t": ["(1, 3) is on the line but not the foot.", "", "(4, 4) is the image of the origin.", "(4, 0) is an intercept."], "s": ["The perpendicular from the origin is y = x.", "Meets x + y = 4 at (2, 2)."], "f": {"k": "plane", "x": [-0.5, 5], "y": [-0.5, 5], "el": [{"ln": [1, 1, -4], "c": 1, "w": 3, "l": "x + y = 4"}, {"seg": [[0, 0], [2, 2]], "c": 2, "dash": 1}, {"p": [0, 0], "l": "O", "c": 3}, {"p": [2, 2], "l": "foot (2, 2)", "c": 2}]}}, {"id": "sl17", "k": "k5", "l": 1, "q": "Are (1, 2), (3, 6) and (5, 10) collinear?", "o": ["No", "Cannot be decided", "Only two of them lie on a line", "Yes"], "a": 3, "t": ["All three satisfy y = 2x.", "The coordinates decide it.", "Any two points lie on a line; the question is all three.", ""], "s": ["Each point satisfies y = 2x.", "So they are collinear."]}, {"id": "sl18", "k": "k5", "l": 2, "q": "(k, 3), (2, 1) and (5, 7) are collinear when k =", "o": ["6", "−3", "1", "3"], "a": 3, "t": ["Check the area with k = 6: not zero.", "Sign slip in the area expression.", "Check: −6 + 18 = 12 ≠ 0.", ""], "s": ["Area = 0: k(1 − 7) + 2(7 − 3) + 5(3 − 1) = 0.", "−6k + 18 = 0 ⇒ k = 3."]}, {"id": "sl19", "k": "k5", "l": 2, "q": "The locus of a point equidistant from (1, 0) and (−1, 0) is", "o": ["y = 0", "x² + y² = 1", "x = 1", "x = 0"], "a": 3, "t": ["y = 0 contains the two points themselves.", "That is the circle through both points.", "That passes through one point.", ""], "s": ["(x − 1)² + y² = (x + 1)² + y².", "−4x = 0 ⇒ x = 0 (the perpendicular bisector)."]}, {"id": "sl20", "k": "k5", "l": 3, "q": "A(1, 0), B(−1, 0). The locus of P with PA² + PB² = 10 is", "o": ["x² + y² = 4", "x² + y² = 5", "x² + y² = 9", "x² + y² = 10"], "a": 0, "t": ["", "2x² + 2y² + 2 = 10, so x² + y² = 4.", "Divide by 2 and subtract 1.", "You forgot the constant 2."], "s": ["PA² + PB² = 2x² + 2y² + 2.", "2x² + 2y² + 2 = 10 ⇒ x² + y² = 4."]}]}, {"id": "ci", "n": "Circles", "k": [{"id": "k1", "n": "Standard and general form", "s": "(x − h)² + (y − k)² = r². For x² + y² + 2gx + 2fy + c = 0: centre (−g, −f), r = √(g² + f² − c). Make the x², y² coefficients 1 first."}, {"id": "k2", "n": "Circle from given data", "s": "Through 3 points: three equations in g, f, c. Diameter ends: centre is the midpoint, or use (x − x₁)(x − x₂) + (y − y₁)(y − y₂) = 0."}, {"id": "k3", "n": "Touching axes, position of a point", "s": "Touches the x-axis: r = |k|; the y-axis: r = |h|. Put a point into S: S < 0 inside, S = 0 on, S > 0 outside."}, {"id": "k4", "n": "Line and circle", "s": "Compare the distance d from the centre to the line with r: d < r cuts, d = r touches, d > r misses. Tangent at (x₁, y₁) to x² + y² = a²: xx₁ + yy₁ = a²."}, {"id": "k5", "n": "Two circles", "s": "Concentric: same centre. Compare the distance between centres with r₁ + r₂ (touch externally) and |r₁ − r₂| (touch internally)."}], "q": [{"id": "ci1", "k": "k1", "l": 1, "q": "The centre and radius of x² + y² − 6x + 8y = 0 are", "o": ["(3, −4) and 5", "(3, −4) and 25", "(6, −8) and 10", "(−3, 4) and 5"], "a": 0, "t": ["", "25 is r².", "Halve the coefficients of x and y.", "Centre is (−g, −f): signs flip."], "s": ["g = −3, f = 4, c = 0.", "Centre (3, −4), r = √(9 + 16) = 5."], "f": {"k": "plane", "x": [-3, 9], "y": [-10, 2], "el": [{"ci": [3, -4, 5], "c": 1, "w": 3}, {"p": [3, -4], "l": "(3, −4)", "c": 2}, {"seg": [[3, -4], [8, -4]], "c": 3}, {"tx": [5.5, -3.5], "l": "r = 5", "c": 3}, {"p": [0, 0], "l": "O", "c": 5}]}}, {"id": "ci2", "k": "k1", "l": 2, "q": "The radius of 2x² + 2y² − 4x + 8y − 8 = 0 is", "o": ["3", "9", "√5", "2√7"], "a": 0, "t": ["", "9 is r².", "You dropped the −c term.", "Divide by 2 first."], "s": ["Divide by 2: x² + y² − 2x + 4y − 4 = 0.", "r = √(1 + 4 + 4) = 3."]}, {"id": "ci3", "k": "k1", "l": 2, "q": "x² + y² + 4x − 6y + k = 0 is a real circle (positive radius) when", "o": ["k ≤ 13", "k < 0", "k > 13", "k < 13"], "a": 3, "t": ["k = 13 gives a point circle (r = 0).", "k between 0 and 13 also works.", "That makes r² negative.", ""], "s": ["r² = 4 + 9 − k > 0.", "k < 13."]}, {"id": "ci4", "k": "k1", "l": 3, "q": "The circle with centre (2, −1) and radius 3 is", "o": ["x² + y² + 4x − 2y − 4 = 0", "x² + y² − 4x + 2y + 4 = 0", "x² + y² − 4x + 2y − 9 = 0", "x² + y² − 4x + 2y − 4 = 0"], "a": 3, "t": ["Signs of the centre are flipped.", "The constant is h² + k² − r² = 5 − 9 = −4.", "The constant is 5 − 9, not −9.", ""], "s": ["(x − 2)² + (y + 1)² = 9.", "x² + y² − 4x + 2y + 5 − 9 = 0."]}, {"id": "ci5", "k": "k2", "l": 1, "q": "The circle with (0, 0) and (6, 8) as ends of a diameter is", "o": ["(x − 3)² + (y − 4)² = 100", "x² + y² − 6x − 8y − 25 = 0", "x² + y² − 6x − 8y = 0", "x² + y² + 6x + 8y = 0"], "a": 2, "t": ["r² = 25, not 100.", "It passes through the origin, so c = 0.", "", "Centre is (3, 4), not (−3, −4)."], "s": ["(x − 0)(x − 6) + (y − 0)(y − 8) = 0.", "x² + y² − 6x − 8y = 0."]}, {"id": "ci6", "k": "k2", "l": 2, "q": "The circle through (0, 0), (4, 0) and (0, 6) is", "o": ["x² + y² − 4x − 6y − 13 = 0", "x² + y² + 4x + 6y = 0", "x² + y² − 2x − 3y = 0", "x² + y² − 4x − 6y = 0"], "a": 3, "t": ["Through the origin means c = 0.", "Check (4, 0): 16 + 16 ≠ 0.", "The intercepts are 2g and 2f, not g and f.", ""], "s": ["c = 0. (4, 0): 16 + 8g = 0 ⇒ g = −2.", "(0, 6): 36 + 12f = 0 ⇒ f = −3."]}, {"id": "ci7", "k": "k2", "l": 2, "q": "The circle with centre (1, 2) passing through (4, 6) is", "o": ["x² + y² − 2x − 4y − 20 = 0", "x² + y² − 2x − 4y + 20 = 0", "x² + y² − 2x − 4y − 25 = 0", "x² + y² + 2x + 4y − 20 = 0"], "a": 0, "t": ["", "The constant is 1 + 4 − 25 = −20.", "You used −r² alone; add h² + k².", "Centre signs are flipped."], "s": ["r² = 9 + 16 = 25.", "(x − 1)² + (y − 2)² = 25 ⇒ x² + y² − 2x − 4y − 20 = 0."]}, {"id": "ci8", "k": "k2", "l": 3, "q": "The circle through (1, 1), (2, −1) and (3, 2) is", "o": ["x² + y² + 5x + y + 4 = 0", "x² + y² − 5x − y + 4 = 0", "x² + y² − 3x − y + 2 = 0", "x² + y² − 5x − y − 4 = 0"], "a": 1, "t": ["Signs of g and f are flipped.", "", "It passes through (1, 1) but not (3, 2).", "Check (1, 1): 2 − 6 − 4 ≠ 0."], "s": ["Substitute the points; subtract to remove c.", "g = −5/2, f = −1/2, c = 4."]}, {"id": "ci9", "k": "k3", "l": 1, "q": "A circle with centre (3, 4) touches the x-axis. Its radius is", "o": ["5", "4", "7", "3"], "a": 1, "t": ["5 is the distance to the origin.", "", "7 adds the coordinates.", "3 is the distance to the y-axis."], "s": ["Distance from (3, 4) to the x-axis = |4| = 4."]}, {"id": "ci10", "k": "k3", "l": 2, "q": "The circle of radius 2 in the first quadrant touching both axes is", "o": ["x² + y² − 4x − 4y + 4 = 0", "x² + y² + 4x + 4y + 4 = 0", "x² + y² − 2x − 2y + 2 = 0", "x² + y² − 4x − 4y + 8 = 0"], "a": 0, "t": ["", "That is in the third quadrant.", "That has radius 0.", "The constant is 4 + 4 − 4 = 4."], "s": ["Centre (2, 2), r = 2.", "(x − 2)² + (y − 2)² = 4 ⇒ x² + y² − 4x − 4y + 4 = 0."]}, {"id": "ci11", "k": "k3", "l": 2, "q": "Where does (1, 2) lie relative to x² + y² − 4x + 2y − 11 = 0?", "o": ["Outside", "On the circle", "Cannot be decided", "Inside"], "a": 3, "t": ["S = −6 < 0.", "S ≠ 0.", "Substitute to decide.", ""], "s": ["S = 1 + 4 − 4 + 4 − 11 = −6 < 0, so inside."]}, {"id": "ci12", "k": "k3", "l": 3, "q": "The circle touching the y-axis at (0, 3) and passing through (1, 0) is", "o": ["x² + y² + 10x − 6y + 9 = 0", "x² + y² − 10x − 6y + 34 = 0", "x² + y² − 6x − 10y + 9 = 0", "x² + y² − 10x − 6y + 9 = 0"], "a": 3, "t": ["The centre is to the right of the y-axis.", "Constant = h² + k² − r² = 25 + 9 − 25 = 9.", "Centre is (5, 3), not (3, 5).", ""], "s": ["Centre (h, 3), r = h.", "(1 − h)² + 9 = h² ⇒ h = 5.", "(x − 5)² + (y − 3)² = 25."]}, {"id": "ci13", "k": "k4", "l": 2, "q": "A chord of x² + y² = 25 is 3 units from the centre. Its length is", "o": ["4", "16", "8", "2√34"], "a": 2, "t": ["4 is half the chord.", "Half-chord is √(25 − 9) = 4.", "", "Subtract, don’t add, inside the root."], "s": ["Half-chord = √(r² − d²) = 4.", "Chord = 8."]}, {"id": "ci14", "k": "k4", "l": 2, "q": "y = mx + 5 touches x² + y² = 5 when m =", "o": ["±4", "±1", "±√5", "±2"], "a": 3, "t": ["1 + m² = 5, so m² = 4.", "Check: 5/√2 ≠ √5.", "Distance 5/√(1 + m²) must equal √5.", ""], "s": ["5/√(1 + m²) = √5 ⇒ 1 + m² = 5.", "m = ±2."]}, {"id": "ci15", "k": "k4", "l": 1, "q": "The line 3x + 4y = 25 and the circle x² + y² = 25", "o": ["cut at two points", "touch", "meet at the centre", "do not meet"], "a": 1, "t": ["Distance 5 equals the radius.", "", "The line does not pass through the origin.", "Distance equals r, not less."], "s": ["Distance from (0, 0) = 25/5 = 5 = r.", "So the line is a tangent."], "f": {"k": "plane", "x": [-6.5, 9], "y": [-6.5, 8], "el": [{"ci": [0, 0, 5], "c": 5, "w": 2}, {"ln": [3, 4, -25], "c": 1, "w": 3}, {"p": [3, 4], "l": "(3, 4)", "c": 2}, {"p": [0, 0], "c": 3}]}}, {"id": "ci16", "k": "k4", "l": 3, "q": "The tangent to x² + y² = 25 at (3, −4) is", "o": ["3x − 4y = 5", "3x + 4y = 25", "3x − 4y = 25", "4x − 3y = 25"], "a": 2, "t": ["Right side is a² = 25.", "Keep the sign of y₁ = −4.", "", "Swap is wrong: use xx₁ + yy₁."], "s": ["xx₁ + yy₁ = a².", "3x − 4y = 25."]}, {"id": "ci17", "k": "k5", "l": 1, "q": "A circle concentric with x² + y² − 4x + 6y − 3 = 0 has centre", "o": ["(4, −6)", "(2, 3)", "(2, −3)", "(−2, 3)"], "a": 2, "t": ["Halve the coefficients.", "Check the sign of the y-coordinate.", "", "Centre is (−g, −f)."], "s": ["g = −2, f = 3 ⇒ centre (2, −3)."]}, {"id": "ci18", "k": "k5", "l": 2, "q": "The circle concentric with x² + y² − 6x + 2y = 0 with radius 2 is", "o": ["x² + y² − 6x + 2y + 4 = 0", "x² + y² − 6x + 2y − 6 = 0", "x² + y² − 6x + 2y + 6 = 0", "x² + y² + 6x − 2y + 6 = 0"], "a": 2, "t": ["The constant is not r².", "Constant = 9 + 1 − 4 = +6.", "", "Concentric keeps the centre (3, −1)."], "s": ["Centre (3, −1).", "(x − 3)² + (y + 1)² = 4 ⇒ constant 9 + 1 − 4 = 6."]}, {"id": "ci19", "k": "k5", "l": 2, "q": "The circles x² + y² = 4 and x² + y² − 6x + 5 = 0", "o": ["cut at two points", "do not meet", "touch externally", "one lies inside the other"], "a": 0, "t": ["", "Distance 3 < r₁ + r₂ = 4.", "r₁ + r₂ = 4 > 3.", "Distance 3 > |r₁ − r₂| = 0."], "s": ["Centres (0, 0) and (3, 0); radii 2 and 2.", "|r₁ − r₂| < 3 < r₁ + r₂ ⇒ two points."]}, {"id": "ci20", "k": "k5", "l": 3, "q": "The circles x² + y² + 2x − 6y + 9 = 0 and x² + y² + 8x − 6y + 9 = 0", "o": ["cut at two points", "do not meet", "touch internally", "touch externally"], "a": 2, "t": ["Distance 3 equals r₂ − r₁ exactly.", "Distance equals r₂ − r₁, so they touch.", "", "r₁ + r₂ = 5 ≠ 3."], "s": ["C₁(−1, 3), r₁ = 1; C₂(−4, 3), r₂ = 4.", "Distance 3 = r₂ − r₁ ⇒ internal touching."], "f": {"k": "plane", "x": [-9, 1], "y": [-1.5, 7.5], "el": [{"ci": [-1, 3, 1], "c": 2, "w": 3}, {"ci": [-4, 3, 4], "c": 1, "w": 3}, {"p": [0, 3], "l": "contact (0, 3)", "c": 3}]}}]}, {"id": "pr", "n": "Probability", "k": [{"id": "k1", "n": "Sample space", "s": "List or count every equally likely outcome first: n coins give 2ⁿ, two dice give 36."}, {"id": "k2", "n": "Counting favourable outcomes", "s": "P = favourable/total. Use nCr when order does not matter."}, {"id": "k3", "n": "Addition rule and complement", "s": "P(A ∪ B) = P(A) + P(B) − P(A ∩ B); P(not A) = 1 − P(A). \"At least one\" = 1 − P(none)."}, {"id": "k4", "n": "Mutually exclusive and exhaustive", "s": "Mutually exclusive: P(A ∩ B) = 0. Exhaustive: together they cover everything, so the probabilities add to 1."}, {"id": "k5", "n": "Odds", "s": "Odds in favour a : b means P = a/(a + b); odds against a : b means P = b/(a + b)."}], "q": [{"id": "pr1", "k": "k1", "l": 1, "q": "The number of outcomes when 3 coins are tossed is", "o": ["3", "8", "9", "6"], "a": 1, "t": ["3 counts the coins, not outcomes.", "", "3² is the wrong way round.", "2 × 3 is not the rule; each coin doubles."], "s": ["2 × 2 × 2 = 8."]}, {"id": "pr2", "k": "k1", "l": 1, "q": "Two dice are thrown. The number of outcomes with sum 7 is", "o": ["7", "3", "5", "6"], "a": 3, "t": ["The sum is 7, the count is 6.", "(1,6) and (6,1) are different.", "(1,6) to (6,1): all six work.", ""], "s": ["(1,6), (2,5), (3,4), (4,3), (5,2), (6,1)."], "f": {"k": "dice", "f": "a+b==7"}}, {"id": "pr3", "k": "k1", "l": 2, "q": "Two dice are thrown. P(sum = 9) is", "o": ["2/9", "1/12", "1/6", "1/9"], "a": 3, "t": ["Count again: (3,6), (4,5), (5,4), (6,3).", "There are 4 ways, not 3.", "1/6 is P(sum = 7).", ""], "s": ["4 favourable of 36.", "4/36 = 1/9."], "f": {"k": "dice", "f": "a+b==9"}}, {"id": "pr4", "k": "k1", "l": 3, "q": "The probability that a leap year has 53 Sundays is", "o": ["3/7", "53/366", "2/7", "1/7"], "a": 2, "t": ["Only 2 of the 7 pairs contain a Sunday.", "That treats days as outcomes.", "", "A leap year has 2 extra days, not 1."], "s": ["366 days = 52 weeks + 2 days.", "The 2 extra days form one of 7 pairs; 2 contain Sunday."]}, {"id": "pr5", "k": "k2", "l": 1, "q": "A card is drawn from a pack of 52. P(king) is", "o": ["4/13", "1/4", "1/52", "1/13"], "a": 3, "t": ["4/13 counts suits.", "1/4 is P(a given suit).", "There are 4 kings.", ""], "s": ["4/52 = 1/13."]}, {"id": "pr6", "k": "k2", "l": 2, "q": "Two cards are drawn from a pack of 52. P(both aces) is", "o": ["2/13", "1/221", "1/26", "1/169"], "a": 1, "t": ["Use ⁴C₂/⁵²C₂.", "", "Check: 6/1326.", "1/169 is with replacement."], "s": ["⁴C₂/⁵²C₂ = 6/1326 = 1/221."]}, {"id": "pr7", "k": "k2", "l": 2, "q": "The letters of ROSE are arranged at random. P(R comes first) is", "o": ["3/4", "1/24", "1/4", "1/6"], "a": 2, "t": ["3/4 is P(R not first).", "1/24 is one particular arrangement.", "", "Each letter is equally likely to be first."], "s": ["3!/4! = 1/4."]}, {"id": "pr8", "k": "k2", "l": 3, "q": "A committee of 3 is chosen from 4 men and 3 women. P(exactly 2 women) is", "o": ["13/35", "12/35", "3/35", "4/35"], "a": 1, "t": ["13/35 is \"at least 2 women\".", "", "3/35 misses the choice of the man.", "4/35 is \"all men\"."], "s": ["³C₂ × ⁴C₁ = 12.", "12/⁷C₃ = 12/35."]}, {"id": "pr9", "k": "k3", "l": 1, "q": "If P(A) = 0.35, then P(not A) is", "o": ["0.35", "1.35", "0.53", "0.65"], "a": 3, "t": ["That is P(A).", "Probabilities cannot exceed 1.", "Subtract from 1.", ""], "s": ["1 − 0.35 = 0.65."]}, {"id": "pr10", "k": "k3", "l": 2, "q": "P(A) = 0.4, P(B) = 0.5, P(A ∩ B) = 0.2. P(A ∪ B) is", "o": ["0.7", "0.2", "0.9", "0.5"], "a": 0, "t": ["", "That is the overlap.", "Subtract the overlap.", "That is P(B)."], "s": ["0.4 + 0.5 − 0.2 = 0.7."], "f": {"k": "venn", "a": "A", "b": "B", "A": 0.2, "AB": 0.2, "B": 0.3, "out": 0.3}}, {"id": "pr11", "k": "k3", "l": 2, "q": "A card is drawn from 52. P(king or heart) is", "o": ["1/52", "4/13", "1/4", "17/52"], "a": 1, "t": ["That is the king of hearts.", "", "That is P(heart).", "The king of hearts is counted twice."], "s": ["4/52 + 13/52 − 1/52 = 16/52 = 4/13."], "f": {"k": "venn", "a": "Kings", "b": "Hearts", "A": 3, "AB": 1, "B": 12, "out": 36}}, {"id": "pr12", "k": "k3", "l": 3, "q": "P(A ∪ B) = 0.8, P(A) = 0.5, P(B) = 0.6. P(A ∩ B) is", "o": ["1.1", "0.2", "0.4", "0.3"], "a": 3, "t": ["1.1 is P(A) + P(B).", "0.5 + 0.6 − 0.8 = 0.3.", "Recheck: 1.1 − 0.8.", ""], "s": ["P(A ∩ B) = P(A) + P(B) − P(A ∪ B) = 0.3."]}, {"id": "pr13", "k": "k4", "l": 1, "q": "If A and B are mutually exclusive, P(A ∩ B) =", "o": ["P(A) + P(B)", "0", "P(A)P(B)", "1"], "a": 1, "t": ["That is P(A ∪ B).", "", "That is for independent events.", "They cannot both happen."], "s": ["Mutually exclusive ⇒ A ∩ B = ∅ ⇒ 0."]}, {"id": "pr14", "k": "k4", "l": 2, "q": "A, B, C are mutually exclusive and exhaustive with P(A) = 2P(B) = 3P(C). P(A) is", "o": ["2/11", "3/11", "6/11", "1/3"], "a": 2, "t": ["2/11 is P(C).", "3/11 is P(B).", "", "They are not equally likely."], "s": ["P(A) = 6k, P(B) = 3k, P(C) = 2k.", "11k = 1 ⇒ P(A) = 6/11."]}, {"id": "pr15", "k": "k4", "l": 2, "q": "On a die, \"even number\" and \"prime number\" are", "o": ["exhaustive", "mutually exclusive", "mutually exclusive and exhaustive", "not mutually exclusive"], "a": 3, "t": ["1 is neither, so they do not cover everything.", "2 is both even and prime.", "2 belongs to both.", ""], "s": ["Even {2, 4, 6}, prime {2, 3, 5}.", "They share 2, so not mutually exclusive."]}, {"id": "pr16", "k": "k4", "l": 3, "q": "P(A) = 0.6 and P(B) = 0.5. Can A and B be mutually exclusive?", "o": ["Only if P(A ∩ B) = 0.1", "Yes, if they are independent", "Yes, always", "No, since P(A) + P(B) > 1"], "a": 3, "t": ["Mutually exclusive means P(A ∩ B) = 0.", "Independence is a different idea.", "Mutually exclusive would need P(A ∪ B) = 1.1.", ""], "s": ["If exclusive, P(A ∪ B) = 1.1 > 1, impossible."]}, {"id": "pr17", "k": "k5", "l": 1, "q": "Odds in favour of an event are 3 : 5. Its probability is", "o": ["3/5", "2/8", "5/8", "3/8"], "a": 3, "t": ["Divide by the total 3 + 5.", "Use 3, not the difference.", "5/8 is the probability against.", ""], "s": ["3/(3 + 5) = 3/8."]}, {"id": "pr18", "k": "k5", "l": 2, "q": "If P(E) = 2/7, the odds against E are", "o": ["5 : 2", "7 : 2", "2 : 7", "2 : 5"], "a": 0, "t": ["", "Compare unfavourable with favourable, not total.", "That compares favourable with total.", "2 : 5 is odds in favour."], "s": ["Unfavourable 5, favourable 2: 5 : 2."]}, {"id": "pr19", "k": "k5", "l": 2, "q": "Odds against A are 7 : 4. A and B are mutually exclusive and exhaustive. Odds in favour of B are", "o": ["4 : 11", "7 : 11", "4 : 7", "7 : 4"], "a": 3, "t": ["Odds compare parts, not part to total.", "Odds compare parts, not part to total.", "That is odds in favour of A.", ""], "s": ["P(A) = 4/11, P(B) = 7/11.", "Odds in favour of B = 7 : 4."]}, {"id": "pr20", "k": "k5", "l": 3, "q": "In a race, odds in favour of horses A, B, C are 1 : 3, 1 : 4, 1 : 5. P(one of them wins) is", "o": ["3/15", "23/60", "1/60", "37/60"], "a": 3, "t": ["Convert each to a probability first: 1/4, 1/5, 1/6.", "Add 1/4 + 1/5 + 1/6.", "That multiplies; only one horse can win.", ""], "s": ["P = 1/4, 1/5, 1/6 (only one can win).", "Sum = 37/60."]}]}, {"id": "se", "n": "Sets", "k": [{"id": "k1", "n": "Elements, subsets, power set", "s": "∈ links an element to a set; ⊂ links a set to a set. A set with n elements has 2ⁿ subsets and 2ⁿ − 1 proper subsets."}, {"id": "k2", "n": "Union, intersection, difference", "s": "A − B keeps what is in A but not in B. A′ is everything in U outside A."}, {"id": "k3", "n": "Laws of sets", "s": "De Morgan: (A ∪ B)′ = A′ ∩ B′ and (A ∩ B)′ = A′ ∪ B′. ∩ distributes over ∪ and vice versa. A − B = A ∩ B′."}, {"id": "k4", "n": "Counting with Venn diagrams", "s": "n(A ∪ B) = n(A) + n(B) − n(A ∩ B). Draw the overlap first, then fill the \"only\" parts."}], "q": [{"id": "se1", "k": "k1", "l": 1, "q": "The number of subsets of {a, b, c} is", "o": ["3", "8", "6", "9"], "a": 1, "t": ["3 counts elements, not subsets.", "", "Count ∅ and the set itself too: 2³.", "3² is the wrong formula."], "s": ["A set with n elements has 2ⁿ subsets: 2³ = 8."]}, {"id": "se2", "k": "k1", "l": 2, "q": "If A = {1, {2}}, which statement is true?", "o": ["2 ∈ A", "{{1}} ∈ A", "{2} ∈ A", "{1, 2} ⊂ A"], "a": 2, "t": ["2 alone is not an element; {2} is.", "{1} is not an element, so {{1}} is not either.", "", "2 is not an element of A, so {1, 2} is not a subset."], "s": ["The elements of A are 1 and {2}.", "So {2} ∈ A."]}, {"id": "se3", "k": "k1", "l": 2, "q": "A set with 4 elements has how many proper subsets?", "o": ["15", "4", "14", "16"], "a": 0, "t": ["", "4 counts elements.", "Only A itself is excluded, not ∅.", "16 includes A itself."], "s": ["2⁴ − 1 = 15."]}, {"id": "se4", "k": "k1", "l": 3, "q": "If n(P(A)) = 64, then n(A) =", "o": ["32", "6", "8", "64"], "a": 1, "t": ["Half of 64 is not the rule.", "",
